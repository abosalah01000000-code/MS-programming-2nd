<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: test picker or a single assigned test, one question per screen, sticky timer, corrections ledger */
:root{
  --bg:#f3f5fa; --card:#ffffff; --fg:#14213d; --muted:#586380; --line:#d9deec;
  --accent:#1d4ed8; --accent-fg:#ffffff; --amber:#b45309; --amber-bg:#fef3c7;
  --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2; --sel-bg:#e3ebff;
  --font:'Cairo','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --card:#16203a; --fg:#e8edf8; --muted:#9aa7c7; --line:#2a375a;
  --accent:#7ba3ff; --accent-fg:#0d1424; --amber:#fcd34d; --amber-bg:#3a2e0b;
  --ok:#4ade80; --ok-bg:#12331f; --bad:#fca5a5; --bad-bg:#3d1717; --sel-bg:#1f3160; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --card:#16203a; --fg:#e8edf8; --muted:#9aa7c7; --line:#2a375a;
  --accent:#7ba3ff; --accent-fg:#0d1424; --amber:#fcd34d; --amber-bg:#3a2e0b;
  --ok:#4ade80; --ok-bg:#12331f; --bad:#fca5a5; --bad-bg:#3d1717; --sel-bg:#1f3160; color-scheme:dark}
*{box-sizing:border-box}
body{direction:rtl;text-align:right;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;font-size:17px;line-height:1.8;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.6rem;font-weight:800;margin:0;line-height:1.4;text-wrap:balance}
h2{font-size:1.2rem;font-weight:800;margin:0;line-height:1.5}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.top{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);align-items:center}
.tag{background:var(--amber-bg);color:var(--amber);border-radius:20px;padding:0 12px;font-weight:700;font-size:.85rem}

.timer .t{font-size:1.35rem;font-variant-numeric:tabular-nums;direction:ltr}
.timer.low{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.9;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover{border-color:var(--accent)}

.opt.sel{background:var(--sel-bg);border-color:var(--accent)}

.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.nav{display:flex;gap:10px;justify-content:space-between}

.btn[disabled]{opacity:.45;cursor:not-allowed}
.dots{display:flex;flex-wrap:wrap;gap:6px}

.dot.done{background:var(--sel-bg);color:var(--accent);border-color:var(--accent)}
.dot.cur{outline:2px solid var(--fg)}
.warn{color:var(--bad);font-weight:700;min-height:1.6em}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.les{display:flex;flex-direction:column;gap:10px;margin-top:12px}

.les .bar{height:10px}
.les .bar i.full{background:var(--ok)}
.fix{display:flex;flex-direction:column;gap:12px}
.fixc{border:1px solid var(--line);border-right:6px solid var(--bad);border-radius:12px;padding:14px 16px;background:var(--card)}
.fixc .a{border-radius:8px;padding:6px 12px;margin-top:8px;font-size:.95rem}
.fixc .a.w{background:var(--bad-bg);color:var(--bad)}
.fixc .a.c{background:var(--ok-bg);color:var(--ok)}
.fixc .e{margin-top:8px;color:var(--muted);font-size:.92rem}
.win{border-color:var(--ok);background:var(--ok-bg)}
.win h1{color:var(--ok)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:var(--card);font-size:.9rem}
.chip b{font-variant-numeric:tabular-nums}
ul.how{margin:8px 0 0;padding:0 20px 0 0;color:var(--muted);font-size:.95rem}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:right;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.tcard:hover{border-color:var(--accent)}
.tcard b{font-size:1.1rem;font-weight:800}
.tcard .code{direction:ltr;text-align:right;font-size:.8rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);min-height:48px}
textarea.copy{width:100%;font:inherit;font-size:.9rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px;margin-top:8px;min-height:84px}
@media (max-width:480px){.les .r{grid-template-columns:100px 1fr 46px}.btn{padding-inline:14px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head><body>

  <div class="dots">${dots}</div></div>`);

  app.querySelectorAll(".dot").forEach(b => b.onclick = () => { S.idx = +b.dataset.k; question(); });

  const n=document.getElementById("next"); if(n) n.onclick=()=>{S.idx++;question()};

function finish(forced){
  const miss = S.pool.filter(i => S.ans[i+":"+S.round] === undefined);
  if(miss.length && !forced){
    S.idx = S.pool.indexOf(miss[0]); question();
    document.getElementById("warn").textContent = `لم تجب بعد عن ${ad(miss.length)} من الأسئلة. الأسئلة غير المجابة غير ملونة في الشريط أسفل الصفحة.`;
    return;
  }
  stopTimer();
  if(S.round === 1) S.used = Math.min(T.min*60, Math.round((Date.now()-S.t0)/1000));
  const wrong = S.pool.filter(i => S.ans[i+":"+S.round] !== Q[i].a);
  wrong.forEach(i => S.tries[i] = (S.tries[i]||0)+1);
  if(S.first === null) S.first = {right: S.pool.length - wrong.length, total: S.pool.length, byL: lessonStats(wrong)};
  results(wrong);
}
function lessonStats(wrong){

    <div class="e">${q.e}</div></div>`;
  }).join("");
  render(`<div class="wrap">
  <div class="card"><p class="muted">${S.round>1?`نتيجة الجولة ${ad(S.round)}`:"نتيجة المحاولة الأولى"} | ${T.title}${S.round===1&&S.timedOut?" | انتهى الوقت":""}</p>
  <div class="score"><b>${ad(right)}</b><span>من ${ad(total)}</span></div>
  ${S.round===1?`<p class="muted">الزمن المستغرق: ${mmss(S.used)} من ${mmss(T.min*60)}</p>`:""}
  <p style="margin-top:6px">${right/total>=.8?"أداء جيد. صحّح الأخطاء الباقية لتصل إلى الدرجة الكاملة.":"راجع التصحيح بعناية ثم أعد الأسئلة التي أخطأت فيها."}</p>
  ${les?`<div class="les">${les}</div>`:""}</div>
  <h2>الأسئلة التي تحتاج إلى مراجعة (${ad(wrong.length)})</h2>
  <div class="fix">${fix}</div>
  <div class="nav"><button class="btn p" id="again" style="flex:1">أعد الأسئلة التي أخطأت فيها (${ad(wrong.length)})</button></div>
  ${S.round===1?copyBlock(false):""}</div>`);
  document.getElementById("again").onclick = () => { S.round++; S.pool = wrong.slice(); S.idx = 0; question(); };
  wireCopy();
}

function win(){
  const f = S.first, hard = T.ids.filter(i => (S.tries[i]||0) >= 2).length;
  render(`<div class="wrap">
  <div class="card win"><p class="muted">${T.title} | اكتمل الاختبار</p><h1>أحسنت. أجبت عن كل الأسئلة إجابة صحيحة.</h1>
  <p style="margin-top:8px">${S.round===1?"من المحاولة الأولى بدون أي خطأ.":`وصلت إلى الدرجة الكاملة في الجولة ${ad(S.round)}.`}</p>
  <div class="chips" style="margin-top:14px">
  <span class="chip">درجة المحاولة الأولى: <b>${ad(f.right)}/${ad(f.total)}</b></span>
  <span class="chip">عدد الجولات: <b>${ad(S.round)}</b></span>
  <span class="chip">زمن المحاولة الأولى: <b>${mmss(S.used)}</b></span>
  ${hard?`<span class="chip">أسئلة أعدتها أكثر من مرة: <b>${ad(hard)}</b></span>`:""}</div></div>
  ${copyBlock(true)}
  <div class="nav"><button class="btn p" id="restart" style="flex:1">إعادة الاختبار من البداية</button></div></div>`);
  document.getElementById("restart").onclick = () => { const n=S.name; fresh(); S.name=n; start(!!decodeURIComponent((location.hash||"").replace(/^#/,""))&&true); };
  wireCopy();
}
window.addEventListener("hashchange", route);
route();
</script>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار الفصل الأول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap">
<style>
/* Layout: test picker or a single assigned test, one question per screen, sticky timer, corrections ledger */
:root{
  --bg:#f3f5fa; --card:#ffffff; --fg:#14213d; --muted:#586380; --line:#d9deec;
  --accent:#1d4ed8; --accent-fg:#ffffff; --amber:#b45309; --amber-bg:#fef3c7;
  --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2; --sel-bg:#e3ebff;
  --font:'Cairo','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --card:#16203a; --fg:#e8edf8; --muted:#9aa7c7; --line:#2a375a;
  --accent:#7ba3ff; --accent-fg:#0d1424; --amber:#fcd34d; --amber-bg:#3a2e0b;
  --ok:#4ade80; --ok-bg:#12331f; --bad:#fca5a5; --bad-bg:#3d1717; --sel-bg:#1f3160; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --card:#16203a; --fg:#e8edf8; --muted:#9aa7c7; --line:#2a375a;
  --accent:#7ba3ff; --accent-fg:#0d1424; --amber:#fcd34d; --amber-bg:#3a2e0b;
  --ok:#4ade80; --ok-bg:#12331f; --bad:#fca5a5; --bad-bg:#3d1717; --sel-bg:#1f3160; color-scheme:dark}
*{box-sizing:border-box}
body{direction:rtl;text-align:right;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;font-size:17px;line-height:1.8;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.6rem;font-weight:800;margin:0;line-height:1.4;text-wrap:balance}
h2{font-size:1.2rem;font-weight:800;margin:0;line-height:1.5}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.top{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);align-items:center}
.tag{background:var(--amber-bg);color:var(--amber);border-radius:20px;padding:0 12px;font-weight:700;font-size:.85rem}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:800}
.timer .t{font-size:1.35rem;font-variant-numeric:tabular-nums;direction:ltr}
.timer.low{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.9;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover{border-color:var(--accent)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem;margin-top:2px}
.opt.sel{background:var(--sel-bg);border-color:var(--accent)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{justify-content:center;align-items:center;font-size:1.2rem;font-weight:800;min-height:64px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{display:flex;gap:10px;justify-content:space-between}
.btn{font:inherit;font-weight:800;border-radius:12px;border:2px solid var(--accent);padding:10px 20px;cursor:pointer;min-height:48px;background:transparent;color:var(--accent)}
.btn.p{background:var(--accent);color:var(--accent-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;padding:0}
.dot.done{background:var(--sel-bg);color:var(--accent);border-color:var(--accent)}
.dot.cur{outline:2px solid var(--fg)}
.warn{color:var(--bad);font-weight:700;min-height:1.6em}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.les{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.les .r{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.les .bar{height:10px}
.les .bar i.full{background:var(--ok)}
.fix{display:flex;flex-direction:column;gap:12px}
.fixc{border:1px solid var(--line);border-right:6px solid var(--bad);border-radius:12px;padding:14px 16px;background:var(--card)}
.fixc .a{border-radius:8px;padding:6px 12px;margin-top:8px;font-size:.95rem}
.fixc .a.w{background:var(--bad-bg);color:var(--bad)}
.fixc .a.c{background:var(--ok-bg);color:var(--ok)}
.fixc .e{margin-top:8px;color:var(--muted);font-size:.92rem}
.win{border-color:var(--ok);background:var(--ok-bg)}
.win h1{color:var(--ok)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:var(--card);font-size:.9rem}
.chip b{font-variant-numeric:tabular-nums}
ul.how{margin:8px 0 0;padding:0 20px 0 0;color:var(--muted);font-size:.95rem}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:right;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.tcard:hover{border-color:var(--accent)}
.tcard b{font-size:1.1rem;font-weight:800}
.tcard .code{direction:ltr;text-align:right;font-size:.8rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);min-height:48px}
textarea.copy{width:100%;font:inherit;font-size:.9rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px;margin-top:8px;min-height:84px}
@media (max-width:480px){.les .r{grid-template-columns:100px 1fr 46px}.btn{padding-inline:14px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head><body>

function order(q){
  const key = q.id + ":" + S.round;
  if(!S.shown[key]) S.shown[key] = q.k==="mc" ? shuffle(q.o.map((_,i)=>i)) : [0,1];
  return S.shown[key];
}

function route(){
  stopTimer();
  const code = decodeURIComponent((location.hash||"").replace(/^#/,""));
  T = TESTS.find(t => t.id === code);
  if(T){ fresh(); start(true); } else { picker(); }
}
function picker(){
  render(`<div class="wrap"><div class="card"><a href="index.html" class="btn" style="display:inline-block;text-decoration:none;margin-bottom:12px">← الرجوع إلى المنصة</a><p class="muted">البرمجة والذكاء الاصطناعي | الصف الثاني الثانوي | الفصل الدراسي الأول</p>
  <h1>اختبارات الفصل الأول</h1><p style="margin-top:8px">اختر الاختبار المخصص لمجموعتك. كل اختبار له مدة زمنية بحسب عدد أسئلته.</p></div>
  <div class="tests">${TESTS.map(t=>`<button class="tcard" data-id="${t.id}"><b>${t.title}</b><span class="muted">${t.sub}</span><span>${ad(t.ids.length)} سؤالاً | ${ad(t.min)} دقيقة</span><span class="code">#${t.id}</span></button>`).join("")}</div></div>`);
  app.querySelectorAll(".tcard").forEach(b => b.onclick = () => { T = TESTS.find(t=>t.id===b.dataset.id); fresh(); start(false); });
}

function start(assigned){
  render(`<div class="wrap">
  <div class="card"><a href="index.html" class="btn" style="display:inline-block;text-decoration:none;margin-bottom:12px">← الرجوع إلى المنصة</a><p class="muted">البرمجة والذكاء الاصطناعي | الصف الثاني الثانوي | الفصل الدراسي الأول</p>
  <h1>${T.title}</h1><p>${T.sub}</p>
  <div class="chips" style="margin-top:12px"><span class="chip">عدد الأسئلة: <b>${ad(T.ids.length)}</b></span><span class="chip">المدة: <b>${ad(T.min)} دقيقة</b></span></div>
  <div class="field"><label for="nm">اسمك</label><input id="nm" type="text" autocomplete="name" placeholder="اكتب اسمك الثلاثي" value="${S.name.replace(/"/g,"&quot;")}"></div>
  <ul class="how"><li>تبدأ المدة عند الضغط على «ابدأ الاختبار»، وينتهي الاختبار تلقائياً عند انتهائها.</li>
  <li>بعد التصحيح تظهر الأسئلة التي أخطأت فيها مع التفسير.</li>
  <li>أعد الأسئلة الخاطئة (دون مؤقت) حتى تصل إلى الدرجة الكاملة.</li></ul>
  <div class="nav" style="margin-top:18px">${assigned?"":`<button class="btn" id="back">كل الاختبارات</button>`}<button class="btn p" id="go" style="flex:1">ابدأ الاختبار</button></div></div></div>`);
  const b = document.getElementById("back"); if(b) b.onclick = picker;
  document.getElementById("go").onclick = () => {
    S.name = document.getElementById("nm").value.trim();
    S.t0 = Date.now(); S.deadline = S.t0 + T.min*60000; S.idx = 0;
    question(); runTimer();
  };
}
function runTimer(){
  stopTimer();
  timerId = setInterval(() => {
    const left = Math.round((S.deadline - Date.now())/1000);
    const box = document.getElementById("tm");
    if(box){ box.textContent = mmss(left); box.parentElement.classList.toggle("low", left <= Math.min(300, T.min*6)); }
    if(left <= 0){ stopTimer(); S.timedOut = true; finish(true); }
  }, 1000);
}

function question(){
  const id = S.pool[S.idx], q = Q[id], ord = order(q);
  const answered = S.pool.filter(i => S.ans[i+":"+S.round] !== undefined).length;
  const cur = S.ans[id+":"+S.round];
  const opts = ord.map((oi,pos) => {
    const sel = cur===oi ? " sel" : "";
    return q.k==="tf"
      ? `<button class="opt${sel}" data-o="${oi}" aria-pressed="${cur===oi}">${q.o[oi]}</button>`
      : `<button class="opt${sel}" data-o="${oi}" aria-pressed="${cur===oi}"><span class="l">${LET[pos]}</span><span>${q.o[oi]}</span></button>`;
  }).join("");
  const dots = S.pool.map((i,k)=>`<button class="dot${S.ans[i+":"+S.round]!==undefined?" done":""}${k===S.idx?" cur":""}" data-k="${k}" aria-label="سؤال ${ad(k+1)}">${ad(k+1)}</button>`).join("");
  const last = S.idx === S.pool.length-1;
  const timed = S.round === 1;
  const left = Math.round((S.deadline - Date.now())/1000);
  render(`<div class="wrap">
  ${timed?`<div class="timer${left<=Math.min(300,T.min*6)?" low":""}"><span>الوقت المتبقي</span><span class="t" id="tm">${mmss(left)}</span></div>`:""}
  <div class="top"><div class="meta"><span>${S.round>1?`الجولة ${ad(S.round)} | `:""}سؤال ${ad(S.idx+1)} من ${ad(S.pool.length)}</span><span class="tag">الدرس ${LN[q.l]}</span></div>
  <div class="bar"><i style="width:${answered/S.pool.length*100}%"></i></div></div>
  <div class="card"><div class="qtext">${q.q}</div><div class="${q.k==="tf"?"tfrow":"opts"}">${opts}</div></div>
  <div class="warn" id="warn" role="status"></div>
  <div class="nav"><button class="btn" id="prev" ${S.idx===0?"disabled":""}>السابق</button>
  ${last?`<button class="btn p" id="fin">إنهاء وتصحيح</button>`:`<button class="btn p" id="next">التالي</button>`}</div>
  <div class="dots">${dots}</div></div>`);
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.ans[id+":"+S.round] = +b.dataset.o; question(); });
  app.querySelectorAll(".dot").forEach(b => b.onclick = () => { S.idx = +b.dataset.k; question(); });
  const p=document.getElementById("prev"); if(p) p.onclick=()=>{S.idx--;question()};
  const n=document.getElementById("next"); if(n) n.onclick=()=>{S.idx++;question()};
  const f=document.getElementById("fin"); if(f) f.onclick=()=>finish(false);
}

function finish(forced){
  const miss = S.pool.filter(i => S.ans[i+":"+S.round] === undefined);
  if(miss.length && !forced){
    S.idx = S.pool.indexOf(miss[0]); question();
    document.getElementById("warn").textContent = `لم تجب بعد عن ${ad(miss.length)} من الأسئلة. الأسئلة غير المجابة غير ملونة في الشريط أسفل الصفحة.`;
    return;
  }
  stopTimer();
  if(S.round === 1) S.used = Math.min(T.min*60, Math.round((Date.now()-S.t0)/1000));
  const wrong = S.pool.filter(i => S.ans[i+":"+S.round] !== Q[i].a);
  wrong.forEach(i => S.tries[i] = (S.tries[i]||0)+1);
  if(S.first === null) S.first = {right: S.pool.length - wrong.length, total: S.pool.length, byL: lessonStats(wrong)};
  results(wrong);
}
function lessonStats(wrong){
  const o = {};
  T.ids.forEach(i => { const l=Q[i].l; o[l] = o[l]||[0,0]; o[l][1]++; if(!wrong.includes(i)) o[l][0]++; });
  return o;
}
function summary(done){
  const f = S.first;
  return `الاسم: ${S.name||"—"}\nالاختبار: ${T.title}\nدرجة المحاولة الأولى: ${ad(f.right)} من ${ad(f.total)}\nزمن المحاولة الأولى: ${mmss(S.used)}${S.timedOut?" (انتهى الوقت)":""}\nعدد الجولات حتى الدرجة الكاملة: ${done?ad(S.round):"لم تكتمل بعد"}`;
}
function copyBlock(done){
  return `<div class="card"><h2>نتيجتك لإرسالها إلى المعلم</h2><textarea class="copy" id="sum" readonly>${summary(done)}</textarea>
  <div class="nav" style="margin-top:8px"><button class="btn" id="cp" style="flex:1">نسخ النتيجة</button></div><div class="muted" id="cpm" role="status"></div></div>`;
}
function wireCopy(){
  const b = document.getElementById("cp"); if(!b) return;
  b.onclick = async () => {
    const ta = document.getElementById("sum"), m = document.getElementById("cpm");
    try { await navigator.clipboard.writeText(ta.value); m.textContent = "تم النسخ."; }
    catch(e){ ta.focus(); ta.select(); m.textContent = "حدد النص وانسخه يدوياً."; }
  };
}

function results(wrong){
  const total = S.pool.length, right = total - wrong.length;
  if(wrong.length === 0) return win();
  const les = S.round===1 ? Object.entries(S.first.byL).map(([l,[r,t]]) =>
    `<div class="r"><span>${LN[l]}</span><div class="bar"><i class="${r===t?"full":""}" style="width:${r/t*100}%"></i></div><span>${ad(r)}/${ad(t)}</span></div>`).join("") : "";
  const fix = wrong.map(i => {
    const q = Q[i], mine = S.ans[i+":"+S.round];
    return `<div class="fixc"><div style="font-weight:700">${q.q}</div>
    <div class="a w">إجابتك: ${mine===undefined?"لم تُجب":q.o[mine]}</div><div class="a c">الإجابة الصحيحة: ${q.o[q.a]}</div>
    <div class="e">${q.e}</div></div>`;
  }).join("");
  render(`<div class="wrap">
  <div class="card"><p class="muted">${S.round>1?`نتيجة الجولة ${ad(S.round)}`:"نتيجة المحاولة الأولى"} | ${T.title}${S.round===1&&S.timedOut?" | انتهى الوقت":""}</p>
  <div class="score"><b>${ad(right)}</b><span>من ${ad(total)}</span></div>
  ${S.round===1?`<p class="muted">الزمن المستغرق: ${mmss(S.used)} من ${mmss(T.min*60)}</p>`:""}
  <p style="margin-top:6px">${right/total>=.8?"أداء جيد. صحّح الأخطاء الباقية لتصل إلى الدرجة الكاملة.":"راجع التصحيح بعناية ثم أعد الأسئلة التي أخطأت فيها."}</p>
  ${les?`<div class="les">${les}</div>`:""}</div>
  <h2>الأسئلة التي تحتاج إلى مراجعة (${ad(wrong.length)})</h2>
  <div class="fix">${fix}</div>
  <div class="nav"><button class="btn p" id="again" style="flex:1">أعد الأسئلة التي أخطأت فيها (${ad(wrong.length)})</button></div>
  ${S.round===1?copyBlock(false):""}</div>`);
  document.getElementById("again").onclick = () => { S.round++; S.pool = wrong.slice(); S.idx = 0; question(); };
  wireCopy();
}

function win(){
  const f = S.first, hard = T.ids.filter(i => (S.tries[i]||0) >= 2).length;
  render(`<div class="wrap">
  <div class="card win"><p class="muted">${T.title} | اكتمل الاختبار</p><h1>أحسنت. أجبت عن كل الأسئلة إجابة صحيحة.</h1>
  <p style="margin-top:8px">${S.round===1?"من المحاولة الأولى بدون أي خطأ.":`وصلت إلى الدرجة الكاملة في الجولة ${ad(S.round)}.`}</p>
  <div class="chips" style="margin-top:14px">
  <span class="chip">درجة المحاولة الأولى: <b>${ad(f.right)}/${ad(f.total)}</b></span>
  <span class="chip">عدد الجولات: <b>${ad(S.round)}</b></span>
  <span class="chip">زمن المحاولة الأولى: <b>${mmss(S.used)}</b></span>
  ${hard?`<span class="chip">أسئلة أعدتها أكثر من مرة: <b>${ad(hard)}</b></span>`:""}</div></div>
  ${copyBlock(true)}
  <div class="nav"><button class="btn p" id="restart" style="flex:1">إعادة الاختبار من البداية</button></div></div>`);
  document.getElementById("restart").onclick = () => { const n=S.name; fresh(); S.name=n; start(!!decodeURIComponent((location.hash||"").replace(/^#/,""))&&true); };
  wireCopy();
}
window.addEventListener("hashchange", route);
route();
</script>

</body></html>

"essay":[{"q":"اشرح كيف يمكن للموقع الإلكتروني الجمع بين معلومات متنوعة ودعم التفاعل ثنائي الاتجاه.","m":"يجمع الموقع الإلكتروني النصوص والصور والفيديو والصوت معاً وعرضها في صفحات وأقسام منظمة، ويمكن تحديث معلوماته في أي وقت. ويدعم التفاعل ثنائي الاتجاه عبر أدوات مثل النماذج والتعليقات التي يستجيب فيها المستخدم ويشارك، فلا يقتصر على استقبال المحتوى."},{"q":"اذكر اثنين من العيوب أو القيود المحتملة لاستخدام موقع إلكتروني كقناة رئيسية لمؤسسة خدمية تخاطب عائلات قد لا تمتلك اتصالاً منزلياً بالإنترنت.","m":"(1) يحتاج معظم وظائف الموقع إلى اتصال بالشبكة، فلا تصل خدماته إلى الأسر التي ليس لديها إنترنت منزلي. (2) يحتاج المستخدم غالباً إلى فتح الموقع للوصول إلى محتواه ما لم تُستخدم إشعارات، وقد تتأثر سرعة العرض والتحميل بالجهاز والشبكة. لذلك يجب أن تدعم المؤسسة الموقع بوسائل أخرى كالتلفزيون أو المطبوعات."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٦٥","mcq":[{"q":"ما الوسيلة التي تجمع بين الفيديو والصوت وعادةً يكون الاتصال فيها من المرسل إلى المتلقي للوصول إلى جمهور كبير؟","o":["الصحيفة","التلفزيون","الراديو","البريد الإلكتروني"],"c":1},{"q":"أي مما يأتي يُعد من نقاط قوة المواقع الإلكترونية؟","o":["تقتصر على اتجاه واحد دائم ولا تقبل التعليقات.","تحتاج حتماً إلى شبكة الإنترنت في كل وظائفها دون استثناء.","يمكن تحديث المعلومات فيها في أي وقت والتفاعل مع المستخدمين.","لا يمكن عرض الصور أو الفيديو فيها."],"c":2},{"q":"ما الوسيلة الأنسب إذا كان الغرض هو إتاحة كمية كبيرة من المعلومات وتفاصيلها وتنظيمها في صفحات وأقسام متعددة؟","o":["الراديو","الصحيفة المطبوعة","الموقع الإلكتروني","الرسائل النصية المباشرة"],"c":2},{"q":"الوسيلة التي تتيح للمستخدمين نشر المعلومات ومشاركتها بسرعة هي:","o":["الصحيفة","التلفزيون","وسائل التواصل الاجتماعي","الراديو"],"c":2}],"essay":[{"q":"قارن بالتفصيل بين خصائص التلفزيون والصحيفة من حيث نوع المعلومات المنقولة وطريقة الاتصال والاعتماد على شبكة الإنترنت.","h":1},{"q":"اشرح نقاط القوة الخمس الرئيسية للمواقع الإلكترونية.","m":"(1) دمج النص والصور والفيديو والصوت في مكان واحد. (2) إمكان تحديث المعلومات في أي وقت. (3) الوصول إليها من أي مكان به شبكة. (4) دعم التفاعل ثنائي الاتجاه عبر النماذج والتعليقات. (5) العمل عبر المتصفح على أجهزة مختلفة دون برامج خاصة."},{"q":"بيّن كيف تتكامل وسائل الإعلام المختلفة في الواقع العملي عبر ضرب مثال عملي يجمع بين التلفزيون والموقع الإلكتروني ووسائل التواصل الاجتماعي.","m":"تعرض مؤسسة إعلاناً تلفزيونياً يصل إلى عدد كبير من الناس في آن واحد ويوجههم إلى موقعها الإلكتروني للحصول على التفاصيل، ثم يشجع الموقع الزوار على مشاركة المعلومات عبر وسائل التواصل الاجتماعي، فتنتشر بالتناقل الشفهي. فيؤدي كل وسيط ما يجيده، ويكمّل بعضها بعضاً."},{"q":"ناقش القيود الثلاثة للمواقع الإلكترونية موضحاً تأثير كل قيد على تجربة المستخدم.","m":"(1) حاجة معظم الوظائف إلى الشبكة: يُحرم من لا يملك اتصالاً بالإنترنت من الاستفادة من الموقع. (2) حاجة المستخدم إلى فتح الموقع للوصول إلى محتواه ما لم توجد إشعارات: قد يفوته الجديد فيقل تفاعله. (3) اختلاف سرعة العرض والتحميل بحسب الجهاز والشبكة: يبطئ التصفح ويزعج المستخدم وقد يدفعه إلى المغادرة."}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٦٦","mcq":[{"q":"وسيلة إعلامية تعتمد على الصوت فقط ويمكن الاستماع إليها أثناء أداء مهام أخرى بحسب التغطية هي:","o":["التلفزيون","الراديو","الموقع الإلكتروني","الصحيفة"],"c":1},{"q":"تقنية أو وسيلة تتيح التوصيل بشكل فردي ومباشر لأشخاص محددين هي:","o":["التلفزيون","وسائل التواصل الاجتماعي","البريد الإلكتروني أو الرسائل المباشرة","الصحيفة اليومية"],"c":2},{"q":"من قيود المواقع الإلكترونية التي تم توضيحها في الدرس:","o":["استحالة تحديث محتواها بعد إنشائها.","غالباً يحتاج المستخدم إلى فتح الموقع للوصول إلى محتواه ما لم تتوفر إشعارات.","عدم إمكانية دمج الصور والنصوص معاً.","كونها وسيلة مطبوعة ورقية بالكامل."],"c":1},{"q":"أي العبارات التالية تعبير دقيق عن الفكرة الرئيسة لاختيار الوسائط؟","o":["توجد وسيلة واحدة مثالية ومطلوبة لكل الأغراض بشكل دائم.","لا توجد وسيلة واحدة هي الأفضل لكل شيء، ويجب الاختيار بناءً على الغرض والجمهور مع الجمع بين الوسائط.","يجب دائماً استخدام التلفزيون وحده لتجنب تكلفة الإنترنت.","وسائل التواصل الاجتماعي تغني عن أي موقع إلكتروني أو وسيلة أخرى نهائياً."],"c":1}],"essay":[{"q":"اشرح خصائص الراديو موضحاً مميزاته في الاستماع أثناء التنقل وقيود اتصاله أحادية الاتجاه.","m":"الراديو وسيلة تعتمد على الصوت فقط، ومن مميزاته إمكان الاستماع إليه أثناء التنقل أو أداء مهام أخرى بحسب التغطية ووسيلة الاستقبال. وقيد اتصاله أنه عادةً باتجاه واحد من المرسل إلى المستقبل، فلا يستطيع المستمع الاستجابة أو المشاركة أثناء البث."},{"q":"وضح كيف يمكن للمواقع الإلكترونية توفير تفاعل ثنائي الاتجاه موضحاً الأدوات المستخدمة في ذلك.","m":"يتيح الموقع الإلكتروني للمستخدم أن يستجيب ويشارك لا أن يستقبل فقط، وذلك عبر أدوات مثل النماذج (لإدخال البيانات وإرسالها) والتعليقات (لإبداء الرأي)، فيتحقق تفاعل في الاتجاهين بين المستخدم وصاحب الموقع."},{"q":"اذكر الغرض المناسب لكل من الوسائط الآتية: (التلفزيون، الموقع الإلكتروني، البريد الإلكتروني، وسائل التواصل الاجتماعي).","m":"التلفزيون: إعلام عدد كبير من الناس في آن واحد بانتشار واسع. الموقع الإلكتروني: تقديم معلومات تفصيلية منظمة في صفحات وأقسام متعددة. البريد الإلكتروني: إيصال المعلومات مباشرة لأشخاص محددين كحملة ترويجية موجهة. وسائل التواصل الاجتماعي: نشر المعلومات بسرعة وانتشارها بالتناقل الشفهي بين الناس."},{"q":"ناقش التحديات التي تواجه المؤسسات عند محاولة الوصول إلى جمهور بلا إنترنت منزلي وما البدائل أو الحلول الإعلامية المتاحة.","m":"التحدي أن هذه الفئة لا تستطيع الوصول إلى المواقع ووسائل التواصل الاجتماعي لحاجتها إلى الإنترنت، فتفوتها الرسائل الإعلامية الرقمية. والحل اللجوء إلى وسائل لا تعتمد على الإنترنت مثل التلفزيون والراديو والصحف المطبوعة، مع الجمع بينها وبين الوسائل الرقمية لمن يستطيع استخدامها."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٦٧","mcq":[{"q":"وسيلة مطبوعة تبقى موجودة مادياً ويمكن قراءتها دون اتصال بالإنترنت وتتكون من نص وصور هي:","o":["التلفزيون","الصحيفة","الموقع الإلكتروني","الراديو"],"c":1},{"q":"أي من الوسائط التالية يُعد الأنسب لتحقيق انتشار واسع عبر التناقل الشفهي ومشاركة المستخدمين؟","o":["الراديو","الصحيفة المطبوعة","وسائل التواصل الاجتماعي","البريد الإلكتروني الفردي"],"c":2},{"q":"من الخصائص الأساسية للموقع الإلكتروني أنه:","o":["اتجاه واحد أساساً لكن التفاعل ثنائي الاتجاه من خلال النماذج والتعليقات.","ينقل الصوت فقط ولا يدعم النصوص أو الصور.","لا يمكن تحديثه أبداً بعد النشر الأول.","يستحيل الوصول إليه عبر متصفحات الهواتف المحمولة."],"c":0},{"q":"الغرض الأساسي من استخدام إعلانات التلفزيون أو إعلانات وسائل التواصل الاجتماعي هو:","o":["تقديم تفاصيل دقيقة وموسوعية في صفحات متعددة.","إعلام عدد كبير من الناس في آن واحد بانتشار واسع.","إرسال رسالة سرية لشخص واحد فقط.","قراءة مقالات طويلة دون إنترنت."],"c":1}],"essay":[{"q":"ناقش دور الصحف المطبوعة وخصائصها مقارنة بالوسائط الرقمية الحديثة من حيث الاتصال والوجود المادي.","h":1},{"q":"اشرح كيف يمكن اختيار الوسيلة الإعلامية المناسبة بناءً على تحليل الجمهور والغرض والرسالة المستهدفة.","m":"يبدأ المسؤول بتحديد الغرض (إعلام عدد كبير، أو تقديم تفاصيل، أو مخاطبة أفراد محددين) ثم يحلل الجمهور وإمكاناته مثل توفر الإنترنت، ويراعي الرسالة المستهدفة والموارد المتاحة، ثم يطابق الوسيلة المناسبة: التلفزيون للانتشار الواسع، والموقع للتفاصيل، والبريد الإلكتروني للأفراد، ووسائل التواصل للانتشار بالتناقل الشفهي. وغالباً يُجمع بين أكثر من وسيط."},{"q":"تحدث عن أهمية الجمع بين الوسائط المختلفة في الحملات الإعلامية وتوجيه الجمهور بينها بفعالية.","m":"لا توجد وسيلة واحدة هي الأفضل لكل غرض. فالجمع بين الوسائط يجعل كل وسيلة تؤدي ما تجيده، ويوسع الوصول إلى فئات الجمهور المختلفة. مثال ذلك إعلان تلفزيوني يوجه الجمهور إلى موقع إلكتروني يقدم التفاصيل، ومنه إلى وسائل التواصل لنشر المعلومة، فتتحقق الحملة بفاعلية أكبر."},{"q":"وضح المقصود بمصطلحي «الاتصال أحادي الاتجاه» و«الاتصال ثنائي الاتجاه» مع أمثلة لكل منهما.","m":"الاتصال أحادي الاتجاه: ينتقل فيه المحتوى من المرسل إلى المستقبل فقط دون استجابة، كما في التلفزيون والراديو والصحيفة المطبوعة. الاتصال ثنائي الاتجاه: يستطيع فيه المستخدمون الاستجابة والمشاركة والتفاعل، كما في النماذج والتعليقات في المواقع الإلكترونية، وكالنشر والمشاركة والتفاعل في وسائل التواصل الاجتماعي."}]}],"4-2":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٦٨","mcq":[{"q":"أي من الخيارات التالية يمثل التعريف الأدق لمصطلح «شخصية المستخدم (Persona)»؟","o":["تمثيل بنسخته النهائية يتضمن الألوان والزخارف التصميمية المعقدة.","تمثيل لنوع أو نمط من المستخدمين يستند قدر الإمكان إلى بحث أو بيانات عن أهدافهم واحتياجاتهم وسلوكهم وسياقهم.","أداة لتقييم أداء خادم الموقع الإلكتروني وسرعة استجابته التقنية.","نهج تصميم يعطي الأولوية لراحة منشئ الموقع ومطوريه فقط."],"c":1},{"q":"ماذا يمثل «المخطط الهيكلي (Wireframe)» في مراحل بناء وتخطيط مواقع الويب؟","o":["تصميم بصري نهائي يحتوي على كافة الألوان والخطوط الزخرفية.","خوارزمية برمجة خلفية لتنظيم قواعد البيانات.","مخطط أولي لتحديد أماكن العناصر وأولوياتها بمعزل عن التصميم البصري.","أداة قياس سرعة تحميل صفحات الإنترنت عبر الهواتف الذكية."],"c":2}],"essay":[{"q":"اشرح المقصود بمفهوم «شخصية المستخدم (Persona)»، وبيّن كيف تساعد فريق العمل في عملية التصميم دون الاعتماد على الافتراضات الشخصية.","m":"شخصية المستخدم تمثيل لنمط من المستخدمين يستند قدر الإمكان إلى بحث أو بيانات عن أهدافهم واحتياجاتهم وسلوكهم وسياق استخدامهم. وهي تساعد الفريق على مناقشة احتياجات هذا النمط بدقة وبلغة مشتركة، فتُبنى القرارات على معلومات عن المستخدمين لا على الافتراضات الشخصية لأعضاء الفريق."},{"q":"وضّح الغرض الأساسي من استخدام «المخطط الهيكلي (Wireframe)» قبل الانتقال إلى التصميم البصري، ولماذا يُعد تحديده أولاً خطوة ضرورية للوصول إلى اتفاق بين أصحاب المصلحة.","m":"المخطط الهيكلي مخطط أولي يحدد أماكن العناصر وأولوياتها بتفاصيل بصرية قليلة قبل التصميم البصري النهائي. وتحديده أولاً ضروري لأن أصحاب المصلحة والفريق التقني يتناقشون فيه حول توزيع المعلومات ومواضعها بمعزل عن الألوان والخطوط والزخارف، فلا تنجرف النقاشات نحو التفضيلات الشخصية للمظهر، ويسهل الاتفاق قبل الانتقال إلى التصميم النهائي."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٦٩","mcq":[{"q":"ما هو المصطلح الذي يشير إلى مدى سهولة وفاعلية إنجاز المستخدم للمهمة المطلوبة داخل الموقع الإلكتروني؟","o":["إمكانية الوصول","قابلية الاستخدام","التباين البصري","التقارب الهيكلي"],"c":1},{"q":"أي من الآتي يعبّر بدقة عن مفهوم «إمكانية الوصول (Accessibility)» في تصميم الويب؟","o":["تصميم المحتوى والواجهة بحيث يمكن للأشخاص ذوي الإعاقة، بمن فيهم ذوو الاحتياجات الخاصة، استخدام الموقع والتفاعل معه.","تحديد أماكن العناصر وأولوياتها باستخدام تفاصيل بصرية قليلة.","تجميع المعلومات المرتبطة قريبة من بعضها في الشاشة الواحدة.","توحيد خط ولون العناوين في جميع صفحات الموقع الإلكتروني."],"c":0}],"essay":[{"q":"اذكر الفارق الأساسي بين تصميم الموقع بالاعتماد على ذوق المصمم الشخصي وبين الاعتماد على نهج «التصميم المتمحور حول المستخدم (UCD)».","m":"في الاعتماد على ذوق المصمم الشخصي تُتخذ القرارات بحسب تفضيله هو، وقد يربك ذلك الزوار. أما نهج التصميم المتمحور حول المستخدم (UCD) فيجعل فهم المستخدمين واحتياجاتهم وسياق استخدامهم أساساً لقرارات التصميم، ثم يختبر الحل معهم ويحسّنه."},{"q":"ما المقصود بمصطلحَي «قابلية الاستخدام (Usability)» و«إمكانية الوصول (Accessibility)» في سياق تصميم المواقع الإلكترونية؟","m":"قابلية الاستخدام: مدى سهولة إنجاز المستخدم للمهمة داخل الموقع وفاعليته في ذلك. إمكانية الوصول: تمكين الأشخاص ذوي الإعاقة من استخدام الموقع والتفاعل معه. فالأولى تتعلق بسهولة الأداء، والثانية بإتاحة الاستخدام لمن يواجهون عوائق."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٦٩–٧٠","mcq":[{"q":"أي من الإجراءات الآتية يمثل التطبيق العملي لمبدأ «التكرار (Repetition)» من مبادئ CRAP في تصميم صفحات الموقع؟","o":["جعل العناوين ضخمة ومتغيرة الألوان عشوائياً في كل صفحة.","توحيد اللون والحجم والخط للعناوين في كل صفحة ومطابقة تصميم أيقونات النقاط.","تشتيت انتباه المستخدم بتوزيع العناصر في أركان الشاشة بشكل متباعد.","إخفاء أزرار التنقل الرئيسية داخل قوائم فرعية معقدة."],"c":1},{"q":"ما هي القاعدة الأساسية التي يعتمد عليها مبدأ «المحاذاة (Alignment)» في تصميم واجهات المستخدم باللغة العربية؟","o":["محاذاة النص الأساسي والعناصر من اليسار إلى اليمين حصراً.","توزيع العناصر عشوائياً دون الالتزام بخط أساس مشترك.","محاذاة العناصر حسب اتجاه اللغة وشبكة التصميم بحيث يكون اتجاه النص الأساسي من اليمين إلى اليسار باستخدام قواعد متسقة.","الاعتماد على الزخارف الهندسية المعقدة لتغطية مساحات الفراغ."],"c":2}],"essay":[{"q":"اشرح مبدأ «التباين» من مبادئ CRAP، وبيّن كيف يمكن للمصمم تطبيقه بفاعلية لإبراز أهم العناصر وجعل أولوية المعلومات واضحة للمستخدم.","m":"التباين أحد مبادئ CRAP (التباين والتكرار والمحاذاة والتقارب)، ويعني إبراز الفروق بين العناصر ليتضح المهم وتتحدد أولوية المعلومات. يطبقه المصمم بجعل العناوين واضحة مقارنة بالنص، واستخدام تباين واضح للأزرار المهمة فتبرز فوراً، مع مراعاة سهولة القراءة وعدم الاعتماد على اللون وحده."},{"q":"وضّح بالتفصيل كيف يحقق مبدأ «التقارب (Proximity)» تنظيم المعلومات بحيث يدركها المستخدم كمجموعة واحدة من أول نظرة.","m":"التقارب هو وضع المعلومات المرتبطة قريبة من بعضها حتى تُدرك كمجموعة واحدة من أول نظرة، مع ترك مسافات (هوامش) مناسبة بين المجموعات المختلفة. ومثال ذلك تجميع صورة المنتج واسمه وسعره معاً. فيفهم المستخدم أن هذه العناصر مترابطة ويميّز كل مجموعة عن غيرها دون جهد، فتصبح الصفحة منظمة وأسهل في الفهم والتصفح."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٧٠","mcq":[{"q":"ما هو المبدأ التصميمي من مبادئ CRAP الذي يختص بتجميع صور المنتجات وأسمائها وأسعارها قريبة من بعضها وترك مسافات هادفة بينها؟","o":["التباين","التكرار","المحاذاة","التقارب"],"c":3},{"q":"أي من الخيارات التالية يُعد الخيار غير المناسب أو المعلومة غير الملائمة عند إعداد «شخصية نموذجية (Persona)» للمستخدم المستهدف؟","o":["غرض المستخدم من استخدام الموقع الإلكتروني.","أداء خادم الموقع الإلكتروني وسرعة استجابته التقنية.","عمر المستخدم ومهنته وسياق استخدامه.","التحديات والصعوبات التي يواجهها المستخدم."],"c":1}],"essay":[{"q":"اذكر المبادئ الأربعة للتصميم المعروفة بمبادئ (CRAP)، واشرح باختصار الغرض الأساسي من استخدامها في تنظيم شكل صفحات الويب.","m":"المبادئ الأربعة: التباين، والتكرار، والمحاذاة، والتقارب. غرضها تنظيم شكل الصفحة وجعلها أسهل في الفهم: التباين يبرز المهم، والتكرار يحقق الاتساق بتكرار خصائص كاللون والحجم والخط، والمحاذاة تمنح الشاشة نظاماً بخط أساس مشترك، والتقارب يجمع المعلومات المرتبطة معاً."},{"q":"اشرح كيف تتكامل خطوات التصميم بدءاً من تصور «شخصية المستخدم» مروراً بـ«المخطط الهيكلي» ووصولاً إلى تطبيق مبادئ «CRAP» للوصول إلى تصميم ناجح متمحور حول المستخدم.","m":"تبدأ العملية بشخصية المستخدم لتوضيح من هو المستخدم وما احتياجاته وسياق استخدامه. ثم يحدد المخطط الهيكلي مكان كل عنصر وأولويته قبل الاهتمام بالمظهر ليتفق الفريق على توزيع المعلومات. ثم تُطبَّق مبادئ CRAP (التباين والتكرار والمحاذاة والتقارب) لجعل الصفحة واضحة ومنظمة. وتبقى قرارات التصميم كلها متمحورة حول المستخدم، وتُختبر معه وتُحسَّن."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٧١–٧٢","mcq":[{"q":"بمَ يبدأ تصميم الويب الجيد؟","o":["من فهم المستخدم واحتياجاته وسياق استخدامه لا على ذوق المصمم فقط.","من اختيار الألوان والزخارف البصرية الفاخرة أولاً.","من كتابة الأكواد البرمجية الخلفية وقواعد البيانات.","من زيادة سرعة خادم الاستضافة فقط."],"c":0},{"q":"ما هو الوصف الصحيح لـ«المخطط الهيكلي (Wireframe)»؟","o":["مخطط أولي لتحديد أماكن العناصر وأولوياتها بتفاصيل بصرية قليلة قبل التصميم النهائي.","تصميم نهائي مدمج بالرسومات والصور عالية الدقة.","ملف برمجي لتنفيذ عمليات الدفع الإلكتروني.","أداة اختبار سرعة تصفح الإنترنت عبر الجوال."],"c":0},{"q":"ما هو الغرض من تطبيق مبدأ «التباين (Contrast)» في تصميم صفحات الويب؟","o":["جعل العناوين واضحة وإبراز العناصر المهمة فوراً.","توحيد خط ولون العناوين في كل الصفحات.","تجميع العناصر المرتبطة قريبة من بعضها.","محاذاة النصوص وفق خط أساس مشترك."],"c":0},{"q":"أي مما يأتي يمثل المفهوم الدقيق للتصميم المتمحور حول المستخدم؟","o":["نهج يجعل فهم المستخدمين واحتياجاتهم وسياق استخدامهم أساساً لقرارات التصميم.","إعطاء الأولوية لراحة منشئ الموقع ومطوريه.","الاعتماد المطلق على ذوق المصمم الفردي.","تخطي مرحلة تقييم ومراجعة الموقع مع المستخدمين الفعليين."],"c":0}],"essay":[{"q":"ناقش أهمية فهم المستخدم وسياق استخدامه كخطوة أولى في تصميم الويب الجيد، وكيف يحمي ذلك التصميم من الوقوع في فخ الاعتماد على ذوق المصمم الشخصي.","h":1},{"q":"اشرح الغرض التقني والتصميمي من استخدام «المخطط الهيكلي (Wireframe)»، موضحاً لماذا يتم تأجيل اختيار الألوان والخطوط والزخارف إلى المراحل اللاحقة.","m":"يحدد المخطط الهيكلي أماكن العناصر وأولوياتها بتفاصيل بصرية قليلة، فيمكن مناقشة توزيع المعلومات ومواضعها والاتفاق عليه. وتؤجَّل الألوان والخطوط والزخارف إلى مرحلة لاحقة كي لا تنجرف النقاشات نحو التفضيلات الشخصية في المظهر قبل الاتفاق على البنية."},{"q":"عدِّد مبادئ التصميم الأربعة (CRAP) مع بيان الغرض الوظيفي لكل مبدأ في تسهيل فهم الصفحة وتجربة تصفح المستخدم.","m":"(1) التباين: إبراز المهم فتتضح أولوية المعلومات. (2) التكرار: تكرار خصائص كاللون والحجم والخط لتحقيق الاتساق، فيتنقل المستخدم دون تشتت. (3) المحاذاة: محاذاة موضع كل عنصر إلى خط أساس مشترك، فتكتسب الشاشة نظاماً. (4) التقارب: وضع المعلومات المرتبطة قريبة من بعضها لتُدرك كمجموعة واحدة."},{"q":"اشرح بالتفصيل دور نهج «التصميم المتمحور حول المستخدم (UCD)» في تحسين مؤشرات قابلية الاستخدام وإمكانية الوصول الرقمي لذوي الاحتياجات الخاصة.","m":"يجعل UCD فهم المستخدمين واحتياجاتهم وسياق استخدامهم أساساً للقرارات، ثم ينظم الفريق المعلومات ويصمم الحل ويختبره مع المستخدمين ويكرر التحسين. فتتحسن قابلية الاستخدام، أي سهولة إنجاز المهمة وفاعلية ذلك، ويُدعم الوصول الرقمي، أي تمكين الأشخاص ذوي الإعاقة من استخدام الموقع والتفاعل معه."}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٧٢–٧٣","mcq":[{"q":"ما هي الفائدة الأساسية من استخدام «شخصية المستخدم (Persona)» في مشاريع الويب؟","o":["مساعدة الفريق على مناقشة احتياجات نمط من المستخدمين بدل الافتراضات الشخصية.","زيادة عدد زوار الموقع عبر محركات البحث.","تقليل حجم ملفات الصور والوسائط في الصفحة.","تسريع تحميل صفحات الويب على الأجهزة الذكية."],"c":0},{"q":"أي من المبادئ الأربعة للتصميم يُعنى بمحاذاة مواضع العناصر إلى خط أساس مشترك لمنح الشاشة نظاماً؟","o":["التباين","التكرار","المحاذاة","التقارب"],"c":2},{"q":"ماذا يفعل مبدأ «التكرار (Repetition)» في تصميم صفحات الموقع الإلكتروني؟","o":["يكرر خصائص معينة كاللون والحجم والخط لتحقيق الاتساق ومساعدة المستخدم على التنقل دون تشتت.","يجمع العناصر المرتبطة ببعضها في مكان واحد.","يبرز العناصر المهمة عبر إيجاد فروق بصرية واضحة.","يحدد أماكن العناصر وأولوياتها بمعزل عن التصميم البصري."],"c":0},{"q":"ما هو الهدف من دراسة «قابلية الاستخدام (Usability)» و«إمكانية الوصول (Accessibility)»؟","o":["قياس سرعة أداء الخادم التقني.","تحسين سهولة وفاعلية إنجاز المهمة وتمكين ذوي الإعاقة من استخدام الموقع بفاعلية.","تقليل تكلفة شراء النطاقات والاستضافة.","تصميم الأكواد البرمجية للغات الخلفية."],"c":1}],"essay":[{"q":"اشرح كيف يسهم بناء «شخصية المستخدم (Persona)» المستندة إلى بحث أو بيانات حقيقية في مساعدة فريق العمل على مناقشة احتياجات نمط معين من المستخدمين بدقة.","m":"تمثل الشخصية نمطاً من المستخدمين بناءً على بحث أو بيانات عن أهدافهم واحتياجاتهم وسلوكهم وسياقهم وتحدياتهم، فيناقش الفريق احتياجات هذا النمط بدقة وبلغة مشتركة بدل الافتراضات الشخصية. وتُضاف معلومات كالعمر أو المهنة فقط إذا كانت مهمة للتصميم."},{"q":"وضّح بالتفصيل كيف يسهم تطبيق مبدأ «التباين (Contrast)» في إبراز العناوين والأزرار المهمة مع مراعاة سهولة القراءة وعدم الاعتماد على اللون وحده.","m":"يجعل التباين العناوين واضحة مقارنة بالنص، ويُستخدم تباين واضح للأزرار المهمة فتبرز فوراً وتتضح أولوية المعلومات. ويُراعى أن تبقى القراءة سهلة، وألا يُعتمد على اللون وحده في التمييز، بل يُضاف إليه فرق في الحجم أو الخط أو الموضع."},{"q":"بيّن بالأمثلة كيف يطبق مصمم المواقع مبدأ «المحاذاة (Alignment)» لإنشاء نظام بصري متناسق على الشاشة وفقاً لشبكة التصميم واتجاه اللغة.","m":"يحاذي المصمم موضع كل عنصر إلى خط أساس مشترك وفق شبكة التصميم واتجاه اللغة، فيمنح الشاشة نظاماً. ففي العربية يكون اتجاه النص الأساسي من اليمين إلى اليسار، فتُحاذى العناوين والنصوص والصور بقواعد متسقة، ويصبح المظهر العام منظماً ومتناسقاً."},{"q":"اشرح العلاقة التكاملية بين دورة حياة التصميم المتمحور حول المستخدم (UCD) واختبار الحلول مع المستخدمين لتحسين وتطوير الواجهات تكرارياً.","m":"يبدأ UCD بفهم احتياجات المستخدم والمهمة وظروف الاستخدام، ثم ينظم الفريق المعلومات ويصمم الحل، ثم يختبره مع المستخدمين، ثم يكرر التحسين. فالاختبار يكشف المشكلات الفعلية التي يواجهها المستخدمون، والتعديل المتكرر يطور الواجهة تدريجياً لصالحهم، فالعلاقة بينهما حلقة متصلة من التصميم والاختبار والتحسين."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٧٣–٧٤","mcq":[{"q":"ما هو المبدأ التصميمي المسؤول عن تجميع المعلومات المرتبطة (كصور المنتجات وأسعارها) قريبة من بعضها؟","o":["التقارب","التباين","التكرار","المحاذاة"],"c":0},{"q":"ماذا يُقصد بمفهوم «التصميم المتمحور حول المستخدم (UCD)»؟","o":["نهج تصميم يجعل فهم المستخدمين واحتياجاتهم وسياق استخدامهم أساساً لقرارات التصميم.","طريقة لبرمجة قواعد البيانات بأسلوب متقدم.","تصميم واجهات تعتمد بالكامل على الحدس الشخصي للمطور.","أداة لتقييم أخطاء الشبكات والاتصال بالإنترنت."],"c":0},{"q":"ما هو السبب الرئيسي لتأجيل اختيار الألوان والخطوط والزخارف لحين الانتهاء من إعداد «المخطط الهيكلي»؟","o":["لمنع انحراف النقاشات نحو التفضيلات الشخصية للمظهر وتسهيل اتفاق أصحاب المصلحة على بنية المعلومات.","لزيادة سرعة معالجة الرسوميات في متصفح المستخدم.","لتقليل مساحة تخزين الموقع على الخادم.","لتجنب استخدام لغات البرمجة الحديثة."],"c":0},{"q":"أي من الخيارات التالية يُعد التطبيق الصحيح لمبدأ «المحاذاة» في النصوص العربية؟","o":["جعل اتجاه النص الأساسي من اليمين إلى اليسار وفق قواعد متسقة.","جعل اتجاه النص من اليسار إلى اليمين حصراً.","توزيع الكلمات بشكل عشوائي في أركان الشاشة.","إخفاء النصوص داخل قوائم منسدلة معقدة."],"c":0}],"essay":[{"q":"وضّح كيف يمكن لمخطط هيكلي مصمم بعناية أن يسهّل على أصحاب المصلحة والفريق التقني الوصول إلى اتفاق بشأن توزيع المعلومات ومواضعها بمعزل عن المظهر البصري.","m":"يحدد المخطط الهيكلي أماكن المعلومات وأولوياتها بتفاصيل بصرية قليلة، فيناقش أصحاب المصلحة والفريق التقني توزيع المعلومات ومواضعها بمعزل عن الألوان والخطوط والزخارف، فلا تنجرف النقاشات نحو التفضيلات الشخصية للمظهر، ويسهل الوصول إلى اتفاق قبل التصميم النهائي."},{"q":"قارن بين مبدأ «التكرار (Repetition)» ومبدأ «التقارب (Proximity)» من حيث الأثر البصري المترتب على كل منهما في تنظيم محتوى صفحات الويب.","m":"التكرار يكرر خصائص كاللون والحجم والخط لتحقيق اتساق التصميم ككل، فيتنقل المستخدم بين الصفحات دون تشتت. أما التقارب فيضع المعلومات المرتبطة قريبة من بعضها فتُدرك كمجموعة واحدة من أول نظرة، مع ترك مسافات بين المجموعات. فأثر التكرار الاتساق عبر الصفحات، وأثر التقارب تنظيم المحتوى داخل الصفحة."},{"q":"اشرح كيف يؤدي تجاهل معايير «إمكانية الوصول (Accessibility)» إلى حرمان فئات معينة من المستخدمين (مثل ضعاف البصر أو ذوي الإعاقة) من التفاعل الفعّال مع خدمات الموقع الإلكتروني.","m":"إمكانية الوصول تعني تمكين الأشخاص ذوي الإعاقة من استخدام الموقع والتفاعل معه. وعند تجاهلها يصبح تصميم المحتوى والواجهة غير مناسب لهم، كضعاف البصر الذين لا يستطيعون القراءة أو التمييز بسبب ضعف التباين أو صغر الخط، فلا يستطيعون استخدام الموقع بفاعلية ويُحرمون من خدماته."},{"q":"تحدث بالتفصيل عن الخطوات المتسلسلة لعملية التصميم المتمحور حول المستخدم، بدءاً من دراسة الاحتياجات مروراً بتنظيم المعلومات ووصولاً إلى التقييم والاختبار.","h":1}]}],"4-3":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٧٥","mcq":[{"q":"أي من الطرق التالية يعد من أدوات التقييم النوعي لفهم تجربة المستخدم وأسباب السلوك؟","o":["اختبار قابلية الاستخدام","تحليلات الويب","اختبار A/B","معدل التحويل (CVR)"],"c":0},{"q":"ما هو مصطلح التقييم الذي يركز على القياس بالأرقام واستخدام بيانات عددية ومقاييس محددة بوضوح؟","o":["التقييم النوعي","التقييم الإرشادي","التقييم الكمي","المقابلات المباشرة"],"c":2}],"essay":[{"q":"ما الفرق الأساسي بين التقييم النوعي والتقييم الكمي من حيث التركيز والهدف لكل منهما في تقييم المواقع الإلكترونية؟","m":"التقييم النوعي يركز على فهم تجربة المستخدم وأسباب سلوكه بالملاحظة والمقابلات واختبار قابلية الاستخدام، ويجيب عن سؤال «لماذا». أما التقييم الكمي فيركز على قياس السلوك والنتائج بالأرقام باستخدام بيانات ومقاييس محددة بوضوح، مثل تحليلات الويب واختبار A/B، ويجيب عن سؤال «كم». وقد تجمع الدراسة الواحدة بين النوعين."},{"q":"اشرح المقصود بـ «اختبار قابلية الاستخدام» كإحدى أدوات التقييم النوعي وكيف يساهم في تحسين واجهة المستخدم.","m":"اختبار قابلية الاستخدام أداة نوعية يُراقَب فيها المستخدمون الفعليون أثناء استخدامهم للموقع عبر الملاحظة والمقابلات لتحديد النقاط التي يصعب استخدامها. فيكشف أسباب المشكلات التي تواجههم، فيعدّل الفريق الواجهة لتصبح أسهل وأوضح."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٧٥","mcq":[{"q":"ماذا يمثل مؤشر (PV) في تحليلات الويب؟","o":["نسبة المستخدمين الذين حققوا هدفاً محدداً.","العدد الإجمالي لمرات مشاهدة الصفحة.","نسبة المستخدمين الذين غادروا بعد الصفحة الأولى.","معدل الارتداد الكلي للموقع."],"c":1},{"q":"ما هو المؤشر الذي يقيس نسبة المستخدمين أو الجلسات التي حققت إجراءً مستهدفاً مثل التسجيل أو الشراء؟","o":["مشاهدات الصفحة (PV)","معدل الارتداد","معدل التحويل (CVR)","التقييم الإرشادي"],"c":2}],"essay":[{"q":"وضح بإيجاز المقصود بمفهوم «تحليلات الويب» وكيف تعتبر إحدى أدوات التقييم الكمي.","m":"تحليلات الويب هي جمع وقياس وتحليل بيانات استخدام الموقع لفهم الوصول والتفاعل والنتائج. وهي أداة كمية لأنها تعتمد على بيانات عددية ومؤشرات مثل عدد مشاهدات الصفحة (PV) والوقت المستغرق، وتختلف طرق حساب المؤشر بين الأدوات فيجب مراجعة تعريف الأداة المستخدمة."},{"q":"اذكر اثنين من المؤشرات الرئيسية في تحليلات الويب مع بيان الغرض من كل منهما.","m":"(1) مشاهدات الصفحة (PV): تقيس العدد الإجمالي لمرات مشاهدة الصفحة، وتبيّن حجم الوصول إلى الصفحة. (2) معدل التحويل (CVR): يقيس نسبة المستخدمين أو الجلسات التي حققت إجراءً مستهدفاً كالتسجيل أو الشراء، ويبيّن مدى تحقق هدف الموقع."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٧٦","mcq":[{"q":"ماذا يُقصد بمصطلح «التقييم الإرشادي (Heuristic Evaluation)»؟","o":["قياس السلوك بالأرقام والبيانات العددية.","مراجعة يجريها خبراء لواجهة المستخدم استناداً إلى قواعد عملية.","اختبار خيارين لمعرفة أيهما يحقق نتائج أفضل.","إحصاء إجمالي عدد زيارات الصفحات."],"c":1},{"q":"أي من الخيارات التالية يُعد من القواعد الإرشادية الأساسية لواجهة المستخدم؟","o":["معدل الارتداد (Bounce Rate)","إجمالي مشاهدات الصفحة (PV)","منع الأخطاء","معدل التحويل (CVR)"],"c":2}],"essay":[{"q":"عرّف «التقييم الإرشادي» وممن يتم إجراؤه؟ وما علاقته بقواعد واجهة المستخدم؟","m":"التقييم الإرشادي (Heuristic Evaluation) هو مراجعة يجريها خبراء لواجهة المستخدم (UI) استناداً إلى قواعد أو مبادئ إرشادية عملية (heuristics)، فيفحصون الواجهة وفق تلك القواعد. وعلاقته بقواعد الواجهة أن هذه القواعد هي المعيار الذي يفحص الخبراء الواجهة مقابله لتحديد مشكلات قابلية الاستخدام."},{"q":"اذكر ثلاثة أمثلة على القواعد الإرشادية المستخدمة في تقييم واجهة المستخدم واشرح واحدة منها باختصار.","m":"من القواعد الإرشادية: (1) الاتساق. (2) منع الأخطاء. (3) وضوح حالة النظام. الاتساق يعني النظر فيما إذا كان التصميم والعمليات موحدة عبر الموقع، فتبقى الأزرار والقوائم وطريقة التنقل بالشكل نفسه في كل الصفحات، ولا يُفاجأ المستخدم بتغير مكان الأشياء أو معناها."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٧٦","mcq":[{"q":"أي من المؤشرات التالية يعبر عن نسبة الجلسات أو المستخدمين الذين غادروا الموقع بعد مشاهدة الصفحة الأولى فقط؟","o":["مشاهدات الصفحة (PV)","معدل التحويل (CVR)","معدل الارتداد (Bounce Rate)","التقييم الإرشادي"],"c":2},{"q":"عندما تظهر تحليلات الويب ارتفاعاً كبيراً في عدد المشاهدات (PV) مع انخفاض ملحوظ في معدل التحويل (CVR)، فإن ذلك يدل على:","o":["أن جميع الزوار قد أكملوا عمليات الشراء بنجاح.","أن مستخدمين كثيرين يصلون للصفحة لكنهم لا يكملون الإجراء المستهدف.","عدم وجود أي زيارات نهائية للموقع.","نجاح التصميم بالكامل دون الحاجة إلى أي تقييم نوعي."],"c":1}],"essay":[{"q":"لماذا يُعد الجمع بين التقييم النوعي والتقييم الكمي أكثر فائدة عند تقييم موقع إلكتروني مقارنة بالاعتماد على أحدهما فقط؟","m":"لأن التقييم الكمي يقيس السلوك بالأرقام فيبيّن «كم» حدث وأين يوجد الخلل، لكنه لا يفسر السبب، أما التقييم النوعي فيفهم تجربة المستخدم وأسباب سلوكه ويفسر «لماذا». فالجمع بينهما يعطي صورة أدق وأشمل لتحسين الموقع."},{"q":"اشرح بإيجاز كيف يمكن الاستفادة من «اختبار A/B» في قياس سلوك المستخدمين ونتائج التصميم.","m":"اختبار A/B تجربة منظمة تقارن نسختين A وB من الصفحة أو العنصر وفق مقياس محدد مسبقاً، مثل نسبة النقر على زر الشراء. توزَّع الزيارات أو المستخدمون بين النسختين بطريقة عشوائية قدر الإمكان، ثم تُقارَن النتائج ببيانات حقيقية عن سلوك المستخدمين لمعرفة النسخة الأفضل. ولعزل أثر تغيير بعينه يجب أن يكون الفرق بين النسختين واضحاً ومحدداً، ويُحدَّد المقياس وخطة التحليل قبل الاختبار، وتُجمع عينة كافية قبل الحكم."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٧٧","mcq":[{"q":"أي الفئتين الأساسيتين تركز على الفهم التفصيلي لتجربة المستخدم وأسباب السلوك؟","o":["التقييم النوعي","التقييم الكمي","تحليلات الويب","اختبار A/B"],"c":0},{"q":"ماذا يقيس مؤشر مشاهدات الصفحة (PV) في تحليلات الويب؟","o":["نسبة المستخدمين الذين غادروا الموقع","العدد الإجمالي لمرات مشاهدة الصفحة","نسبة التحويلات المكتملة فقط","عدد الزوار الفريدين بدقة تامة"],"c":1},{"q":"ما هو المصطلح الذي يطلق على مراجعة الخبراء لواجهة المستخدم استناداً إلى قواعد عملية؟","o":["التقييم الإرشادي","اختبار قابلية الاستخدام","معدل الارتداد","التقييم الكمي"],"c":0},{"q":"أي من الخيارات التالية يُعد الوصف الصحيح لاختبار قابلية الاستخدام؟","o":["قياس السلوك بالأرقام والبيانات العددية","مراقبة العمليات الفعلية لتحديد النقاط التي يصعب استخدامها","مقارنة خيارين للتحقق من أيهما أفضل","تحليل بيانات الويب تلقائياً"],"c":1}],"essay":[{"q":"قارن بين التقييم النوعي والتقييم الكمي موضحاً التقنيات المستخدمة في كل فئة.","m":"التقييم النوعي يفهم تجربة المستخدم وأسباب السلوك والمشكلات بالملاحظة والمقابلات، ومن تقنياته اختبار قابلية الاستخدام (مراقبة العمليات الفعلية) والمقابلات (الاستماع إلى آراء المستخدمين)، ويجيب عن «لماذا». أما التقييم الكمي فيقيس السلوك والنتائج ببيانات عددية ومقاييس محددة بوضوح، ومن تقنياته تحليلات الويب (مثل PV والوقت المستغرق) واختبار A/B، ويجيب عن «كم»."},{"q":"اشرح مؤشر مشاهدات الصفحة (PV) ومؤشر معدل التحويل (CVR) موضحاً أهمية كل منهما وحدود استخدامهما.","m":"مؤشر PV هو عدد مرات مشاهدة الصفحة، ويفيد في معرفة حجم الوصول والاهتمام بالصفحات. ومؤشر CVR هو نسبة المستخدمين أو الجلسات التي حققت إجراءً مستهدفاً مثل الشراء أو التسجيل، ويفيد في قياس تحقق هدف الموقع. وحدودهما أن كلاً منهما رقم لا يفسر السبب وحده، فارتفاع PV مع انخفاض CVR يبين أن الناس يصلون ولا يتخذون إجراءً دون تحديد السبب، ويجب تفسيرهما وفق تعريف أداة التحليل وطريقة حسابها."},{"q":"تحدث عن «التقييم الإرشادي» مبيناً تعريفه، ومن يقوم به، وأهم القواعد الإرشادية المستخدمة في فحص واجهة المستخدم.","m":"التقييم الإرشادي (Heuristic Evaluation) مراجعة يجريها خبراء لواجهة المستخدم استناداً إلى قواعد أو مبادئ إرشادية عملية، وهو شكل من التقييم النوعي يُستخدم إلى جانب اختبار قابلية الاستخدام. ومن أهم قواعده: (1) الاتساق، أي توحيد التصميم والعمليات عبر الموقع. (2) منع الأخطاء، أي جعل ارتكاب المستخدم للأخطاء صعباً. (3) وضوح حالة النظام، كمؤشرات المعالجة ورسائل أخطاء الإدخال."},{"q":"وضح لماذا لا يكفي المؤشر الكمي وحده لتفسير سبب مغادرة الزوار للموقع، وكيف تساهم الطرق النوعية في سد هذه الثغرة.","m":"لأن المؤشر الكمي، مثل معدل الارتداد أو PV، يبين ما حدث ومقداره ولا يفسر سببه، فلا نعرف هل غادر الزائر بسبب تعقيد التصميم أو بطء الصفحة أو عدم وجود ما يريد. وتسد الطرق النوعية هذه الثغرة، فاختبار قابلية الاستخدام يراقب مستخدمين فعليين ليحدد النقاط التي يصعب عليهم استخدامها، والمقابلات تنقل احتياجاتهم واستياءهم بكلماتهم."}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٧٨","mcq":[{"q":"ما هي التقنية التي تبدأ بمراقبة العمليات الفعلية باستخدام الموقع عبر الملاحظة والمقابلات؟","o":["اختبار A/B","اختبار قابلية الاستخدام","التقييم الإرشادي","تحليلات الويب"],"c":1},{"q":"ما هي التقنية التي تقارن بين خيارين أو تصميمين للتحقق من أيهما يؤدي إلى نتائج أفضل؟","o":["تحليلات الويب","التقييم الإرشادي","اختبار A/B","اختبار قابلية الاستخدام"],"c":2},{"q":"ماذا يمثل مؤشر (PV) في أدوات تحليلات الويب؟","o":["إجمالي مرات مشاهدة الصفحة","معدل التحويل للأهداف","نسبة الارتداد للموقع","القواعد الإرشادية للخبراء"],"c":0},{"q":"ما هو المصطلح الذي يعبر عن نسبة الجلسات أو المستخدمين الذين غادروا الموقع بعد مشاهدة الصفحة الأولى فقط؟","o":["معدل التحويل","مشاهدات الصفحة","معدل الارتداد (Bounce Rate)","التقييم الإرشادي"],"c":2}],"essay":[{"q":"اشرح كيف يتم تنفيذ «اختبار قابلية الاستخدام» وما هي الأهداف الأساسية من ورائه في دراسة سلوك المستخدمين.","m":"ينفَّذ اختبار قابلية الاستخدام بمراقبة مستخدمين فعليين وهم يجربون الموقع ويؤدون مهام حقيقية، مع الملاحظة وطرح الأسئلة. وأهدافه الأساسية في دراسة سلوك المستخدمين تحديد النقاط التي يصعب فيها الاستخدام، وفهم أسباب المشكلات وتجربة المستخدم، ثم تحسين التصميم بناءً على ذلك."},{"q":"تحدث عن تحليلات الويب باعتبارها أدوات تقييم كمي، موضحاً تنوع طرق حساب المؤشرات وأهمية مراجعة تعريف الأداة المستخدمة.","m":"تحليلات الويب أدوات تقييم كمي تجمع وتقيس وتحلل بيانات استخدام الموقع لفهم الوصول والتفاعل والنتائج، عبر مؤشرات مثل PV (مشاهدات الصفحة) والوقت المستغرق ومعدل الارتداد وCVR. وتتنوع طرق حساب المؤشر بحسب الأداة وإعداداتها، فمعدل الارتداد مثلاً قد يُعرَّف بأكثر من طريقة؛ لذلك يجب مراجعة تعريف الأداة المستخدمة وتفسير المؤشر وفقه."},{"q":"اذكر القواعد الإرشادية الثلاث المذكورة في الدرس لواجهة المستخدم واشرح مفهوم «وضوح حالة النظام» و«الاتساق».","m":"القواعد الثلاث: الاتساق، ومنع الأخطاء، ووضوح حالة النظام. الاتساق: أن يكون التصميم والعمليات موحدة عبر الموقع. وضوح حالة النظام: أن تكون حالة النظام موضحة بوضوح للمستخدم، مثل مؤشرات المعالجة ورسائل أخطاء الإدخال، فيعرف ما يجري وما عليه فعله."},{"q":"اشرح كيف يمكن لفريق الموقع الجمع بين الأدلة العددية (الكمية) وآراء المستخدمين (النوعية) للوصول إلى تقييم شامل ودقيق.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٧٩","mcq":[{"q":"أي من الأدوات التالية تُستخدم للاستماع إلى آراء المستخدمين المباشرة لفهم احتياجاتهم واستيائهم؟","o":["المقابلات","تحليلات الويب","اختبار A/B","معدل الارتداد"],"c":0},{"q":"ما هو المنهج أو النهج الذي يقيس السلوك والنتائج باستخدام بيانات عددية ومقاييس محددة بوضوح؟","o":["التقييم النوعي","التقييم الكمي","التقييم الإرشادي","اختبار قابلية الاستخدام"],"c":1},{"q":"ما هي المنصات أو الأدوات التي تجمع وتقيس وتحلل بيانات استخدام الموقع لفهم الوصول والتفاعل؟","o":["تحليلات الويب","اختبار قابلية الاستخدام","المقابلات المباشرة","التقييم الإرشادي"],"c":0},{"q":"أي من القواعد الإرشادية التالية تعني التأكد من أن التصميم يقلل من احتمالية ارتكاب الأخطاء؟","o":["الاتساق","وضوح حالة النظام","منع الأخطاء","معدل التحويل"],"c":2}],"essay":[{"q":"وضح دور المقابلات المباشرة في التقييم النوعي وكيف تساعد في الاستماع إلى آراء المستخدمين واحتياجاتهم واستيائهم.","m":"المقابلة المباشرة طريقة تقييم نوعي يستمع فيها الفريق إلى آراء المستخدمين مباشرة. فيعبّر المستخدم بكلماته عن احتياجاته وما يستاء منه وما يربكه، ويمكن للفريق طرح أسئلة متابعة لتوضيح الأسباب. وبذلك يفهم الفريق دوافع السلوك ومشكلاته التي لا تظهرها الأرقام وحدها."},{"q":"اشرح فكرة «اختبار A/B» وكيف يساهم في مقارنة خيارين للتحقق من أيهما يؤدي إلى نتائج أفضل للموقع.","m":"اختبار A/B تجربة منظمة تقارن نسختين A وB وفق مقياس محدد مسبقاً، كأن يكون زر الشراء أحمر في A وأزرق في B لمعرفة أيهما يحصل على نقرات أكثر. توزَّع الزيارات أو المستخدمون بينهما عشوائياً قدر الإمكان، ثم تُقارَن النتائج ببيانات حقيقية، فيختار الفريق النسخة التي حققت نتائج أفضل بدل الاعتماد على الافتراض."},{"q":"اشرح بالتفصيل المقصود بـ «معدل الارتداد (Bounce Rate)» ولماذا يُعد مؤشراً يحتاج إلى تفسير وفق تعريف أداة التحليل المستخدمة.","m":"معدل الارتداد مؤشر يعبر عن نسبة المستخدمين أو الجلسات التي غادرت الموقع بعد مشاهدة الصفحة الأولى فقط (ومن أمثلته المبسطة نسبة الجلسات التي تنتهي بعد صفحة واحدة). وهو يحتاج إلى تفسير وفق تعريف الأداة لأن تعريفه وطريقة حسابه يختلفان بحسب أداة التحليل وإعداداتها، فلا تُقارن قيمته بقيمة من أداة أخرى دون التحقق من التعريف. كما أنه لا يفسر سبب المغادرة وحده."},{"q":"ناقش الأهمية القصوى للجمع بين بيانات «الكم» و«لماذا» النوعية من خلال مثال عملي على تقييم متجر إلكتروني.","h":1}]}],"4-4":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٨١","mcq":[{"q":"ما المصطلح الذي يصف طريقة تدفع التحسين قدماً باستمرار من خلال تكرار الخطوات الأربع (خطط، نفذ، تحقق، تصرف)؟","o":["التفكير التصميمي","دورة PDCA.","اختبار A/B.","التحسين المستمر"],"c":1},{"q":"في خطوة «التخطيط (Plan)» ضمن دورة PDCA، ما الذي يجب على الفريق فعله؟","o":["تنفيذ التغييرات مباشرة على الموقع.","قياس النتائج ومقارنتها بخط الأساس.","تحديد هدف واضح ووضع خطة لتغيير مناسب.","اعتماد ما نجح وتعديل الخطة."],"c":2}],"essay":[{"q":"اشرح لماذا يُعد تحسين الموقع الإلكتروني عملية متكررة بدلاً من مهمة تنجز مرة واحدة، وما دور دورة PDCA في تنظيم هذا التحسين.","m":"لأن المواقع الإلكترونية الجيدة لا تُبنى مثالية من أول مرة، بل تُحسَّن عبر حلقات متكررة يتعلم فيها الفريق من النتائج بدلاً من افتراض أن النسخة الأولى مثالية. وتنظم دورة PDCA هذا التحسين بتكرار أربع خطوات: خطط، نفذ، تحقق، تصرف، فيكون كل تغيير صغيراً ومقيساً ومتكرراً."},{"q":"وضح خطوات دورة التحسين المستمر (PDCA) واذكر وصفاً مبسطاً لكل خطوة من خطواتها الأربع.","m":"دورة PDCA أربع خطوات متكررة: (1) خطط (Plan): تحديد الأهداف ووضع خطة للتحسين، مثل هدف واضح لتغيير مناسب. (2) نفذ (Do): تنفيذ التغيير وفق الخطة. (3) تحقق (Check): قياس النتائج وتقييم مدى تحقيق الهدف بمقارنتها بخط الأساس والهدف. (4) تصرف (Act): بناءً على النتائج يُعتمد ما نجح أو تُغيَّر الخطة وتُحدد الخطوة التالية، ثم تتكرر الدورة."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٨١","mcq":[{"q":"ماذا تعني خطوة «التصرف (Act)» في دورة PDCA إذا حقق التغيير الهدف المطلوب؟","o":["تغيير الخطة كلياً وإلغاء الموقع.","اعتماد التغيير أو توسيعه.","البدء في مرحلة التعاطف من جديد.","قياس معدل الارتداد فقط دون تعديل."],"c":1},{"q":"أي من الخيارات التالية يمثل الوصف الصحيح لمفهوم «التحسين المستمر»؟","o":["بناء الموقع مرة واحدة وبشكل مثالي دون تعديلات.","تغيير جميع عناصر الموقع دفعة واحدة.","التحسن قليلاً في كل مرة عبر دورات متكررة.","الاعتماد على آراء المطورين فقط دون المستخدمين."],"c":2}],"essay":[{"q":"اذكر الفكرة الأساسية وراء استخدام دورة PDCA والتفكير التصميمي واختبار A/B في تطوير المنتجات الرقمية بدلاً من افتراض أن النسخة الأولى نهائية.","h":1},{"q":"اشرح بمثال كيف يتم تطبيق خطوتي «التنفيذ (Do)» و«التحقق (Check)» في تحسين نسبة إكمال نموذج التسجيل في موقع إلكتروني.","m":"مثال: هدف رفع نسبة إكمال نموذج التسجيل من 40% إلى 50%. التنفيذ (Do): ننفذ التغيير المخطط له على الموقع وفق الخطة، كتعديل تصميم الصفحة أو تقليل عدد حقول النموذج. التحقق (Check): نقيس نسبة إكمال التسجيل بعد التغيير ونقارنها بخط الأساس (40%) وبالهدف (50%) لنعرف هل نجح التغيير فعلاً."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٨٢","mcq":[{"q":"ما هي مرحلة التفكير التصميمي التي تتضمن التعرف إلى تجربة المستخدم واحتياجاته من خلال الملاحظة والأسئلة والبحث المناسب؟","o":["التعريف (Define).","توليد الأفكار (Ideate).","التعاطف (Empathize).","الاختبار (Test)."],"c":2},{"q":"أي من المراحل التالية في التفكير التصميمي تعني إنشاء مسودة سريعة أو نموذج أولي بسرعة بناءً على الأفكار المولدة؟","o":["النموذج الأولي (Prototype).","الاختبار (Test).","التعريف (Define).","التعاطف (Empathize)."],"c":0}],"essay":[{"q":"عرّف «التفكير التصميمي» وبيّن كيف يساعد في فهم المشكلة وحل المشكلات من منظور المستخدم عبر مراحله المختلفة.","m":"التفكير التصميمي (Design Thinking) طريقة مرنة لفهم المشكلة من منظور المستخدم وتجربة حلول ثم تحسينها. ويساعد عبر خمس مراحل: التعاطف لفهم تجربة المستخدم واحتياجاته، والتعريف لتوضيح المشكلة المراد حلها، وتوليد الأفكار لحلها، والنموذج الأولي لبناء نموذج سريع، والاختبار بتجربة المستخدمين للنموذج وجمع ملاحظاتهم. فيفهم الفريق المستخدم قبل الحل ثم يختبر الحل معه."},{"q":"اذكر المراحل الخمس لنموذج التفكير التصميمي واشرح باختصار المقصود بمرحلتي «التعاطف (Empathize)» و«التعريف (Define)».","m":"المراحل الخمس: التعاطف (Empathize)، والتعريف (Define)، وتوليد الأفكار (Ideate)، والنموذج الأولي (Prototype)، والاختبار (Test). التعاطف: التعرف إلى تجربة المستخدم واحتياجاته من خلال الملاحظة والأسئلة والبحث المناسب. التعريف: بناءً على المعلومات المستخلصة من مرحلة التعاطف، توضيح المشكلة المراد حلها بدقة."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٨٣","mcq":[{"q":"ما هو التعريف الدقيق لاختبار A/B؟","o":["تجربة تقارن نسختين A و B وفق مقياس محدد مسبقاً وتوزع الزيارات بينهما عشوائياً.","طريقة لإنشاء مخطط أولي يوضح تخطيط صفحة الويب.","نهج حوسبي يستخدم خصائص ميكانيكا الكم لمعالجة المعلومات.","طريقة تفكير لتحليل البيانات العددية للموقع فقط."],"c":0},{"q":"إذا أردت في اختبار A/B عزل أثر تغيير عنصر واحد (مثل لون زر الشراء)، فماذا يجب عليك فعله؟","o":["تغيير جميع عناصر الصفحة في نفس الوقت.","جعل الفرق بين النسختين واضحاً ومحدداً لهذا العنصر فقط.","الاعتماد على الحدس دون جمع بيانات كافية.","تجنب استخدام أي مقاييس عددية للقياس."],"c":1}],"essay":[{"q":"اشرح كيف يتيح «اختبار A/B» لمصممي المواقع الإلكترونية مقارنة نسختين ببيانات حقيقية وكيف يتم توزيع الزيارات بينهما.","m":"يقارن اختبار A/B نسختين A و B في تجربة منظمة وفق مقياس محدد مسبقاً، فيعرض المصمم لكل نسخة جزءاً من المستخدمين ويقيس النتيجة الفعلية لكل منهما، لا مجرد رأي أو افتراض. ويتم توزيع المستخدمين أو الزيارات بين النسختين بطريقة عشوائية قدر الإمكان أو وفق تصميم تجربة مناسب، ثم تُقارن النتائج ببيانات حقيقية لمعرفة النسخة الأفضل."},{"q":"اذكر شرطين أساسيين وضحهما الدرس لضمان نجاح «اختبار A/B» عند محاولة عزل أثر تغيير واحد بعينه.","m":"الشرطان: (1) إذا كان الهدف معرفة أثر فرق واحد بعينه، فيُجعل الفرق بين النسختين واضحاً ومحدداً، فلا يُغيَّر سوى عنصر واحد كلون الزر. (2) تحديد المقياس وخطة التحليل قبل الاختبار، ثم جمع عينة كافية قبل الحكم على النتيجة."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٨٣","mcq":[{"q":"ما مصطلح طريقة التحسين التي تكرر الخطوات الأربع: خطط - نفذ - تحقق - تصرف؟","o":["التفكير التصميمي.","دورة PDCA.","اختبار A/B.","النموذج الأولي."],"c":1},{"q":"ما مصطلح طريقة التفكير لاكتشاف المشكلات وتوليد الحلول من منظور المستخدم عبر خمس خطوات؟","o":["دورة PDCA.","اختبار A/B.","التفكير التصميمي.","التحسين المستمر."],"c":2},{"q":"ما مصطلح الطريقة التي يُعد فيها نمطان ويُقارنان بالبيانات لمعرفة أيهما أكثر فعالية؟","o":["دورة PDCA.","التفكير التصميمي.","اختبار A/B.","التعاطف."],"c":2},{"q":"أي من الخيارات التالية يصف مرحلة «الاختبار (Test)» في التفكير التصميمي بأفضل شكل؟","o":["فهم احتياجات المستخدم من خلال الملاحظة والأسئلة.","توضيح المشكلة المراد حلها بدقة.","توليد أفكار كثيرة لحل المشكلة.","جعل المستخدمين يجربون النموذج الأولي وجمع ملاحظاتهم."],"c":3}],"essay":[{"q":"اشرح بالتفصيل لماذا يُعد تحسين الموقع الإلكتروني عملية متكررة وليست مهمة تنجز لمرة واحدة، موضحاً دور دورة PDCA.","m":"لأن المواقع الإلكترونية الجيدة لا تُبنى مثالية من أول مرة، فاحتياجات المستخدمين وسلوكهم لا تنكشف كاملة إلا بعد الاستخدام والقياس. لذلك يُحسَّن الموقع على حلقات متكررة يتعلم فيها الفريق من النتائج بدلاً من افتراض أن النسخة الأولى مثالية، وقد يكون التغيير صغيراً أو كبيراً بحسب الهدف والدليل. وتنظم دورة PDCA ذلك: خطط بتحديد هدف وخطة، ونفذ التغيير، وتحقق بقياس النتائج ومقارنتها بخط الأساس والهدف، وتصرف باعتماد ما نجح أو تعديل الخطة، ثم تتكرر الدورة."},{"q":"تحدث عن نموذج التفكير التصميمي مبيناً أنه طريقة مرنة من خمسة أنماط يمكن الرجوع بينها بدلاً من المسار الخطي الصارم.","m":"التفكير التصميمي طريقة مرنة لفهم المشكلة من منظور المستخدم وتجربة حلول ثم تحسينها، ويستخدم الدرس نموذجاً شائعاً من خمسة أنماط (مراحل): التعاطف والتعريف وتوليد الأفكار والنموذج الأولي والاختبار. وهو مرن لا يسير في مسار خطي صارم، إذ يمكن الرجوع بين المراحل؛ فقد يكشف الاختبار عن فهم جديد لاحتياجات المستخدم فيعود الفريق إلى التعاطف أو التعريف، ثم يعدل الحل ويختبره من جديد."},{"q":"اشرح كيف يعمل «اختبار A/B» في مقارنة نسختين واذكر أهمية تحديد المقياس وخطة التحليل وعينة كافية.","m":"يقارن اختبار A/B نسختين A و B وفق مقياس محدد مسبقاً، وتُوزع الزيارات بينهما. وتحديد المقياس وخطة التحليل قبل الاختبار يجعل المقارنة موضوعية ويمنع تفسير النتائج بما يوافق التوقع بعد ظهورها، وجمع عينة كافية قبل الحكم يجعل النتيجة موثوقة وليست مجرد صدفة من عدد قليل من الزيارات."},{"q":"طبق دورة PDCA على مثال عملي لرفع نسبة إكمال نموذج التسجيل من 40% إلى 50% موضحاً الخطوات الأربع.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٨٤","mcq":[{"q":"من الخيارات التالية، اختر ما يقابل خطوة «تحقق (Check)» في دورة PDCA:","o":["حدد هدف خفض معدل الارتداد بنسبة 10%.","غيّر تصميم الصفحة الرئيسية وفق الخطة.","قس معدل الارتداد بعد التغيير وقارنه بخط الأساس.","اعتمد التغيير أو وسّع نطاقه."],"c":2},{"q":"من الخيارات التالية، اختر ما لا يُعد طريقة مناسبة لإجراء اختبار A/B:","o":["إعداد نمطين ومقارنتهما ببيانات حقيقية.","تغيير عدة عناصر في الوقت نفسه عند الرغبة في عزل أثر عنصر واحد.","اتخاذ القرارات فقط بعد جمع كمية كافية من البيانات.","عرض كل نمط على مستخدمين فعليين."],"c":1},{"q":"ما هو الوصف الأنسب لمفهوم عملية تحسين المواقع الإلكترونية؟","o":["إذا بُني موقع إلكتروني في البداية، فلا حاجة لأي تحسين نهائياً.","يكفي تحسين التصميم البصري للباقة مرة واحدة فقط.","من المهم التحسن تدريجياً من خلال تكرار التقييم والتحسين المستمر.","ينبغي أن تتم جميع التحسينات باختبار A/B وحده دون تخطيط."],"c":2},{"q":"أي من الخيارات التالية يصف «التفكير التصميمي» بأفضل شكل؟","o":["طريقة تستخدم بيانات عددية بحتة لتحليل استخدام الخوادم.","طريقة تفكير تؤدي إلى اكتشاف المشكلات وتوليد الحلول من منظور المستخدم.","طريقة يحدد فيها الخبراء مشكلات الواجهة استناداً لقواعد تجريدية بحتة.","طريقة لإنشاء مخطط كود البرمجة بلغة جافا سكريبت."],"c":1}],"essay":[{"q":"وضح كيف تساهم ملاحظات المستخدمين وبيانات الاستخدام في معرفة ما يعمل وما يحتاج إلى تحسين في المواقع الإلكترونية.","m":"تظهر بيانات الاستخدام ما يحدث فعلاً (كم) بالأرقام، كعدد المشاهدات ومعدل التحويل، فتبين أين تنجح الصفحات وأين تضعف. وتكشف ملاحظات المستخدمين، من خلال الملاحظة والمقابلات، أسباب ذلك (لماذا) ومواضع الصعوبة والاستياء. وبالجمع بينهما يعرف الفريق ما يعمل جيداً فيحافظ عليه، وما يحتاج إلى تحسين فيعدله ويعيد القياس."},{"q":"اشرح خطوات دورة PDCA بالتفصيل مع ذكر الوصف الخاص بكل خطوة (خطط، نفذ، تحقق، تصرف).","m":"تدفع دورة PDCA التحسين باستمرار بتكرار أربع خطوات: (1) خطط (Plan): تحديد الأهداف ووضع خطة للتحسين، كهدف واضح لتغيير مناسب. (2) نفذ (Do): التنفيذ وفق الخطة. (3) تحقق (Check): قياس النتائج وتقييم مستوى تحقيق الهدف بمقارنتها بخط الأساس والهدف. (4) تصرف (Act): بناءً على النتائج، اعتماد ما نجح أو تغيير الخطة وتحديد الخطوة التالية، ثم تتكرر الدورة."},{"q":"اذكر مراحل التفكير التصميمي الخمس واشرح باختصار مرحلتي «توليد الأفكار (Ideate)» و«النموذج الأولي (Prototype)».","m":"المراحل: التعاطف، والتعريف، وتوليد الأفكار، والنموذج الأولي، والاختبار. توليد الأفكار (Ideate): توليد أفكار كثيرة لحل المشكلة التي تم تعريفها. النموذج الأولي (Prototype): إنشاء نموذج أولي (مسودة سريعة) بسرعة بناءً على الأفكار، ليجربه المستخدمون في مرحلة الاختبار."},{"q":"ناقش أهمية أن يكون الفرق بين النسختين (A) و(B) واضحاً ومحدداً في اختبار A/B، ولماذا يؤدي تغيير عدة عناصر معاً إلى قياس أثر الحزمة بدلاً من العنصر المنفرد.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٨٦","mcq":[{"q":"طريقة مرنة لفهم المشكلة من منظور المستخدم وتجربة حلول ثم تحسينها عبر خمسة أنماط تسمى:","o":["دورة PDCA.","التفكير التصميمي.","اختبار A/B.","التحسين المستمر."],"c":1},{"q":"مسودة سريعة قابلة للاختبار يتم إنشاؤها بناءً على الأفكار المولدة في التفكير التصميمي هي:","o":["النموذج الأولي (Prototype).","البت الكلاسيكي.","الحوسبة الطرفية.","دورة التحقق."],"c":0},{"q":"تجربة تقارن نسختين A و B وفق مقياس محدد مسبقاً لتحديد الخيار الأفضل تسمى:","o":["دورة PDCA.","التفكير التصميمي.","اختبار A/B.","خط الأساس."],"c":2},{"q":"الحلقة أو الدورة التي تتألف من (خطط، نفذ، تحقق، تصرف) وتستخدم على نطاق واسع في تحسين الأعمال وإدارة الجودة هي:","o":["دورة PDCA.","اختبار A/B.","التفكير التصميمي.","نموذج التعاطف."],"c":0}],"essay":[{"q":"اشرح كيف يساعد التحسين التكراري فريق العمل على التعلم من النتائج بدلاً من افتراض أن النسخة الأولى ستكون مثالية.","m":"يعامل الفريق النسخة الأولى على أنها بداية وليست مثالية، فينفذ تغييراً ويقيس نتيجته ويتعلم منها ثم يعدل في الحلقة التالية. وبذلك تصبح القرارات مبنية على أدلة، ويتجنب الفريق افتراض نجاح النسخة الأولى، ويتحسن الموقع شيئاً فشيئاً، وقد يكون التغيير صغيراً أو كبيراً بحسب الهدف والدليل."},{"q":"ناقش كيف يسير التحسين في التفكير التصميمي ذهاباً وإياباً (بين التعاطف والتعريف والاختبار) بدلاً من اتجاه واحد صارم.","h":1},{"q":"بيّن كيف يتم تصميم اختبار A/B ناجح لموقع إلكتروني يعاني من انخفاض نسبة النقر على زر الشراء، مع تحديد المقياس وتوزيع الزيارات.","m":"(1) المشكلة: انخفاض نسبة النقر على زر الشراء. (2) نصمم النسختين: A بالزر الحالي، وB بالزر بعد تغيير واحد واضح ومحدد كاللون أو النص، لنعزل أثره. (3) نحدد قبل الاختبار المقياس وهو نسبة النقر على الزر، وخطة التحليل. (4) نوزع الزيارات بين النسختين عشوائياً قدر الإمكان. (5) نجمع عينة كافية، ثم نقارن النتائج ونعتمد النسخة الأفضل ببيانات حقيقية."},{"q":"اذكر الفروق الأساسية بين دورة PDCA والتفكير التصميمي واختبار A/B من حيث الغرض وطريقة التنفيذ.","m":"دورة PDCA: غرضها تنظيم تحسين قابل للقياس، وتُنفذ بتكرار أربع خطوات: خطط ونفذ وتحقق وتصرف. التفكير التصميمي: غرضه اكتشاف المشكلات وحلها من جانب المستخدم، ويُنفذ عبر خمس خطوات مرنة يمكن الرجوع بينها: التعاطف والتعريف وتوليد الأفكار والنموذج الأولي والاختبار. اختبار A/B: غرضه حسم الاختيار بين خيارين ببيانات حقيقية، ويُنفذ بمقارنة نسختين وفق مقياس محدد مسبقاً مع توزيع الزيارات بينهما."}]}]};

// ---------- أسئلة كتاب التقييمات (لكل فصل) ----------
window._asSel = {}; window._asPick = {}; window._asRev = {}; window._asTxt = {};
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// يعزل الكلمات اللاتينية والوسوم (مثل <header>) حتى تظهر بالاتجاه الصحيح داخل النص العربي
function fmt(s){
  const re=/<\/?[A-Za-z][A-Za-z0-9]*>|[A-Za-z0-9][A-Za-z0-9_\-\.\/#:+%=&]*(?: [A-Za-z0-9][A-Za-z0-9_\-\.\/#:+%=&]*)*/g;
  let out='', last=0, m;
  while((m=re.exec(s))){ out+=esc(s.slice(last,m.index))+'<bdi dir="ltr">'+esc(m[0])+'</bdi>'; last=m.index+m[0].length; }
  return out+esc(s.slice(last));
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffledIdx(n,key){ const a=[...Array(n).keys()], r=rng(hashStr(key)); for(let i=n-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const AR_LET = ['أ','ب','ج','د'];
const KIND_LBL = {classwork:'مهام أدائية', homework:'أداءات منزلية', exam:'تقييم أسبوعي'};

function asCounts(num){
  const secs=ASSESS[num]||[]; let m=0,e=0,h=0;
  secs.forEach(s=>{ m+=s.mcq.length; e+=s.essay.length; h+=s.essay.filter(x=>x.h).length; });
  return {m,e,h};
}
function asPickLesson(chNum,num){ window._asSel[chNum]=num; renderAssess(chNum); window.scrollTo({top:0,behavior:'smooth'}); }
function renderAssess(chNum){
  const ci=Number(chNum)-1, ch=CURRICULUM[ci], nums=ch.lessons.map(l=>l.num);
  if(!nums.includes(window._asSel[chNum])) window._asSel[chNum]=nums[0];
  const cur=window._asSel[chNum], secs=ASSESS[cur]||[], cnt=asCounts(cur);
  const lesson=ch.lessons.find(l=>l.num===cur);
  const tot=nums.reduce((a,n)=>{const c=asCounts(n); a.m+=c.m; a.e+=c.e; a.h+=c.h; return a;},{m:0,e:0,h:0});
  const tabs=ch.lessons.map(l=>{ const c=asCounts(l.num);
    return `<button class="astab${l.num===cur?' on':''}" onclick="asPickLesson('${chNum}','${l.num}')">الدرس ${l.num} <small>(${c.m+c.e})</small></button>`; }).join('');
  const nextIdx=nums.indexOf(cur)+1;
  const secHtml=secs.map((s,si)=>{
    const mcqs=s.mcq.map((q,qi)=>{
      const id=`as_${cur.replace('-','_')}_${si}_m${qi}`, key=`${cur}|${si}|m${qi}`;
      const order=shuffledIdx(q.o.length,key);
      return `<div class="q" id="${id}" data-key="${key}" data-c="${q.c}">
        <p class="qtext">${qi+1}. ${fmt(q.q)}</p>
        ${order.map((orig,pos)=>`<button class="opt" data-o="${orig}" onclick="asAnswer('${id}',this)"><span class="ol">${AR_LET[pos]}</span>${fmt(q.o[orig])}</button>`).join('')}
        <p class="explain"></p></div>`; }).join('');
    const essays=s.essay.map((q,qi)=>{
      const id=`as_${cur.replace('-','_')}_${si}_e${qi}`, key=`${cur}|${si}|e${qi}`;
      return `<div class="q" id="${id}">
        <p class="qtext">${qi+1}. ${fmt(q.q)} ${q.h?'<span class="hardtag">🔒 سؤال تحدٍّ</span>':''}</p>
        <textarea id="${id}_t" placeholder="اكتب إجابتك هنا..." oninput="window._asTxt['${key}']=this.value"></textarea>
        ${q.h
          ? `<div class="hardnote">سؤال من المستوى العالي — بلا إجابة نموذجية. حاول حلّه بنفسك، ثم ناقش إجابتك مع معلمك أو زملائك.</div>`
          : `<button class="reveal-btn" onclick="asReveal('${id}','${key}')">عرض الإجابة النموذجية</button>
             <div class="model" id="${id}_m"><b>الإجابة النموذجية:</b> ${fmt(q.m)}</div>`}
      </div>`; }).join('');
    return `<div class="card">
      <h2>${s.n} <span class="chip">${KIND_LBL[s.k]||''} — ص${s.p.replace('ص','')}</span></h2>
      <div class="qwrap"><h3 style="font-size:.9rem;margin:0 0 10px">اختيار من متعدد (${s.mcq.length})</h3>${mcqs}</div>
      <div class="qwrap"><h3 style="font-size:.9rem;margin:0 0 10px">أسئلة مقالية (${s.essay.length})</h3>${essays}</div>
    </div>`; }).join('');
  document.getElementById('main').innerHTML=`
    <p class="crumb">${ch.chapter} <span class="chip">أسئلة كتاب التقييمات</span></p>
    <h1 class="lt">أسئلة كتاب التقييمات — الفصل ${chNum}</h1>
    <div class="card"><p style="margin:0;color:var(--ink-soft)">أسئلة «الأداءات والتقييمات» لدروس هذا الفصل (${tot.m} اختيار من متعدد + ${tot.e} مقالي). الاختيار من متعدد يُصحَّح فور الإجابة. الأسئلة المقالية تظهر إجابتها النموذجية عند الطلب، أما الأسئلة الصعبة (<b>${tot.h}</b> سؤالًا في هذا الفصل، وتحمل علامة 🔒) فتُعرض أسئلة فقط للتفكير والمناقشة.</p></div>
    <div class="astabs">${tabs}</div>
    <div class="card prog" id="asProg"></div>
    <h2 style="font-size:1.1rem;margin:18px 0 0">${cur} — ${lesson.title}</h2>
    ${secHtml}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
      <button class="reveal-btn" style="background:var(--acc2)" onclick="asReset('${chNum}')">إعادة ضبط إجابات هذا الدرس</button>
      ${nextIdx<nums.length?`<button class="reveal-btn" onclick="asPickLesson('${chNum}','${nums[nextIdx]}')">الدرس التالي ←</button>`:''}
    </div>`;
  // استعادة الحالة المحفوظة (إجابات سابقة، إجابات نموذجية مفتوحة، نصوص مكتوبة)
  document.querySelectorAll('#main .q[data-key]').forEach(box=>{
    const k=box.dataset.key; if(k in window._asPick) asStyle(box, window._asPick[k], +box.dataset.c); });
  secs.forEach((s,si)=>{ s.essay.forEach((q,qi)=>{
    const id=`as_${cur.replace('-','_')}_${si}_e${qi}`, key=`${cur}|${si}|e${qi}`;
    const t=document.getElementById(id+'_t'); if(t&&window._asTxt[key]) t.value=window._asTxt[key];
    if(window._asRev[key]){ const m=document.getElementById(id+'_m'); if(m) m.classList.add('show'); } }); });
  asUpdateProg();
}
function asStyle(box,picked,correct){
  box.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(+b.dataset.o===correct) b.classList.add('correct'); else if(+b.dataset.o===picked) b.classList.add('wrong'); });
  const ex=box.querySelector('.explain'); ex.classList.add('show');
  ex.innerHTML = picked===correct ? '✓ إجابة صحيحة' : '✗ إجابة غير صحيحة — الإجابة الصحيحة موضّحة باللون الأخضر';
}
function asAnswer(id,btn){
  const box=document.getElementById(id), k=box.dataset.key; if(k in window._asPick) return;
  const o=+btn.dataset.o; window._asPick[k]=o; asStyle(box,o,+box.dataset.c); asUpdateProg();
}
function asReveal(id,key){ const m=document.getElementById(id+'_m'); m.classList.toggle('show'); window._asRev[key]=m.classList.contains('show'); }
function asUpdateProg(){
  const el=document.getElementById('asProg'); if(!el) return;
  const boxes=[...document.querySelectorAll('#main .q[data-key]')];
  let done=0, ok=0; boxes.forEach(b=>{ const k=b.dataset.key; if(k in window._asPick){ done++; if(window._asPick[k]===+b.dataset.c) ok++; } });
  const pct=boxes.length?Math.round(done/boxes.length*100):0;
  el.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.88rem"><span>تقدمك في أسئلة الاختيار من متعدد: <b>${done}</b> من ${boxes.length}</span><span>الصحيحة: <b style="color:var(--acc)">${ok}</b>${done?` (${Math.round(ok/done*100)}٪)`:''}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}
function asReset(chNum){
  const cur=window._asSel[chNum], p=cur+'|';
  [window._asPick,window._asRev,window._asTxt].forEach(o=>Object.keys(o).forEach(k=>{ if(k.startsWith(p)) delete o[k]; }));
  renderAssess(chNum);
}

let sel = {chapter:0, lesson:0};
function buildNav(){
  const box = document.getElementById('navtree'); box.innerHTML='';
  CURRICULUM.forEach((c,ci)=>{
    const d = document.createElement('div'); d.className='chap';
    d.innerHTML = `<h3>${c.chapter}</h3>`;
    c.lessons.forEach((l,li)=>{
      const b = document.createElement('button');
      b.className = 'lbtn'+(sel.chapter===ci&&sel.lesson===li?' active':'')+(!l.ready?' locked':'');
      b.innerHTML = `<span><span class="tagnum">${l.num}</span> ${l.title}</span>${!l.ready?'<span style="font-size:.7rem">قريبًا</span>':''}`;
      b.onclick=()=>{sel={chapter:ci,lesson:li}; render();};
      d.appendChild(b);
    });
    const chNum = String(ci+1);
    if(CH_REVIEW[chNum]){
      const rb = document.createElement('button');
      rb.className = 'lbtn'+(sel.chapter===ci&&sel.lesson==='review'?' active':'');
      rb.style.color='var(--acc2)'; rb.style.fontWeight='700';
      rb.innerHTML = `<span>📝 مراجعة شاملة على الفصل</span>`;
      rb.onclick=()=>{sel={chapter:ci,lesson:'review'}; render();};
      d.appendChild(rb);
    }
    if(ci===0){
      const tb = document.createElement('button');
      tb.className = 'lbtn';
      tb.style.color='var(--acc2)'; tb.style.fontWeight='700';
      tb.innerHTML = `<span>⏱️ اختبارات تصحيح تلقائي (مؤقتة)</span>`;
      tb.onclick=()=>{ location.href='tests-ch1.html'; };
      d.appendChild(tb);
    }
    if(ASSESS[c.lessons[0].num]){
      const ab = document.createElement('button');
      ab.className = 'lbtn'+(sel.chapter===ci&&sel.lesson==='assess'?' active':'');
      ab.style.color='var(--acc)'; ab.style.fontWeight='700';
      ab.innerHTML = `<span>📚 أسئلة كتاب التقييمات</span>`;
      ab.onclick=()=>{sel={chapter:ci,lesson:'assess'}; render();};
      d.appendChild(ab);
    }
    box.appendChild(d);
  });
}

// ---------- عرض مراجعة نهاية الفصل ----------
window._revMcq = {}; window._revEssayRate = {};
function renderChapterReview(chNum){
  const data = CH_REVIEW[chNum];
  const main = document.getElementById('main');
  window._revMcq = {}; window._revEssayRate = {};
  main.innerHTML = `
    <p class="crumb">${CURRICULUM[Number(chNum)-1].chapter} <span class="chip">مراجعة شاملة</span></p>
    <h1 class="lt">${data.title}</h1>
    <div class="card"><p style="color:var(--ink-soft)">هذه المراجعة تغطي كل دروس الفصل: ${data.mcq.length} سؤال اختيار من متعدد + ${data.essay.length} سؤال مقالي. أجب عن كل الأسئلة أولًا، ثم اضغط "إظهار الإجابات النموذجية والنتيجة" في الأسفل — الإجابات كلها ستظهر مجمّعة بعد الأسئلة مباشرة.</p></div>
    <div class="card"><h2>أولًا: اختيار من متعدد (${data.mcq.length} سؤال)</h2>
      ${data.mcq.map((q,qi)=>`
        <div class="q">
          <p class="qtext">${qi+1}. ${q.q}</p>
          ${q.opts.map((o,oi)=>`<label style="display:block;margin-bottom:5px;cursor:pointer"><input type="radio" name="rev${chNum}q${qi}" value="${oi}" onchange="window._revMcq[${qi}]=${oi}"> ${o}</label>`).join('')}
        </div>`).join('')}
    </div>
    <div class="card"><h2>ثانيًا: أسئلة مقالية (${data.essay.length} سؤال)</h2>
      ${data.essay.map((q,qi)=>`
        <div class="q">
          <p class="qtext">${qi+1}. ${q.q}</p>
          <textarea id="rev${chNum}essay${qi}" placeholder="اكتب إجابتك هنا..."></textarea>
        </div>`).join('')}
    </div>
    <button class="submit-btn" onclick="revealChapterAnswers('${chNum}')">إظهار الإجابات النموذجية والنتيجة</button>
    <div id="revAnswers${chNum}"></div>
  `;
}

function revealChapterAnswers(chNum){
  const data = CH_REVIEW[chNum];
  let mcqCorrect = 0;
  const mcqHtml = data.mcq.map((q,qi)=>{
    const picked = window._revMcq[qi];
    const ok = picked===q.c;
    if(ok) mcqCorrect++;
    return `<div class="q"><p class="qtext">${qi+1}. ${q.q}</p>
      <p class="explain show">الإجابة الصحيحة: <b style="color:var(--acc)">${q.opts[q.c]}</b>${picked!==undefined?(ok?' — إجابتك صحيحة ✓':' — إجابتك: '+q.opts[picked]+' (غير صحيحة)'):' — لم تُجب على هذا السؤال'}</p></div>`;
  }).join('');
  const essayHtml = data.essay.map((q,qi)=>`
    <div class="q"><p class="qtext">${qi+1}. ${q.q}</p>
      <div class="model show"><b>الإجابة النموذجية:</b> ${q.model}</div>
      <div class="selfrate">قيّم إجابتك: <label><input type="radio" name="revrate${chNum}_${qi}" onchange="window._revEssayRate[${qi}]=true"> صحيحة</label>
      <label><input type="radio" name="revrate${chNum}_${qi}" onchange="window._revEssayRate[${qi}]=false"> تحتاج تحسين</label></div>
    </div>`).join('');
  document.getElementById('revAnswers'+chNum).innerHTML = `
    <div class="card"><h2>✓ إجابات الاختيار من متعدد</h2>${mcqHtml}
      <p style="margin-top:10px;font-weight:700">النتيجة: ${mcqCorrect} / ${data.mcq.length}</p></div>
    <div class="card"><h2>✓ الإجابات النموذجية للأسئلة المقالية</h2>${essayHtml}
      <button class="reveal-btn" onclick="finalChapterScore('${chNum}')">احسب نتيجتي النهائية</button>
      <div class="score-box" id="revFinalScore${chNum}" style="display:none"></div>
    </div>
  `;
  document.getElementById('revAnswers'+chNum).scrollIntoView({behavior:'smooth'});
}

function finalChapterScore(chNum){
  const data = CH_REVIEW[chNum];
  let mcqCorrect = 0;
  data.mcq.forEach((q,qi)=>{ if(window._revMcq[qi]===q.c) mcqCorrect++; });
  let essayOk=0, essayRated=0;
  data.essay.forEach((q,qi)=>{ if(window._revEssayRate[qi]!==undefined){essayRated++; if(window._revEssayRate[qi]) essayOk++;} });
  const total = data.mcq.length + data.essay.length;
  const score = mcqCorrect + essayOk;
  const box = document.getElementById('revFinalScore'+chNum);
  box.style.display='block';
  box.innerHTML = `<div class="big">${score} / ${total}</div>
    <p>اختيار من متعدد: ${mcqCorrect}/${data.mcq.length} — مقالي (تقييم ذاتي): ${essayOk}/${essayRated}</p>
    <p>${score/total>=0.7?'ممتاز! إتقان جيد جدًا لمحتوى الفصل 👏':score/total>=0.5?'جيد، راجع الدروس التي تكرر فيها الخطأ.':'يُنصح بمراجعة دروس الفصل والمصطلحات الأساسية ثم إعادة المحاولة 💪'}</p>`;
}

function renderReady(l){
  const main = document.getElementById('main');
  main.innerHTML = `
    <p class="crumb">${l.chapter} <span class="chip">${l.num}</span></p>
    <h1 class="lt">${l.title}</h1>
    <div class="card"><h2>🎯 أهداف التعلم</h2><ul class="pt">${l.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>
    <div class="card"><h2>⭐ الفكرة الرئيسية</h2><p>${l.mainIdea}</p></div>
    ${l.sections.map(s=>`<div class="card"><h2>${s.h}</h2>${s.html}</div>`).join('')}
    <div class="card"><h2>📌 أهم النقاط</h2><ul class="pt">${l.keyPoints.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    <div class="card"><h2>📖 مراجعة سريعة — المصطلحات الأساسية</h2><div class="gloss">${l.glossary.map(g=>`<div class="gterm"><b>${g.t}</b><br>${g.d}</div>`).join('')}</div></div>
    <div class="card" id="examCard">
      <h2>📝 امتحان تفاعلي (${l.mcq.length} اختيار من متعدد + ${l.essay.length} مقالي)</h2>
      <p style="color:var(--ink-soft);font-size:.88rem">أجب أولًا عن الأسئلة، ثم اضغط "عرض النتيجة" في الأسفل.</p>
      <div class="qwrap"><h3 style="font-size:.9rem">أولًا: اختيار من متعدد</h3>
        ${l.mcq.map((q,qi)=>`
          <div class="q" data-mcq="${qi}">
            <p class="qtext">${qi+1}. ${q.q}</p>
            ${q.opts.map((o,oi)=>`<button class="opt" onclick="answerMcq(this,${qi},${oi},${q.c})">${o}</button>`).join('')}
            <p class="explain">${q.ex}</p>
          </div>`).join('')}
      </div>
      <div class="qwrap"><h3 style="font-size:.9rem">ثانيًا: أسئلة مقالية</h3>
        ${l.essay.map((q,qi)=>`
          <div class="q" data-essay="${qi}">
            <p class="qtext">${qi+1}. ${q.q}</p>
            <textarea id="essay-${qi}" placeholder="اكتب إجابتك هنا..."></textarea>
            <br><button class="reveal-btn" onclick="revealModel(${qi})">عرض الإجابة النموذجية</button>
            <div class="model" id="model-${qi}">${q.model}</div>
            <div class="selfrate" id="rate-${qi}" style="display:none">
              قيّم إجابتك بنفسك:
              <label><input type="radio" name="rate${qi}" value="1" onchange="setRate(${qi},true)"> إجابتي صحيحة</label>
              <label><input type="radio" name="rate${qi}" value="0" onchange="setRate(${qi},false)"> تحتاج تحسين</label>
            </div>
          </div>`).join('')}
      </div>
      <button class="submit-btn" onclick="showResult(${l.mcq.length},${l.essay.length})">عرض النتيجة النهائية</button>
      <div class="score-box" id="resultBox" style="display:none"></div>
    </div>
  `;
  window._mcqAnswered = {}; window._essayRate = {};
}

function answerMcq(btn, qi, oi, correct){
  const wrap = btn.parentElement;
  if(wrap.dataset.done) return; wrap.dataset.done="1";
  wrap.querySelectorAll('.opt').forEach((o,i)=>{o.disabled=true; if(i===correct) o.classList.add('correct');});
  if(oi!==correct) btn.classList.add('wrong');
  wrap.querySelector('.explain').classList.add('show');
  window._mcqAnswered[qi] = (oi===correct);
}
function revealModel(qi){
  document.getElementById('model-'+qi).classList.add('show');
  document.getElementById('rate-'+qi).style.display='block';
}
function setRate(qi, ok){ window._essayRate[qi] = ok; }

function showResult(nMcq, nEssay){
  let mcqCorrect = 0;
  for(let i=0;i<nMcq;i++) if(window._mcqAnswered[i]) mcqCorrect++;
  let essayOk = 0, essayRated = 0;
  for(let i=0;i<nEssay;i++){ if(window._essayRate[i]!==undefined){essayRated++; if(window._essayRate[i]) essayOk++;} }
  const totalAnswered = Object.keys(window._mcqAnswered).length;
  const total = nMcq + nEssay;
  const score = mcqCorrect + essayOk;
  const box = document.getElementById('resultBox');
  box.style.display='block';
  let mistakes='';
  if(totalAnswered < nMcq || essayRated < nEssay){
    mistakes = `<div class="mistake">لم تُجب/تُقيّم بعد على كل الأسئلة — أجب أولًا لتحصل على نتيجة دقيقة (اختيار من متعدد: ${totalAnswered}/${nMcq}، مقالي مُقيَّم: ${essayRated}/${nEssay}).</div>`;
  }
  box.innerHTML = `
    <div class="big">${score} / ${total}</div>
    <p>اختيار من متعدد: ${mcqCorrect}/${nMcq} — مقالي (تقييم ذاتي): ${essayOk}/${essayRated || 0}</p>
    <p>${score/total>=0.7?'ممتاز! فهم جيد جدًا للدرس 👏':score/total>=0.5?'جيد، راجع النقاط التي أخطأت فيها.':'يُنصح بمراجعة الدرس والمصطلحات الأساسية ثم إعادة المحاولة 💪'}</p>
    ${mistakes}
  `;
  box.scrollIntoView({behavior:'smooth'});
}

function renderSoon(l, chap){
  document.getElementById('main').innerHTML = `
    <p class="crumb">${chap} <span class="chip">${l.num}</span></p>
    <h1 class="lt">${l.title}</h1>
    <div class="card soon">هذا الدرس قيد الإعداد وسيُضاف قريبًا 🚧<br><span style="font-size:.85rem">جرّب الدرس 1-1 المتاح الآن من القائمة الجانبية.</span></div>
  `;
}

const LESSON_DATA = {"1-1":L11, "1-2":L12, "1-3":L13, "1-4":L14, "2-1":L21, "2-2":L22, "2-3":L23, "3-1":L31, "3-2":L32, "3-3":L33, "4-1":L41, "4-2":L42, "4-3":L43, "4-4":L44};
function render(){
  buildNav();
  if(sel.lesson==='review'){ renderChapterReview(String(sel.chapter+1)); return; }
  if(sel.lesson==='assess'){ renderAssess(String(sel.chapter+1)); return; }
  const l = CURRICULUM[sel.chapter].lessons[sel.lesson];
  if(l.ready && LESSON_DATA[l.num]) renderReady(LESSON_DATA[l.num]);
  else renderSoon(l, CURRICULUM[sel.chapter].chapter);
}
render();
</script>

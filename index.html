<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة البرمجة والذكاء الاصطناعي — الصف الثاني الثانوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --paper:#F1F4EE; --ink:#16241F; --ink-soft:#4B5A50;
  --acc:#2F6F4F; --acc-soft:#DCEAE1; --acc2:#B4432E; --acc2-soft:#F3DBD6;
  --line:#CBD5C4; --card:#FFFFFF;
  --radius:14px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#141A16;--ink:#EDF2EA;--ink-soft:#A9BAAE;--acc:#5FAE85;--acc-soft:#1E2B24;--acc2:#E08A76;--acc2-soft:#3A231F;--line:#313D37;--card:#1C2420;}
}
:root[data-theme="dark"]{--paper:#141A16;--ink:#EDF2EA;--ink-soft:#A9BAAE;--acc:#5FAE85;--acc-soft:#1E2B24;--acc2:#E08A76;--acc2-soft:#3A231F;--line:#313D37;--card:#1C2420;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Cairo','Tajawal',sans-serif;line-height:1.8}
.shell{display:flex;min-height:100vh}
.side{width:290px;flex:0 0 290px;background:var(--card);border-left:1px solid var(--line);padding:20px 14px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
.brand{font-weight:900;font-size:1.1rem;margin:0}
.brand small{display:block;font-weight:500;color:var(--ink-soft);font-size:.76rem;margin-top:3px}
.chap{margin-top:18px}
.chap h3{font-size:.8rem;color:var(--ink-soft);margin:0 0 6px;font-weight:700}
.lbtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:right;background:none;border:none;padding:8px 10px;border-radius:9px;color:var(--ink);font-family:inherit;font-size:.88rem;cursor:pointer;margin-bottom:2px}
.lbtn:hover{background:var(--paper)}
.lbtn.active{background:var(--acc-soft);color:var(--acc);font-weight:700}
.lbtn.locked{color:var(--ink-soft)}
.tagnum{font-size:.72rem;opacity:.7;margin-left:4px}
.main{flex:1;min-width:0;padding:30px 36px 60px;max-width:800px}
.crumb{font-size:.8rem;color:var(--ink-soft);margin-bottom:6px}
h1.lt{font-size:1.65rem;margin:0 0 14px;font-weight:900}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:16px 0}
.card h2{font-size:1.05rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
ul.pt{margin:0;padding-inline-start:20px}
ul.pt li{margin-bottom:7px}
table.era{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:8px}
table.era th,table.era td{border:1px solid var(--line);padding:7px 9px;text-align:right;vertical-align:top}
table.era th{background:var(--acc-soft);color:var(--acc)}
.gloss{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.gterm{background:var(--paper);border-radius:9px;padding:9px 11px;font-size:.85rem}
.gterm b{color:var(--acc)}
.chip{display:inline-block;background:var(--acc-soft);color:var(--acc);font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px}
.qwrap{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.q{margin-bottom:18px}
.q p.qtext{font-weight:700;margin:0 0 8px}
.opt{display:block;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:5px;font-family:inherit;font-size:.9rem;color:var(--ink);cursor:pointer}
.opt.correct{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.opt.wrong{background:var(--acc2-soft);border-color:var(--acc2);color:var(--acc2);font-weight:700}
.explain{font-size:.85rem;color:var(--ink-soft);margin-top:5px;display:none}
.explain.show{display:block}
textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:inherit;padding:10px;font-size:.9rem;resize:vertical}
.reveal-btn,.act-btn{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-family:inherit;font-size:.86rem;cursor:pointer;margin-top:8px}
.model{display:none;background:var(--acc-soft);border-radius:9px;padding:10px 12px;margin-top:8px;font-size:.87rem}
.model.show{display:block}
.selfrate{margin-top:8px;font-size:.85rem}
.selfrate label{margin-inline-end:14px;cursor:pointer}
.submit-btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-family:inherit;font-size:.95rem;cursor:pointer;margin-top:10px}
.score-box{text-align:center;padding:26px 10px}
.score-box .big{font-size:2.3rem;font-weight:900;color:var(--acc)}
.mistake{background:var(--acc2-soft);border-radius:9px;padding:10px 12px;margin-top:8px;font-size:.85rem}
.soon{padding:50px 10px;text-align:center;color:var(--ink-soft)}
@media(max-width:760px){.gloss{grid-template-columns:1fr}.shell{flex-direction:column}.side{width:100%;flex:none;height:auto;position:relative;border-left:none;border-bottom:1px solid var(--line)}.main{padding:20px 16px 50px}}

.astabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.astab{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem}
.astab.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.astab small{opacity:.75}
.ol{display:inline-block;min-width:1.5em;font-weight:900;color:var(--acc);margin-inline-end:6px}
.opt.correct .ol,.opt.wrong .ol{color:inherit}
.hardtag{display:inline-block;background:var(--acc2-soft);color:var(--acc2);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;margin-inline-start:6px;white-space:nowrap}
.hardnote{background:var(--acc2-soft);color:var(--acc2);border-radius:9px;padding:8px 12px;margin-top:8px;font-size:.85rem;font-weight:600}
.card.prog{position:sticky;top:0;z-index:5;padding:12px 18px;margin:12px 0}
.card h2{flex-wrap:wrap}
.bar{height:7px;border-radius:99px;background:var(--acc-soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
bdi{unicode-bidi:isolate}
</style>
</head>

// ---------- محتوى الدرس 1-1 (كامل) ----------
const L11 = {
 num:"1-1", chapter:"1 — تكنولوجيا المعلومات والمجتمع",

 objectives:[

 sections:[
   {h:"1. مراحل تطور تكنولوجيا المعلومات", html:`
     <p>مرّت تكنولوجيا المعلومات بسلسلة من المراحل المتتابعة، من الحواسيب الأولى إلى الإنترنت والحوسبة السحابية، وغيّرت كل مرحلة طريقة تواصل الناس وعملهم وتعلّمهم ودفعهم.</p>

     </table>`},
   {h:"2. قانون مور", html:`
     <p>يصف قانون مور اتجاهًا تاريخيًا لازدياد عدد الترانزستورات في الدوائر المتكاملة بمعدل يقارب الضعف كل عامين — وهو ليس قانونًا فيزيائيًا ثابتًا، لكنه استمر عقودًا وأسهم في زيادة قدرات الحوسبة.</p>
     <p>يواجه استمرار تصغير الدوائر تحديات هندسية وفيزيائية (كازدياد تيارات التسرب وتأثيرات كمومية)، لذلك يعتمد تحسين الأداء اليوم أيضًا على تعدد الأنوية والمعالجة المتوازية. أما الحوسبة الكمومية فهي نهج مختلف قد يفيد في فئات محددة من المسائل، وليست بديلًا عامًا للحواسيب التقليدية.</p>`},

       <li><b>التجارة الإلكترونية:</b> بيع السلع والخدمات وشراؤها عبر الإنترنت (مثل أمازون وإيباي).</li>
       <li><b>العمل عن بُعد:</b> أداء المهام من المنزل أو موقع آخر باستخدام الإنترنت.</li>
       <li><b>التعلّم عبر الإنترنت:</b> تقديم الدروس والمواد التعليمية عبر الإنترنت.</li>
       <li><b>الدفع غير النقدي:</b> دفع قيمة السلع بوسائل غير نقدية، كالبطاقات المصرفية أو رموز QR.</li>
     </ul>`},
   {h:"4. تقنيات ناشئة بارزة", html:`

       <li><b>الواقع المعزز (AR):</b> يضيف عناصر رقمية إلى مشهد من العالم الحقيقي. <b>الواقع الافتراضي (VR):</b> يضع المستخدم داخل بيئة رقمية كاملة موّلدة حاسوبيًا.</li>
       <li><b>الحوسبة الكمومية:</b> نهج يستخدم خصائص ميكانيكا الكم (الكيوبت بدل البت التقليدي)، وقد يتفوّق في فئات محددة من المسائل دون أن يسرّع كل أنواع الحسابات.</li>
     </ul>`}
 ],
 keyPoints:[

 mcq:[
   {q:"ما الترتيب الزمني الصحيح لمراحل تطور تكنولوجيا المعلومات؟", opts:["ظهور الحاسب ← الهواتف الذكية ← تسويق الإنترنت ← الحوسبة السحابية","ظهور الحاسب ← تسويق الإنترنت ← الهواتف الذكية ← الحوسبة السحابية","تسويق الإنترنت ← ظهور الحاسب ← الحوسبة السحابية ← الهواتف الذكية","الهواتف الذكية ← تسويق الإنترنت ← ظهور الحاسب ← الحوسبة السحابية"], c:1, ex:"الحاسب (أربعينيات-ستينيات) ثم الإنترنت تجاريًا (تسعينيات) ثم الهواتف الذكية (العقد الأول) ثم السحابة (العقد الثاني فصاعدًا)."},

   {q:"لماذا تُعالَج بيانات القيادة الذاتية أحيانًا بالحوسبة الطرفية بدل السحابة؟", opts:["لتقليل تكلفة الإنترنت فقط","لأن السحابة غير موجودة في السيارات","لتقليل زمن الاستجابة لأن التأخير قد يؤثر في السلامة","لأن الحوسبة الطرفية أرخص دائمًا"], c:2, ex:"سرعة اتخاذ قرار القيادة أمر حرج للسلامة، فمعالجة البيانات محليًا وفوريًا تقلل زمن الاستجابة."},

 ],
 essay:[

   {q:"حلّل لماذا يناسب الذكاء الاصطناعي بعض المهام بينما يتطلب الحذر في مهام أخرى. [أشِر في إجابتك إلى ما يبرع فيه (إيجاد الأنماط، التعرف، التنبؤ) وما يتطلب الحذر (الأحكام الأخلاقية، الخصوصية، القرار النهائي)]", model:"يناسب الذكاء الاصطناعي المهام التي تعتمد على اكتشاف أنماط متكررة في كميات كبيرة من البيانات، كالتعرف على الصور والأصوات والتنبؤ الإحصائي، لأنه يؤدي هذه المهام بسرعة ودقة عالية غالبًا. لكنه يتطلب الحذر في المهام التي تحتاج حكمًا أخلاقيًا أو تمس خصوصية الأفراد أو تترتب عليها قرارات نهائية عالية الأثر، لأن النظام قد يعكس تحيزًا في بياناته أو يخطئ دون أن يتحمل مسؤولية أخلاقية عن ذلك — فتبقى هذه الجوانب من اختصاص الحكم البشري."},

   {q:"اذكر ميزة واقعية واحدة لإدخال الذكاء الاصطناعي في الزراعة، ومصدر قلق واحد ينبغي مراعاته قبل ذلك.", model:"الميزة: يمكن للذكاء الاصطناعي التنبؤ بموعد الحصاد الأمثل والكشف المبكر عن الآفات والأمراض، مما يزيد الإنتاجية ويقلل الخسائر. مصدر القلق: دقة هذه التنبؤات تعتمد على جودة بيانات التدريب (كصور المحاصيل)، فإذا كانت البيانات غير ممثلة لظروف المزرعة المحلية فقد تكون التوصيات غير دقيقة."}

   {q:"ترغب مدرسة في استخدام كاميرات تعرف على الوجه عند بوابتها لتسجيل الحضور تلقائيًا. حدد فائدة عملية واحدة للمدرسة، ومصدر قلق واحد يتعلق بالخصوصية. ثم إذا أخطأت الكاميرا في التعرف على طالب، من ينبغي أن يكون مسؤولًا؟", model:"الفائدة: توفير الوقت والجهد في تسجيل الحضور يدويًا كل يوم. مصدر القلق: جمع بيانات بيومترية حساسة عن الطلاب (وجوههم) وتخزينها يثير مخاوف بشأن كيفية حمايتها ومن يمكنه الوصول إليها. عند الخطأ، تقع المسؤولية بشكل مشترك: المدرسة (كجهة مشغِّلة) مسؤولة عن اختيار نظام موثوق ومراجعة نتائجه، والشركة المطوّرة مسؤولة عن دقة النظام وجودة بياناته التدريبية."},

 ]

     <p>باختصار: <b>المفتاح العام</b> للمصادقة والاتفاق الآمن على مفاتيح الجلسة، و<b>التشفير المتماثل</b> لحماية بيانات الجلسة بسرعة بعد ذلك.</p>`},
   {h:"2. المصادقة الثنائية والمتعددة العوامل", html:`
     <p><b>المصادقة الثنائية (2FA):</b> استخدام عاملين مستقلين من فئتين مختلفتين لإثبات الهوية (مثل: كلمة مرور + رمز يُرسل للهاتف). <b>المصادقة متعددة العوامل (MFA):</b> استخدام عاملين أو أكثر من فئات مختلفة (المعرفة، الحيازة، السمات الحيوية).</p>
     <table class="era">
       <tr><th>الخدمة</th><th>أمثلة على المصادقة المستخدمة</th></tr>
       <tr><td>الخدمات المصرفية</td><td>كلمة المرور (معرفة) + كلمة مرور لمرة واحدة (حيازة)</td></tr>
       <tr><td>تسجيل الدخول لوسائل التواصل</td><td>كلمة المرور (معرفة) + رسالة SMS (حيازة)</td></tr>
       <tr><td>الدخول إلى مبنى مؤمَّن</td><td>بطاقة دخول (حيازة) + بصمة إصبع (سمات حيوية)</td></tr>
     </table>
     <p>⚠️ ملحوظة: كلمتا مرور مختلفتان لا تُعدّان مصادقة ثنائية — لأن كلتيهما من فئة "المعرفة" نفسها؛ لا بد أن يكون العاملان من فئتين مختلفتين.</p>`},
   {h:"3. تركيبات تقنيات الأمان", html:`
     <table class="era">
       <tr><th>التقنية</th><th>التأثير</th></tr>
       <tr><td>التشفير</td><td>يمنع قراءة محتوى الاتصال من قِبل أطراف ثالثة</td></tr>
       <tr><td>التوقيع الرقمي</td><td>يدعم التحقق من سلامة البيانات وهوية الموقّع، ويوفر دليلًا يدعم <b>عدم التنصل</b></td></tr>
       <tr><td>الشهادة الرقمية</td><td>تساعد المتصفح على التحقق من هوية الخادم واسم النطاق</td></tr>
       <tr><td>المصادقة الثنائية (2FA)</td><td>تقلل احتمال تسجيل الدخول غير المصرح به</td></tr>
     </table>
     <p>لا يأتي الأمان عبر الإنترنت من تقنية واحدة، بل من الجمع بين عدة تقنيات بحيث تُعالَج تهديدات كثيرة في آنٍ واحد (كالتنصت والتلاعب وانتحال الهوية والدخول غير المصرح به) — من دون افتراض أن أي تقنية تمنع الخطر منعًا مطلقًا.</p>`}
 ],

   {q:"اشرح لماذا يستخدم TLS آليات المفتاح العام للمصادقة والاتفاق الآمن على مفاتيح الجلسة، ثم يستخدم التشفير المتماثل لحماية بيانات الجلسة. [استعن بـ: الأمان والكفاءة. 6 درجات]", model:"يستخدم TLS المفتاح العام في بداية الاتصال لأنه يتيح المصادقة الآمنة والاتفاق على مفتاح مشترك دون الحاجة لإرسال المفتاح نفسه عبر الشبكة، مما يوفر أمانًا عاليًا رغم بطئه النسبي. وبعد إنشاء مفاتيح الجلسة، يتحول النظام إلى التشفير المتماثل لأنه أسرع وأكفأ بكثير في معالجة وحماية الكميات الكبيرة من البيانات المتبادلة طوال الجلسة، فيجمع النظام بذلك بين أمان المفتاح العام في البداية وكفاءة التشفير المتماثل أثناء النقل."},
   {q:"يريد متجر إلكتروني صغير تأمين تسجيل دخول العملاء والدفع معًا. سمِّ تقنيتي أمان يجب أن يستخدمهما، وبيّن أين تساعد كل منهما، ثم حدد تهديدًا واحدًا قد يظل قائمًا.", model:"التقنية الأولى: HTTPS (التشفير + الشهادة الرقمية) لحماية سرية البيانات أثناء النقل والتأكد من هوية الموقع. التقنية الثانية: المصادقة الثنائية (2FA) عند تسجيل الدخول لتقليل احتمال دخول شخص غير مصرح له حتى لو سُرقت كلمة المرور. تهديد قد يظل قائمًا: هجمات الهندسة الاجتماعية (مثل خداع العميل نفسه ليكشف عن رمز التحقق طوعًا)، فهذه التقنيات لا تمنع خطأ المستخدم البشري."},
   {q:"لماذا لا تُعد كلمتا مرور مختلفتان مصادقة ثنائية حقيقية؟ وما الحل الصحيح لتوفير عامل ثانٍ فعلي؟", model:"لأن المصادقة الثنائية تشترط أن يكون العاملان من فئتين مختلفتين (كالمعرفة والحيازة أو السمات الحيوية)، وكلمتا المرور كلتاهما من فئة \"المعرفة\" نفسها، فمعرفة إحداهما لا تختلف جوهريًا عن معرفة الأخرى إذا تمكن مهاجم من الوصول لهما بنفس الطريقة. الحل الصحيح: إضافة عامل من فئة مختلفة، مثل رمز يُرسل إلى الهاتف (حيازة) أو بصمة إصبع (سمة حيوية)."},
   {q:"وضّح دور كل من التوقيع الرقمي والشهادة الرقمية بجملة لكل منهما، مع ذكر الفرق الجوهري بينهما.", model:"التوقيع الرقمي يتحقق من سلامة بيانات أو رسالة محددة ومن هوية من وقّعها، ويوفر دليلًا يمنع صاحبها من إنكار توقيعه (عدم التنصل). أما الشهادة الرقمية فتساعد المتصفح على التحقق من هوية الخادم نفسه وارتباطه باسم النطاق الذي يتصل به. الفرق الجوهري: التوقيع يخص رسالة أو بيانات محددة، بينما الشهادة تخص هوية الطرف (الخادم) في الاتصال ذاته."}

   {q:"اشرح لماذا يحمي تكديس عدة إجراءات أمنية في طبقات (الدفاع في العمق) المؤسسة بشكل أفضل من الاعتماد على جدار الحماية وحده. [استعن بـ: ما يحدث إذا تم اختراق أحد الإجراءات. 6 درجات]", model:"إذا اعتمدت المؤسسة على جدار الحماية وحده، فإن اختراقه يعني كشف الشبكة بأكملها فورًا دون أي عائق آخر. أما مع الدفاع في العمق، فحتى لو تجاوز مهاجم طبقة واحدة (كجدار الحماية)، تبقى طبقات أخرى (كتشفير VPN، وعزل الخوادم في DMZ، وحماية الأجهزة الطرفية) تحد من قدرته على الوصول إلى الموارد الحساسة أو تُبطئه، مما يقلل احتمال أن يؤدي خرق واحد إلى كشف النظام كله."},
   {q:"تقوم شركة بإعداد شبكة مكتبها، ولديها موقع إلكتروني عام، وموظفون يعملون من المنزل، وبيانات عملاء سرية. اقترح إجراءً أمنيًا مناسبًا لكل أصل من هذه الأصول الثلاثة، مع تبرير مختصر لكل اختيار.", model:"الموقع الإلكتروني العام: يوضع في منطقة معزولة (DMZ) لعزله عن الشبكة الداخلية، بحيث لا يؤدي اختراقه إلى الوصول لبيانات العملاء. الموظفون عن بُعد: يتصلون عبر VPN لتشفير اتصالهم بشبكة المؤسسة وحمايته من التنصت. بيانات العملاء السرية: تُحمى بجدار حماية صارم يمنع أي وصول خارجي مباشر، إضافة لتطبيق نهج انعدام الثقة الذي يتحقق من هوية وصلاحيات كل من يحاول الوصول إليها حتى لو كان داخل الشبكة."},
   {q:"لماذا لم يعد الاعتماد على حماية \"المحيط الأمني\" فقط (فرضية أن الداخل آمن والخارج خطر) كافيًا اليوم؟ وما الحل الذي يقترحه نهج انعدام الثقة؟", model:"لم يعد كافيًا لأن انتشار الخدمات السحابية والعمل عن بُعد جعل الحدود بين \"داخل\" الشبكة و\"خارجها\" غير واضحة؛ فالموظف قد يصل للموارد من المنزل، والبيانات قد تكون مخزنة في السحابة خارج الشبكة التقليدية. الحل الذي يقترحه نهج انعدام الثقة هو عدم منح أي ثقة تلقائية بناءً على موقع المستخدم أو الجهاز، والتحقق من الهوية والصلاحيات والسياق في كل طلب وصول، بغض النظر عن مكان الاتصال."},
   {q:"ينقل مستشفى سجلات مرضاه إلى خدمة سحابية ويسمح للأطباء بالوصول إليها من المنزل. باستخدام نهج انعدام الثقة والدفاع في العمق، اقترح إجراءين ينبغي تطبيقهما وبيّن أين يساعد كل منهما، ثم حدد خطرًا واحدًا قد يظل قائمًا.", model:"الإجراء الأول: إلزام الأطباء بالاتصال عبر VPN مشفَّر عند الوصول من المنزل، لحماية سرية سجلات المرضى أثناء النقل. الإجراء الثاني: تطبيق نهج انعدام الثقة بالتحقق من هوية كل طبيب وصلاحياته (وربما مصادقة ثنائية) عند كل طلب وصول للسجلات، بدل افتراض أن اتصاله من المنزل آمن تلقائيًا. خطر قد يظل قائمًا: سرقة أو فقدان جهاز الطبيب نفسه بعد تسجيل دخوله، مما قد يتيح لشخص آخر استخدام الجلسة المفتوحة."}
 ]
};

 essay:[
  {q:"اشرح كيف تتعاون الطبقات الثلاث لتطبيق الويب عندما ينشر المستخدم صورة على تطبيق تواصل اجتماعي. [أشِر إلى دور الواجهة الأمامية والخلفية وقاعدة البيانات. 6 درجات]", model:"تعرض الواجهة الأمامية شاشة النشر وتستقبل الصورة من المستخدم وترسلها إلى الواجهة الخلفية. تعالج الواجهة الخلفية الطلب (كالتحقق من تسجيل الدخول وتحديد الجمهور المستهدف للمنشور) ثم تطلب من قاعدة البيانات تخزين بيانات المنشور. تحفظ قاعدة البيانات المنشور، وتعيد تأكيدًا للواجهة الخلفية التي ترسل النتيجة إلى الواجهة الأمامية لتعرض المنشور الجديد في الخط الزمني."},
  {q:"يريد مركز طبي تطبيق ويب للحجز. وزّع المهام التالية على الطبقات مع التبرير: نموذج الحجز، التحقق من الأوقات المتاحة، تخزين الزيارات السابقة.", model:"نموذج الحجز: الواجهة الأمامية لأنه ما يراه المستخدم ويملؤه. التحقق من الأوقات المتاحة: الواجهة الخلفية لأنه معالجة وتطبيق لقواعد التطبيق على الخادم. تخزين الزيارات السابقة: قاعدة البيانات لأنها تحفظ البيانات وتوفرها عند الحاجة."},
  {q:"تفتح صفحة الحجز لكن لا تظهر أوقات متاحة. اذكر جزأين قد يكونان سبب المشكلة، وما المعلومة التي تحتاجها للتأكد؟", model:"قد تكون المشكلة في الواجهة الخلفية (فشل معالجة طلب الأوقات) أو في قاعدة البيانات (عدم وجود بيانات أو تعذر الوصول إليها)، وقد تكون في عرض النتائج بالواجهة الأمامية. للتأكد نحتاج معرفة هل وصل الطلب إلى الخلفية، وهل أعادت قاعدة البيانات بيانات، وما الرسائل الظاهرة في سجلات الأخطاء."},
  {q:"يتيح تطبيق طقس للمستخدم كتابة اسم مدينة ورؤية التوقعات. سمِّ الطبقة المسؤولة عن: أخذ اسم المدينة، والبحث عن بيانات التوقعات، وتخزين التوقعات السابقة، وحدد مهمة لا يمكن للواجهة الأمامية القيام بها وحدها.", model:"أخذ اسم المدينة: الواجهة الأمامية. البحث عن بيانات التوقعات: الواجهة الخلفية. تخزين التوقعات السابقة: قاعدة البيانات. لا تستطيع الواجهة الأمامية وحدها تخزين التوقعات السابقة أو معالجة الطلب على الخادم، فهذا يتطلب الواجهة الخلفية وقاعدة البيانات."}
 ]

 essay:[
  {q:"اشرح لماذا يحسّن فريق موقع إلكتروني عمله عبر دورات PDCA متكررة بدلًا من محاولة بناء موقع مثالي دفعة واحدة. [راجع: قياس النتائج والتصرف بناءً عليها. 6 درجات]", model:"لأن النسخة الأولى نادرًا ما تكون مثالية. تتيح PDCA تحديد هدف قابل للقياس والتخطيط لتغيير (خطّط)، وتنفيذه (نفّذ)، ثم قياس النتيجة ومقارنتها بالهدف (تحقّق)، وأخيرًا اعتماد ما نجح أو تعديل الخطة (تصرّف). التكرار يسمح بالتعلم من النتائج والتحسن تدريجيًا بتغييرات صغيرة مقاسة بدل مخاطرة إعادة تصميم كل شيء دفعة واحدة."},

  {q:"متجر إلكتروني تنخفض فيه نسبة النقر على زر الشراء. صف اختبار A/B مناسبًا: الفرق بين النسختين، والمقياس، وطريقة التوزيع، وكيف تستخدم النتيجة في PDCA.", model:"الفرق: نسخة A بزر أحمر ونسخة B بزر أزرق (عنصر واحد واضح). المقياس المحدد مسبقًا: نسبة النقر على زر الشراء. التوزيع: توزيع الزيارات بين النسختين عشوائيًا قدر الإمكان مع جمع عينة كافية قبل الحكم. الاستخدام في PDCA: تُستخدم النتيجة في خطوة تحقّق، ثم تصرّف باعتماد النسخة الأفضل أو تعديل الخطة."}

 essay:[
  {q:"صمم بنية أمنية متكاملة لموقع تجارة إلكترونية يخزن بيانات بطاقات العملاء، مستخدمًا التشفير و2FA وVPN وDMZ، وبرر كل عنصر.", model:"HTTPS (تشفير + شهادة رقمية) لحماية الاتصال بين العميل والخادم والتأكد من هوية الموقع. 2FA عند تسجيل دخول الموظفين والعملاء لتقليل احتمال الاختراق حتى لو سُرقت كلمة المرور. DMZ لعزل خادم الويب العام عن قاعدة بيانات العملاء الحساسة، بحيث لا يؤدي اختراق الواجهة إلى كشف البيانات مباشرة. VPN لموظفي الدعم الذين يصلون عن بُعد لحماية اتصالهم. هذه الطبقات مجتمعة تطبق مبدأ الدفاع في العمق."},
  {q:"حلّل لماذا يفشل الاعتماد على إجراء أمني واحد في حماية مؤسسة من حادث أمني، مستخدمًا مفهومي الدفاع في العمق والاستجابة للحوادث.", model:"إذا اخترق المهاجم الإجراء الوحيد (كجدار الحماية)، ينكشف النظام بالكامل فورًا دون أي عائق إضافي. الدفاع في العمق يضمن أن اختراق طبقة واحدة لا يعني سقوط النظام كله، إذ تبقى طبقات أخرى (VPN، DMZ، حماية الأجهزة) تبطئ المهاجم أو تحد من أثره. وحتى مع أفضل الطبقات قد يقع حادث، فتأتي خطة الاستجابة للحوادث (الاحتواء، الاستئصال، الاستعادة) لاحتواء الضرر وتقليل تكراره."},
  {q:"تعرّضت مدرسة لهجوم ببرنامج فدية شفّر ملفات سجلات الطلاب. صف كيف تُطبَّق مراحل الاستجابة الست، واذكر ضابطًا وقائيًا واحدًا كان سيقلل احتمال وقوعه.", model:"الاحتواء: عزل الأجهزة المصابة عن الشبكة فورًا. الاستئصال: إزالة البرمجية الخبيثة ومعالجة الثغرة المستغلة. الاستعادة: استرجاع الملفات من نسخة احتياطية سليمة. الدروس المستفادة: تحليل سبب الاختراق وتحديث سياسات الحماية. ضابط وقائي كان سيقلل الاحتمال: تطبيق نهج انعدام الثقة والتحقق الصارم من صلاحيات الوصول لمنع انتشار البرمجية بسهولة عبر الشبكة."},
  {q:"لدى مؤسسة مخاطرتان: (1) تسرب بيانات — تأثير كبير واحتمالية متوسطة، (2) انقطاع كهرباء قصير — تأثير صغير واحتمالية عالية. أيهما تُعطى الأولوية وفق صيغة التأثير × الاحتمالية؟ برر.", model:"على الأرجح تسرب البيانات يُعطى أولوية أعلى لأن درجة خطره (تأثير كبير × احتمالية متوسطة) غالبًا أعلى من انقطاع الكهرباء (تأثير صغير × احتمالية عالية)، لأن ضخامة التأثير على سرية بيانات العملاء وسمعة المؤسسة يفوق أثر انقطاع قصير يمكن التعافي منه بسرعة نسبيًا."},
  {q:"اشرح كيف يدعم التوقيع الرقمي مبدأ عدم التنصل في معاملة إلكترونية موقعة.", model:"يوفر التوقيع الرقمي دليلًا رياضيًا يربط رسالة أو معاملة معينة بهوية من وقّعها باستخدام مفتاحه الخاص، بحيث لا يستطيع صاحب التوقيع لاحقًا إنكار أنه من قام بهذه المعاملة، لأن أي طرف يمكنه التحقق من صحة التوقيع باستخدام المفتاح العام المقابل له."},
  {q:"لماذا يُعد نهج انعدام الثقة أنسب من الاعتماد على «المحيط الأمني» وحده في عصر العمل عن بُعد والسحابة؟", model:"لأن انتشار السحابة والعمل عن بُعد جعل الحدود بين داخل الشبكة وخارجها غير واضحة، فقد يصل الموظف من المنزل أو تكون البيانات مخزنة خارج الشبكة التقليدية. نهج انعدام الثقة يتحقق من هوية وصلاحيات كل طلب وصول بغض النظر عن الموقع، بدل افتراض أن كل ما هو «داخل» الشبكة آمن تلقائيًا."},
  {q:"متجر إلكتروني يستخدم HTTPS و2FA، لكن اخترق حساب موظف عبر هندسة اجتماعية وتسرّبت بيانات عملاء. صف مراحل الاستجابة المناسبة وضابطًا لتحسين الحماية مستقبلًا.", model:"الاحتواء: تعطيل حساب الموظف المخترق فورًا ومراجعة صلاحياته. الاستئصال: التأكد من عدم وجود وصول آخر غير مصرح به وإعادة تعيين بيانات الدخول. الاستعادة: إعادة الخدمات لوضعها الطبيعي مع إشعار العملاء المتأثرين. الدروس المستفادة: تدريب الموظفين على التعرف على هجمات الهندسة الاجتماعية، وتطبيق نهج انعدام الثقة بمراجعة الصلاحيات دوريًا."},
  {q:"قارن بين دور جدار الحماية ودور نهج انعدام الثقة في حماية شبكة مؤسسة.", model:"جدار الحماية يراقب حركة المرور عند نقاط دخول/خروج محددة ويسمح بها أو يمنعها وفق قواعد ثابتة مسبقًا. أما انعدام الثقة فهو مبدأ أوسع يتحقق من هوية وصلاحيات كل طلب وصول في أي وقت وموقع، فلا يفترض أن الاتصال من داخل الشبكة أو عبر الجدار آمن تلقائيًا. يكمل أحدهما الآخر ولا يغني أحدهما عن الآخر."},
  {q:"اشرح كيف يقلل الجمع بين DMZ وجدار الحماية و2FA من احتمالية وقوع حادث أمني واحتوائه إن وقع.", model:"جدار الحماية يمنع كثيرًا من محاولات الوصول غير المصرح به عند حدود الشبكة. DMZ يعزل الخوادم العامة، فإذا اخترق أحدها لا يصل المهاجم مباشرة للشبكة الداخلية. 2FA يقلل احتمال اختراق الحسابات حتى لو سُرقت كلمة مرور. مجتمعة، تقلل هذه الطبقات احتمال وقوع الحادث، وإن وقع فإنها تحد من انتشاره وتسهّل احتواءه بسرعة."},
  {q:"بعد حادث أمني، كيف تساعد مرحلة «الدروس المستفادة والتحسين» في تطوير تصميم أمان الشبكة مستقبلًا؟", model:"تتيح هذه المرحلة تحليل كيفية وقوع الحادث وأي الضوابط فشلت أو غابت (كعدم وجود 2FA أو ثغرة في الجدار)، فتُستخدم النتائج لتحديث تصميم الشبكة بإضافة طبقات دفاع جديدة أو تعديل السياسات، بما يقلل احتمال تكرار الحادث نفسه مستقبلًا."}
 ]
},
"3": { title:"مراجعة شاملة — الفصل الثالث: تطبيقات الويب",
 mcq:[
  {q:"عند طلب تسجيل دخول، أي طريقة HTTP الأنسب لإرسال بيانات النموذج؟", opts:["GET","POST","DELETE فقط","لا حاجة لطريقة محددة"], c:1},
  {q:"من يستقبل طلب POST ويعالج منطق تسجيل الدخول؟", opts:["الواجهة الأمامية وحدها","الواجهة الخلفية","قاعدة البيانات وحدها","المتصفح فقط"], c:1},
  {q:"عند نجاح تسجيل الدخول، أي رمز حالة HTTP يُتوقع؟", opts:["404","500","200","لا يوجد رمز"], c:2},
  {q:"ماذا يمثل استخدام API يعيد بيانات بصيغة JSON بين الواجهتين؟", opts:["تخزين دائم للبيانات","تبادل منظم للبيانات بين الخلفية والأمامية","تصميم مرئي للصفحة","نوعًا من التشفير"], c:1},
  {q:"أي تقنية تحدد بنية صفحة تسجيل الدخول (الحقول والعناوين)؟", opts:["CSS","JavaScript","HTML","API"], c:2},
  {q:"أي تقنية تتحقق فوريًا من صحة كلمة المرور المدخلة قبل الإرسال للخادم (سلوك تفاعلي)؟", opts:["HTML","CSS","JavaScript","HTTP"], c:2},
  {q:"ما فائدة HTML الدلالية لمستخدم يعتمد على قارئ الشاشة عند تصفح تطبيق حجز مواعيد؟", opts:["تسريع الخادم","مساعدته على فهم بنية الصفحة والتنقل فيها","تقليل حجم الصور","تشفير البيانات"], c:1},
  {q:"لماذا يحتاج تطبيق ويب للحجوزات إلى تصميم متجاوب؟", opts:["لتحسين ترتيب محركات البحث فقط","لأن المستخدمين يصلون من أجهزة وأحجام شاشات مختلفة","لإضافة سلوك للصفحة","لتشفير الاتصال"], c:1},
  {q:"ما الفائدة الرئيسية لاستخدام إطار عمل مثل React في تطبيق يعرض قائمة مواعيد تتحدث باستمرار؟", opts:["تشفير البيانات تلقائيًا","توفير مكونات جاهزة قابلة لإعادة الاستخدام وتحديثها عند تغير البيانات","تحسين رمز حالة HTTP","إلغاء الحاجة لقاعدة بيانات"], c:1},
  {q:"في تطبيق حجز مواعيد، أي طبقة تحفظ سجل المواعيد السابقة وتوفرها عند الطلب؟", opts:["الواجهة الأمامية","الواجهة الخلفية","قاعدة البيانات","CSS"], c:2}
 ],
 essay:[
  {q:"اشرح دورة كاملة لطلب تسجيل دخول من الواجهة الأمامية حتى قاعدة البيانات والعودة، مستخدمًا طريقة HTTP المناسبة ورمز حالة.", model:"يملأ المستخدم نموذج تسجيل الدخول في الواجهة الأمامية (HTML) فترسل البيانات بطلب POST إلى الواجهة الخلفية عبر HTTPS. تتحقق الواجهة الخلفية من البيانات مقارنة بقاعدة البيانات؛ فإذا صحت البيانات تعيد قاعدة البيانات تأكيدًا، فترسل الواجهة الخلفية استجابة برمز حالة 200 مع بيانات الجلسة، فتعرض الواجهة الأمامية الصفحة الرئيسية. أما إذا كانت البيانات خاطئة فقد تُعاد استجابة تحمل رسالة خطأ مناسبة."},
  {q:"صمم تطبيق ويب بسيطًا لحجز مواعيد عيادة، موزعًا المسؤوليات على الطبقات الثلاث وتقنيات HTML/CSS/JavaScript.", model:"الواجهة الأمامية: HTML لبناء نموذج الحجز وعرض الأوقات المتاحة، CSS لتنسيق الألوان والتخطيط، JavaScript لتحديث قائمة الأوقات المتاحة فوريًا دون إعادة تحميل الصفحة. الواجهة الخلفية: تستقبل طلب الحجز (POST)، تتحقق من توفر الموعد، وتطبق قواعد العيادة. قاعدة البيانات: تخزن المواعيد المحجوزة وسجل زيارات المرضى السابقة وتوفرها عند الطلب."},
  {q:"قارن بين دور API/JSON في نقل البيانات بين الواجهة الخلفية والأمامية، ودور CSS في عرضها للمستخدم.", model:"يتولى API نقل البيانات بشكل منظم بين الخادم والمتصفح، وتُمثَّل البيانات المتبادلة غالبًا بصيغة JSON النصية المهيكلة، فتحمل المحتوى الخام (كقائمة المواعيد). أما CSS فيتولى العرض البصري لهذه البيانات بعد وصولها: الألوان والتخطيط والخطوط، فيحوّل البيانات الخام إلى واجهة مقروءة وجذابة للمستخدم."},
  {q:"اشرح لماذا تحتاج صفحة تسجيل الدخول إلى كل من HTTPS وطريقة POST معًا وليس أحدهما فقط.", model:"يحمي HTTPS سرية الاتصال وسلامته عبر التشفير أثناء النقل، فيمنع تنصت أي طرف على البيانات. أما POST فهو الطريقة المناسبة لإرسال بيانات حساسة (اسم المستخدم وكلمة المرور) ليعالجها الخادم بدل إظهارها في عنوان الرابط كما يحدث مع GET. أحدهما يحمي القناة، والآخر يحدد طريقة الإرسال المناسبة، وكلاهما ضروري معًا لصفحة تسجيل دخول آمنة."},
  {q:"صمم صفحة متجاوبة بـHTML دلالي لموقع إخباري، واذكر فائدة اختيارك في التصميم المتجاوب وفائدة اختيارك في HTML الدلالي.", model:"أستخدم عنصر header للعنوان الرئيسي وnav للتنقل بين الأقسام وmain للمقالات وfooter لمعلومات الموقع (HTML دلالي)، مع تخطيط عمود واحد يتحول تلقائيًا حسب حجم الشاشة (تصميم متجاوب). فائدة HTML الدلالية: تساعد قارئ الشاشة ومحركات البحث على فهم بنية الصفحة. فائدة التصميم المتجاوب: يسهّل القراءة سواء من الهاتف أو الكمبيوتر."},
  {q:"حلّل ماذا يحدث إذا أعاد الخادم رمز حالة 500 بدل 200 عند محاولة تسجيل الدخول، وكيف يجب أن تتعامل الواجهة الأمامية مع ذلك.", model:"رمز 500 يعني خطأً داخليًا منع الخادم من إكمال الطلب، أي فشل في معالجة تسجيل الدخول لسبب في الخادم نفسه لا في بيانات المستخدم. يجب أن تتعامل الواجهة الأمامية بعرض رسالة واضحة للمستخدم تفيد بوجود مشكلة مؤقتة وتطلب إعادة المحاولة لاحقًا، بدل الصمت أو عرض الصفحة وكأن الدخول نجح."},
  {q:"اشرح كيف يساعد إطار عمل مبني على React (مثل Next.js) في تطوير تطبيق يعرض قائمة مواعيد تتحدث ديناميكيًا.", model:"يوفر React مكونات قابلة لإعادة الاستخدام (كبطاقة موعد واحدة) تُحدَّث تلقائيًا عند تغير البيانات دون إعادة بناء الصفحة كاملة. ويضيف Next.js فوق ذلك التوجيه بين الصفحات وطرقًا لعرضها من الخادم أو العميل، فيوفر على المطورين كتابة هذا المنطق من الصفر ويسرّع التطوير."},
  {q:"اربط بين فائدتين لـHTML الدلالية: إمكانية الوصول وفهم محركات البحث، مستخدمًا مثالًا واحدًا لكل منهما.", model:"إمكانية الوصول: استخدام عنصر nav يتيح لقارئ الشاشة إخبار المستخدم الكفيف أن هذا الجزء للتنقل، فيسهل عليه القفز إليه مباشرة. فهم محركات البحث: استخدام main لتمييز المحتوى الرئيسي يساعد محرك البحث على فهم أن هذا الجزء هو جوهر الصفحة، مع أن ذلك لا يضمن ترتيبًا أعلى بالضرورة."},
  {q:"اشرح الفرق بين معالجة طلب حجز موعد في الواجهة الخلفية وتخزينه في قاعدة البيانات، بمثال.", model:"عند إرسال طلب حجز، تستقبل الواجهة الخلفية البيانات (اسم المريض والوقت المطلوب) وتتحقق من توفر الوقت وتطبق قواعد العيادة (كعدد الحجوزات المسموح بها). فإذا كان الوقت متاحًا، تطلب الواجهة الخلفية من قاعدة البيانات حفظ سجل الحجز الجديد بشكل دائم، بينما تقتصر معالجة الواجهة الخلفية نفسها على المنطق المؤقت لتلك اللحظة دون تخزين دائم."},
  {q:"لماذا لا تحتاج كل صفحة ويب إلى JavaScript؟ اذكر مثالًا لصفحة تكتفي بـHTML وCSS فقط.", model:"لأن بعض الصفحات لا تحتاج إلى سلوك تفاعلي يتغير بعد تحميلها، بل يكفيها عرض محتوى ثابت بشكل منظم وجذاب. مثال: صفحة «من نحن» في موقع عيادة تعرض نص التعريف بالعيادة وصورة الفريق دون الحاجة لأي تفاعل، فيكفيها HTML لبناء المحتوى وCSS لتنسيق مظهره."}
 ]
},
"4": { title:"مراجعة شاملة — الفصل الرابع: تصميم الويب والوسائط",
 mcq:[
  {q:"مدرسة تريد إعلام أولياء الأمور بموعد اجتماع عاجل لعدد كبير في أسرع وقت. أي وسيلة أنسب؟", opts:["الصحيفة المطبوعة","رسائل نصية/بريد إلكتروني مباشر أو تطبيق تواصل جماعي","الراديو المحلي","لا فرق بين الوسائل"], c:1},
  {q:"ما الذي تُبنى عليه شخصية المستخدم (Persona) قدر الإمكان؟", opts:["تخيلات المصمم الشخصية","بحث أو بيانات عن أهداف المستخدمين واحتياجاتهم وسياقهم","ذوق المصمم في الألوان","آراء الإدارة فقط"], c:1},
  {q:"ما دور المخطط الهيكلي (Wireframe) في عملية التصميم؟", opts:["اختيار الألوان النهائية","تحديد مكان العناصر وأولوياتها قبل التصميم البصري","كتابة أكواد JavaScript","تحليل بيانات الزيارات"], c:1},
  {q:"أي مبدأ من CRAP يفسّر توحيد لون وخط العناوين في كل صفحات الموقع؟", opts:["التباين","التكرار","المحاذاة","التقارب"], c:1},
  {q:"ما الفرق بين PV ومعدل التحويل (CVR)؟", opts:["لا فرق بينهما","PV إجمالي المشاهدات، وCVR نسبة من حققوا إجراءً مستهدفًا","CVR يقيس عدد الزيارات فقط","PV يقيس فقط النجاح في الشراء"], c:1},
  {q:"من يُجري التقييم الإرشادي (Heuristic Evaluation)؟", opts:["المستخدمون العاديون فقط","خبراء الواجهة وفق قواعد إرشادية عملية","أداة تحليلات آلية بالكامل","خادم الموقع تلقائيًا"], c:1},
  {q:"في دورة PDCA، أي خطوة تقابل «قياس نسبة إكمال النموذج بعد التغيير ومقارنتها بالهدف»؟", opts:["خطّط","نفّذ","تحقّق","تصرّف"], c:2},
  {q:"ما الخطوة الأولى في التفكير التصميمي؟", opts:["النموذج الأولي","التعاطف","الاختبار","توليد الأفكار"], c:1},
  {q:"لإجراء اختبار A/B سليم لعزل أثر تغيير واحد، ماذا يجب أن يكون الفرق بين النسختين؟", opts:["متعدد العناصر دفعة واحدة","واضحًا ومحددًا لعنصر واحد","غير محدد مسبقًا","عشوائيًا تمامًا دون مقياس"], c:1},
  {q:"موقع لديه PV مرتفع وCVR منخفض. أي أداة تقييم نوعية تساعد على فهم السبب؟", opts:["زيادة عدد الإعلانات","اختبار قابلية استخدام أو مقابلات مع مستخدمين","تجاهل المشكلة لأن PV مرتفع","تغيير الخادم فقط"], c:1}
 ],
 essay:[
  {q:"صمم عملية كاملة لتحسين صفحة تسجيل موقع مدرسي: من اختيار وسيلة الإعلان عنها، إلى شخصية المستخدم والمخطط الهيكلي، إلى القياس، إلى دورة تحسين.", model:"اختيار الوسيلة: وسائل التواصل الاجتماعي والبريد الإلكتروني للوصول للطلاب وأولياء الأمور بسرعة. شخصية المستخدم: طالب يريد التسجيل بسرعة من هاتفه. المخطط الهيكلي: وضع زر التسجيل بارزًا أعلى الصفحة قبل أي تفاصيل ثانوية. القياس: تتبع PV ومعدل التحويل (CVR) لصفحة التسجيل. دورة التحسين: إذا كان CVR منخفضًا رغم PV مرتفع، نجري اختبار قابلية استخدام لمعرفة السبب، ثم نخطط تغييرًا واحدًا (PDCA) ونقيس أثره."},
  {q:"اشرح كيف يكشف ارتفاع PV وانخفاض CVR مشكلة، وكيف تستخدم التفكير التصميمي لحلها.", model:"ارتفاع PV مع انخفاض CVR يعني أن عددًا كبيرًا يصل للصفحة لكن قلة تكمل الإجراء المطلوب، وهذا يشير إلى وجود عائق في العملية لكنه لا يحدد سببه. باستخدام التفكير التصميمي: نتعاطف مع المستخدمين بملاحظتهم أو سؤالهم، ثم نعرّف المشكلة بدقة (كصعوبة إيجاد الزر)، ونولّد أفكارًا للحل، ونبني نموذجًا أوليًا للتغيير، ونختبره مع مستخدمين حقيقيين قبل تعميمه."},
  {q:"قيّم قرار فريق بنى موقعًا اعتمادًا على التصميم البصري (الألوان والخطوط) فقط دون شخصية مستخدم أو مخطط هيكلي. ما المخاطر؟", model:"من المرجح أن ينحرف التصميم نحو تفضيلات المصمم الشخصية بدل احتياجات المستخدمين الفعليين، فقد توضع المعلومات المهمة في مكان غير متوقَّع للمستخدم. غياب شخصية المستخدم يعني عدم فهم واضح لمن يستخدم الموقع ولماذا، وغياب المخطط الهيكلي يعني أن قرارات توزيع المحتوى اتُخذت متأخرة أو عشوائيًا، مما يزيد احتمال الحاجة لإعادة تصميم لاحقًا بعد اكتشاف ارتباك المستخدمين."},
  {q:"صمم اختبار A/B لتحسين معدل التحويل في صفحة تسجيل، محددًا الفرق بين النسختين والمقياس، واربطه بخطوة من دورة PDCA.", model:"النسخة A بزر تسجيل بلون محايد، والنسخة B بزر بلون بارز متباين (فرق واحد واضح). المقياس المحدد مسبقًا: معدل التحويل (نسبة من أكملوا التسجيل من الزوار). يُوزَّع الزوار عشوائيًا بين النسختين وتُجمع عينة كافية. هذا الاختبار يمثل خطوتي «نفّذ» و«تحقّق» في دورة PDCA، حيث تُقاس النتيجة ثم تُعتمد النسخة الأفضل في خطوة «تصرّف»."},
  {q:"اربط بين مبدأ «التقارب» في CRAP وبين نتيجة تقييم إرشادي أظهرت ارتباك المستخدمين في صفحة منتج.", model:"لو أظهر التقييم الإرشادي أن المستخدمين يواجهون صعوبة في ربط اسم المنتج بسعره وصورته لأنها متفرقة في الصفحة، فإن الحل يكمن في تطبيق مبدأ التقارب: تجميع اسم المنتج وصورته وسعره قريبة من بعضها بحيث تُدرَك كمجموعة واحدة من أول نظرة، مما يقلل الارتباك المرصود."},
  {q:"اقترح وسيلة إعلامية مناسبة لإطلاق ميزة جديدة في تطبيق مدرسي، ثم صف كيف تقيّم نجاحها كميًا ونوعيًا.", model:"وسيلة الإطلاق: إشعار داخل التطبيق مع منشور على وسائل التواصل الاجتماعي للوصول السريع للطلاب. التقييم الكمي: قياس عدد مرات استخدام الميزة الجديدة (PV) ونسبة من استمر باستخدامها (CVR). التقييم النوعي: إجراء مقابلات قصيرة أو استبيان رأي مع عينة من الطلاب لفهم رأيهم في سهولة استخدام الميزة وأسباب عدم استخدامها إن وُجدت."},
  {q:"اشرح دورة كاملة من التفكير التصميمي لحل مشكلة انخفاض تسجيل الطلاب في فعالية مدرسية.", model:"التعاطف: سؤال عينة من الطلاب عن سبب عدم تسجيلهم. التعريف: توضيح أن المشكلة هي صعوبة إيجاد رابط التسجيل على الهاتف. توليد الأفكار: اقتراحات مثل تكبير الزر، أو إرسال رابط مباشر بالرسائل. النموذج الأولي: تصميم سريع لصفحة معدّلة بزر بارز. الاختبار: عرضها على عينة من الطلاب ومراقبة هل وجدوا الرابط بسرعة أكبر، مع إمكان العودة لخطوة التعريف إذا ظهرت مشكلة جديدة."},
  {q:"قارن بين التقييم الكمي والنوعي في سياق موقع تجارة إلكترونية مدرسي (لبيع منتجات النادي)، مبينًا متى نحتاج كلًا منهما.", model:"التقييم الكمي (PV، معدل الارتداد، CVR) يفيد في معرفة «كم» عدد الزوار ونسبة من أكملوا الشراء، وهو مفيد لرصد وجود مشكلة أو تتبع الأداء مع الوقت. التقييم النوعي (مقابلات، اختبار قابلية استخدام، تقييم إرشادي) يفيد في فهم «لماذا» يتعثر المستخدمون، مثل صعوبة العثور على سلة الشراء. نحتاج الكمي أولًا لرصد المشكلة، والنوعي لاحقًا لفهم سببها وتصميم حل مناسب."},
  {q:"صمم وصفًا لمخطط هيكلي (لا تصميمًا بصريًا) لصفحة رئيسية لعيادة، مستندًا إلى شخصية مستخدم محددة.", model:"شخصية المستخدم: مريض يريد معرفة مواعيد العمل وحجز موعد بسرعة من هاتفه. المخطط الهيكلي: أعلى الصفحة اسم العيادة وزر «احجز موعدًا» بارز، يليه قسم مواعيد العمل والعنوان، ثم قسم الخدمات المقدَّمة، وأخيرًا معلومات التواصل في الأسفل — كل ذلك بدون تحديد ألوان أو خطوط بعد، تركيزًا على أولوية المعلومات لا مظهرها."},
  {q:"اشرح كيف تساعد دورة PDCA على تفادي إعادة تصميم الموقع بالكامل دفعة واحدة.", model:"تدفع PDCA الفريق إلى تحديد هدف صغير قابل للقياس وتنفيذ تغيير واحد محدود (خطّط ونفّذ)، ثم قياس أثره فعليًا قبل أي خطوة أخرى (تحقّق)، واعتماد ما نجح أو تعديل الخطة (تصرّف). هذا التكرار المتدرج يقلل مخاطر إعادة تصميم شاملة قد تفشل بالكامل، ويسمح بالتعلم من كل دورة صغيرة قبل الانتقال للتالية."}
 ]
}
};

const ASSESS = {"1-1":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٣","mcq":[{"q":"أي من الخيارات التالية يمثل التقنية أو الحدث الرئيسي المرتبط بفترة السبعينيات والثمانينيات من القرن الماضي؟","o":["ظهور الهواتف الذكية","انتشار الحواسيب الشخصية (PCs)","انتشار الحوسبة السحابية","إتاحة الإنترنت للاستخدام التجاري وظهور الويب"],"c":1},{"q":"ما هي الملاحظة التجريبية التي تصف اتجاهاً تاريخياً لازدياد عدد الترانزستورات في الدوائر المتكاملة بمعدل يقارب الضعف كل عامين؟","o":["الحوسبة السحابية","قانون مور","الحوسبة الطرفية","التراكب الكمي"],"c":1}],"essay":[{"q":"اشرح تطور تكنولوجيا المعلومات في الفترة الممتدة من الأربعينيات إلى الستينيات موضحاً استخدامها الأساسي في تلك الفترة؟","m":"في الأربعينيات حتى الستينيات ظهرت الحواسيب الإلكترونية ومنها ENIAC، وكانت تعتمد على الصمامات المفرغة، وكانت الحواسيب الأولى تملأ غرفة بأكملها. وكان استخدامها الأساسي في تلك الفترة للأغراض العسكرية والحسابات العلمية."},{"q":"وضح المقصود بـ «قانون مور» وهل يُعد قانوناً فيزيائياً ثابتاً؟ فسر إجابتك","m":"قانون مور هو الملاحظة التجريبية القائلة إن عدد الترانزستورات في الدائرة المتكاملة يتضاعف تقريباً كل عامين. وليس قانوناً فيزيائياً ثابتاً، بل اتجاه تاريخي استمر عقوداً وأسهم في زيادة قدرات الحوسبة، ويواجه تحديات هندسية وفيزيائية عند مواصلة تصغير المكونات، لذلك لا يُضمن استمراره."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٣","mcq":[{"q":"ما هو المصطلح الذي يشير إلى نمط عمل يؤدي فيه الشخص مهامه من المنزل أو من موقع آخر بعيد باستخدام الإنترنت؟","o":["التعلم عبر الإنترنت","التجارة الإلكترونية","العمل عن بعد (Remote Work)","الدفع غير النقدي"],"c":2},{"q":"ما المقصود بخدمة «شبكات التواصل الاجتماعي (SNS)»؟","o":["منصات تتيح للمستخدمين التواصل ونشر المحتوى ومشاركته بسرعة.","بيع السلع والخدمات وشراؤها عبر الإنترنت.","دفع قيمة السلع أو الخدمات بوسائل غير نقدية.","نمط تعليمي تُقدم فيه الدروس عبر الإنترنت."],"c":0}],"essay":[{"q":"اذكر ثلاثة تغيرات اجتماعية ناتجة عن تكنولوجيا المعلومات؟","m":"من التغيرات الاجتماعية الناتجة عن تكنولوجيا المعلومات: (1) شبكات التواصل الاجتماعي التي تتيح التواصل ونشر المحتوى ومشاركته بسرعة. (2) العمل عن بعد، إذ يؤدي الشخص مهامه من المنزل أو من موقع بعيد باستخدام الإنترنت. (3) التعلم عبر الإنترنت، إذ تُقدم الدروس والمواد التعليمية عبر الإنترنت. ومنها أيضاً التجارة الإلكترونية والدفع غير النقدي."},{"q":"ما المقصود بمصطلح «التجارة الإلكترونية (E-commerce)»؟ موضحاً ذلك بمثالين.","m":"التجارة الإلكترونية (E-commerce) هي بيع السلع والخدمات وشراؤها عبر الإنترنت، فيتم عرض المنتجات وطلبها وسداد ثمنها دون الحاجة إلى متجر فعلي في كل مرة. ومن الأمثلة: المتاجر الإلكترونية مثل أمازون (Amazon) وإيباي (eBay)، حيث يعرض البائعون سلعهم ويشتريها المستخدمون عبر الإنترنت."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٤","mcq":[{"q":"ما هي التقنية التي تقضي بمعالجة البيانات على الجهاز نفسه فوراً بدلاً من إرسالها إلى السحابة لتجنب التأخير في اتخاذ القرار؟","o":["الحوسبة السحابية.","الحوسبة الكمومية.","الحوسبة الطرفية.","شبكات التواصل الاجتماعي."],"c":2},{"q":"أي من الخيارات الآتية يمثل المفهوم الدقيق لتقنية «الواقع المعزز (AR)»؟","o":["تقنية تضع المستخدم داخل بيئة افتراضية مولدة حاسوبياً بالكامل.","تقنية تضيف عناصر أو معلومات رقمية إلى مشهد من العالم الحقيقي.","نهج حوسبي يستخدم خصائص ميكانيكا الكم لمعالجة المعلومات.","نظام لإجراء المدفوعات بالنقود الإلكترونية ورموز QR."],"c":1}],"essay":[{"q":"وضح كيف تساهم «الحوسبة الطرفية» في تعزيز الأمان وسرعة اتخاذ القرار في تقنية القيادة الذاتية دون الحاجة إلى إرسال البيانات إلى السحابة؟","m":"في القيادة الذاتية تجمع المركبة بيانات كاميرات ومستشعرات، والتأخير في معالجتها قد يؤثر في السلامة. وتعالج الحوسبة الطرفية هذه البيانات على المركبة نفسها فوراً بدلاً من إرسالها إلى السحابة، فيقل زمن الاستجابة ويُتخذ قرار القيادة دون انتظار الاتصال بالسحابة، مما يعزز السلامة وسرعة القرار."},{"q":"قارن بإيجاز بين «الواقع المعزز (AR)» و«الواقع الافتراضي (VR)» من حيث التعريف وطريقة العمل؟","m":"الواقع المعزز (AR): تقنية تضيف عناصر أو معلومات رقمية إلى مشهد من العالم الحقيقي، فيبقى المستخدم في بيئته الواقعية وتظهر فوقها عناصر رقمية. الواقع الافتراضي (VR): تقنية تضع المستخدم داخل بيئة افتراضية مولدة حاسوبياً، فينتقل إلى بيئة رقمية كاملة. فالمعزز يضيف إلى الواقع، والافتراضي يضع المستخدم في بيئة رقمية كاملة."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٥","mcq":[{"q":"ما الذي يميز «الكيوبت (qubit)» عن «البت الكلاسيكي» في الحوسبة الكمومية؟","o":["يحمل حالة محددة واحدة إما 0 أو 1 في كل وقت.","يستخدم مبدأ التراكب الكمي ليكون مزيجاً من 0 و1 في نفس الوقت.","يعتمد فقط على الدوائر المتكاملة التقليدية وثبات التيار الكهربائي.","يقتصر استخدامه حصرياً على الحسابات البسيطة."],"c":1},{"q":"ما المقصود بمصطلح «الدفع غير النقدي (Cashless Payment)»؟","o":["بيع السلع والخدمات وشراؤها عبر المتاجر الفعلية باستخدام النقد الورقي.","دفع قيمة السلع أو الخدمات بوسائل غير نقدية مثل البطاقات أو تطبيقات الهاتف أو رموز QR.","العمل من المنزل باستخدام الإنترنت والبريد الإلكتروني.","تقديم الدروس والمواد التعليمية عبر الإنترنت للمستخدمين."],"c":1}],"essay":[{"q":"اشرح المبدأ الذي يقوم عليه «الكيوبت (qubit)» في الحوسبة الكمومية وكيف يختلف عن «البت الكلاسيكي»؟","m":"يقوم الكيوبت (qubit) على مبدأ التراكب الكمومي المستمد من خصائص ميكانيكا الكم، فيمكن أن يكون مزيجاً من 0 و1 في الوقت نفسه. أما البت الكلاسيكي فيحمل حالة واحدة فقط في كل وقت: إما 0 أو 1."},{"q":"كيف غير انتشار الحوسبة السحابية من العقد الثاني من الألفية فصاعداً طريقة تقديم موارد تكنولوجيا المعلومات؟","m":"منذ العقد الثاني من الألفية انتشرت الحوسبة السحابية، فصارت موارد تكنولوجيا المعلومات تُقدم في صورة خدمات عبر الإنترنت بدلاً من الاعتماد على أجهزة محلية فقط. وأتاح ذلك استخدام قدرات الحوسبة عند الحاجة، ودعم تحليل البيانات الضخمة والذكاء الاصطناعي."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٦","mcq":[{"q":"في أي فترة زمنية بدأت تتاح الإنترنت للاستخدام التجاري وظهر الويب مما توسع معه الوصول العالمي إلى المعلومات؟","o":["الأربعينيات والستينيات.","التسعينيات.","السبعينيات والثمانينيات.","من العقد الثاني من الألفية فصاعداً."],"c":1},{"q":"ما هي التقنية التي تستخدم الذكاء الاصطناعي للمساعدة على قيادة المركبة باستخدام الكاميرات والمستشعرات لإدراك المحيط واتخاذ القرار؟","o":["الحوسبة السحابية.","القيادة الذاتية.","الواقع الافتراضي.","الحوسبة الكمومية."],"c":1},{"q":"ما المصطلح الذي يعبر عن تكنولوجيا المعلومات المقدمة كخدمة عبر الإنترنت لدعم تحليل البيانات الضخمة والذكاء الاصطناعي؟","o":["الحوسبة السحابية.","الحوسبة الطرفية.","البت الكلاسيكي.","التراكب الكمي."],"c":0},{"q":"أي من الآتي يُعد الوصف الصحيح لمفهوم «الواقع الافتراضي (VR)»؟","o":["تقنية تضيف معلومات رقمية فوق صور من العالم الحقيقي.","تقنية تضع المستخدم داخل بيئة افتراضية مولدة حاسوبياً.","تقنية لمعالجة البيانات على الجهاز نفسه فوراً دون السحابة.","نظام لإجراء المدفوعات بالنقود الإلكترونية ورموز QR."],"c":1}],"essay":[{"q":"اشرح المراحل التاريخية لتطور تكنولوجيا المعلومات منذ ظهور الحواسيب الإلكترونية في الأربعينيات وحتى الستينيات مبيناً الغرض الأساسي لاستخدامها في تلك الفترة.","m":"مر تطور تكنولوجيا المعلومات بمراحل: (1) الأربعينيات إلى الستينيات: ظهور الحواسيب الإلكترونية مثل ENIAC بالصمامات المفرغة، وكانت تملأ غرفة كاملة. (2) السبعينيات والثمانينيات: انتشار الحواسب الشخصية. (3) التسعينيات: إتاحة الإنترنت للاستخدام التجاري وظهور الويب. (4) العقد الأول من الألفية: ظهور الهواتف الذكية. (5) من العقد الثاني: انتشار الحوسبة السحابية. وكان الغرض الأساسي في أول مرحلة عسكرياً وللحسابات العلمية."},{"q":"اشرح «قانون مور» موضحاً ما يصفه، والتحديات الهندسية والفيزيائية التي تواجه استمرار تصغير مكونات الدوائر.","m":"قانون مور ملاحظة تجريبية تصف اتجاهاً تاريخياً لازدياد عدد الترانزستورات في الدوائر المتكاملة بمعدل يقارب الضعف كل عامين، وليس قانوناً فيزيائياً ثابتاً. ويواجه استمرار تصغير مكونات الدوائر تحديات هندسية وفيزيائية، منها ازدياد تيارات التسرب والتأثيرات الكمومية مثل النفق الكمومي. لذلك يعتمد تحسين الأداء أيضاً على تعدد الأنوية والمعالجة المتوازية والتصميمات المتخصصة."},{"q":"عدد التحولات المجتمعية الخمسة الناتجة عن تكنولوجيا المعلومات. موضحاً مفهوم كل من «العمل عن بعد» و«التجارة الإلكترونية».","m":"التحولات المجتمعية الخمسة: (1) شبكات التواصل الاجتماعي (SNS). (2) التجارة الإلكترونية. (3) العمل عن بعد. (4) التعلم عبر الإنترنت. (5) الدفع غير النقدي. العمل عن بعد: نمط عمل يؤدي فيه الشخص مهامه من المنزل أو من موقع آخر بعيد باستخدام الإنترنت. التجارة الإلكترونية: بيع السلع والخدمات وشراؤها عبر الإنترنت، مثل أمازون وإيباي."},{"q":"وضح خصائص واستخدامات التقنيات الناشئة الثلاث البارزة المذكورة في الدرس (القيادة الذاتية، الواقع المعزز/الافتراضي، والحوسبة الكمومية).","h":1}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٧","mcq":[{"q":"الفترة الزمنية التي شهدت ظهور الهواتف الذكية وانتشار الإنترنت عبر الهواتف المحمولة بسرعة هي:","o":["السبعينيات والستينيات.","العقد الأول من الألفية.","التسعينيات.","الأربعينيات من القرن العشرين."],"c":1},{"q":"تقنية تضيف عناصر أو معلومات رقمية إلى مشهد من العالم الحقيقي تُعرف باسم:","o":["الواقع الافتراضي (VR).","القيادة الذاتية.","الواقع المعزز (AR).","الحوسبة الكمومية."],"c":2},{"q":"أي الملاحظات الآتية تصف بدقة ما يفعله «قانون مور»؟","o":["تضاعف عدد الترانزستورات في الدائرة المتكاملة تقريباً كل عامين.","ثبات عدد الترانزستورات وعدم تغيرها عبر الزمن نهائياً.","زيادة استهلاك الطاقة في الحواسيب التقليدية بمقدار الضعف سنوياً.","انخفاض قدرات الحوسبة ومعالجة البيانات مع مرور السنوات."],"c":0},{"q":"نمط تعليمي وتدريبي تُقدم فيه الدروس والمواد التعليمية حصرياً أو جزئياً عبر شبكة الإنترنت هو:","o":["التجارة الإلكترونية.","العمل عن بعد.","التعلم عبر الإنترنت (Online Learning).","الدفع غير النقدي."],"c":2}],"essay":[{"q":"اشرح كيف أثر ظهور الحواسيب الشخصية (PCs) وانتشار الوصول العالمي إلى المعلومات والبريد الإلكتروني على المجتمع في فترة السبعينيات والثمانينيات.","m":"في السبعينيات والثمانينيات انتشرت الحواسب الشخصية (PCs)، فبدأ الأفراد باستخدام الحاسب بعد أن كان استخدامه محصوراً في الأغراض العسكرية والعلمية. ومع التسعينيات ومع انتشار الوصول العالمي إلى المعلومات والبريد الإلكتروني صار التواصل أسرع والحصول على المعلومات أسهل على نطاق عالمي."},{"q":"اشرح كيف يؤدي استمرار تصغير مكونات الدوائر في قانون مور إلى ظهور تحديات هندسية وفيزيائية مثل تيارات التسرب والتأثيرات الكمومية والنفق الكمومي.","m":"ينص قانون مور على تضاعف الترانزستورات تقريباً كل عامين بتصغير مكونات الدوائر. وكلما صغرت المكونات أكثر ظهرت تحديات هندسية وفيزيائية، منها ازدياد تيارات التسرب، وظهور تأثيرات كمومية مثل النفق الكمومي. وهذا يصعّب مواصلة الاتجاه نفسه، لذلك يعتمد تحسين الأداء أيضاً على تعدد الأنوية والمعالجة المتوازية والتصميمات المتخصصة."},{"q":"وضح باختصار مفهوم كل من «شبكات التواصل الاجتماعي (SNS)» و«التعلم عبر الإنترنت» و«الدفع غير النقدي» باعتبارها تحولات مجتمعية.","m":"(1) شبكات التواصل الاجتماعي (SNS): منصات تتيح للمستخدمين التواصل ونشر المحتوى ومشاركته بسرعة. (2) التعلم عبر الإنترنت: نمط تعليمي تُقدم فيه الدروس والمواد التعليمية عبر الإنترنت. (3) الدفع غير النقدي: دفع قيمة السلع أو الخدمات بوسائل غير نقدية، مثل البطاقات المصرفية أو تطبيقات الهاتف أو رموز QR. وكلها تحولات مجتمعية أحدثتها تكنولوجيا المعلومات."},{"q":"وضح كيف تعالج الحوسبة الطرفية البيانات محلياً على متن المركبة ذاتية القيادة فوراً لتقليل زمن الاستجابة وضمان السلامة.","m":"تستخدم المركبة ذاتية القيادة كاميرات ومستشعرات لإدراك محيطها. وتعالج الحوسبة الطرفية هذه البيانات على متن المركبة نفسها فوراً بدلاً من إرسالها إلى السحابة، فلا ينتظر القرار اتصالاً بالسحابة. وبذلك يقل التأخير وزمن الاستجابة، ويتخذ النظام قرارات القيادة بسرعة، فتُصان السلامة لأن التأخير في المعالجة قد يؤثر فيها."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٨","mcq":[{"q":"بدأت الحواسيب الإلكترونية في الظهور واستخدمت أساساً للأغراض العسكرية والحسابات العلمية مثل حاسوب ENIAC باستخدام الصمامات (المفرغة) في فترة:","o":["الأربعينيات.","السبعينيات.","التسعينيات.","العقد الأول من الألفية."],"c":0},{"q":"مبدأ أو نهج حوسبي يستخدم خصائص ميكانيكا الكم لمعالجة المعلومات وقد يوفر تفوقاً في فئات محددة من المسائل هو:","o":["الحوسبة الطرفية.","الحوسبة الكمومية.","الدفع غير النقدي.","شبكات التواصل الاجتماعي."],"c":1},{"q":"منصات تتيح للمستخدمين التواصل ونشر المحتوى ومشاركته بسرعة وتُعد فعالة جداً في نشر المعلومات هي:","o":["شبكات التواصل الاجتماعي (SNS).","التجارة الإلكترونية.","العمل عن بعد.","الحوسبة السحابية."],"c":0},{"q":"أسلوب عمل يؤدي فيه الشخص مهامه ووظائفه من المنزل أو من موقع آخر بعيد باستخدام تقنيات الاتصال والإنترنت يسمى:","o":["التعلم عبر الإنترنت.","العمل عن بعد (Remote Work).","القيادة الذاتية.","الحوسبة الطرفية."],"c":1}],"essay":[{"q":"ناقش أثر ظهور الويب وانتشار الإنترنت في تسعينيات القرن العشرين على إتاحة المعلومات للاستخدام التجاري والعالمي.","m":"في التسعينيات أُتيح الإنترنت للاستخدام التجاري وظهر الويب، فانتشر الوصول العالمي إلى المعلومات والبريد الإلكتروني. فصارت المعلومات متاحة لعدد كبير من المستخدمين حول العالم بسرعة، وأصبح الإنترنت وسيلة للاستخدام التجاري، وهو ما مهّد لتحولات مثل التجارة الإلكترونية."},{"q":"وضح كيف تعد القيادة الذاتية من ضمن التقنيات الناشئة البارزة.","m":"القيادة الذاتية تقنية ناشئة بارزة تستخدم الذكاء الاصطناعي للمساعدة على قيادة المركبة. تدرك المركبة محيطها بالكاميرات والمستشعرات، ثم يعالج النظام البيانات لاتخاذ قرارات القيادة والتحكم فيها. ولأن التأخير قد يؤثر في السلامة، تُعالج بعض البيانات محلياً بالحوسبة الطرفية لتقليل زمن الاستجابة."},{"q":"وضح مفهوم كل من التجارة الإلكترونية والدفع غير النقدي.","m":"التجارة الإلكترونية: بيع السلع والخدمات وشراؤها عبر الإنترنت، مثل المتاجر الإلكترونية أمازون وإيباي. الدفع غير النقدي: دفع قيمة السلع أو الخدمات بوسائل غير نقدية، مثل البطاقات المصرفية أو تطبيقات الهاتف أو رموز QR، دون استخدام النقود الورقية."},{"q":"وضح الفروق الجوهرية بين «البت الكلاسيكي» و«الكيوبت (qubit)» مستخدماً مفهوم «التراكب الكمي» في الحوسبة الكمومية؟","m":"(1) الحالة: البت الكلاسيكي يحمل حالة واحدة محددة في كل وقت، إما 0 أو 1، أما الكيوبت (qubit) فيستخدم مبدأ التراكب الكمومي فيكون مزيجاً من 0 و1 في الوقت نفسه. (2) الأساس: البت أساس الحوسبة التقليدية، والكيوبت أساس الحوسبة الكمومية، وهي نهج حوسبي يستخدم خصائص ميكانيكا الكم لمعالجة المعلومات. (3) الأثر: قد توفر الحوسبة الكمومية تفوقاً في فئات محددة من المسائل، لكنها لا تسرّع جميع أنواع الحسابات وليست بديلاً عاماً للحواسيب التقليدية."}]}],"1-2":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص١٠","mcq":[{"q":"أي من الخيارات التالية يمثل المجال الواسع الذي يضم أنظمة حاسوبية تستطيع تنفيذ مهام مثل التعلم والتنبؤ والتعرف على الكلام والصور؟","o":["التعلم العميق","الذكاء الاصطناعي","التعلم الآلي","الذكاء الاصطناعي التوليدي"],"c":1},{"q":"ماذا يُعد «التعلم الآلي (Machine Learning)» من منظور تسلسل تقنيات الذكاء الاصطناعي؟","o":["فرع من الذكاء الاصطناعي تتعلم فيه النماذج أنماطاً من البيانات.","أسلوب يعتمد حصرياً على شبكات عصبية غير متصلة.","نظام لتوليد الصور ومقاطع الفيديو حصرياً دون بيانات تدريب.","مجموعة من القواعد المبرمجة يدوياً بشكل صارم وثابت."],"c":0}],"essay":[{"q":"عرّف مفهوم الذكاء الاصطناعي، موضحاً في ثلاث نقاط الفرق بين التعلم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي.","h":1},{"q":"اشرح كيف تتعلم النماذج في فرع «التعلم الآلي» مقارنة بالطرق التقليدية المعتمدة على البرمجة الصريحة للقواعد.","m":"في الطرق التقليدية يكتب المبرمج كل قاعدة صراحةً، فينفذ الحاسوب القواعد كما كُتبت. أما في التعلم الآلي فتتعلم النماذج أنماطاً من البيانات (أمثلة التدريب) لإجراء تنبؤات أو تصنيفات أو دعم قرارات، دون برمجة كل قاعدة صراحةً، مثل تصنيف الرسائل المزعجة وتوصية المنتجات."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص١١","mcq":[{"q":"ما هو المصطلح الذي يصف أسلوباً من أساليب التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات لتعلم تمثيلات وأنماط معقدة؟","o":["التعلم الآلي","الذكاء الاصطناعي التوليدي","التعلم العميق","مرشح الرسائل المزعجة."],"c":2},{"q":"ما هي الوظيفة الأساسية لأنظمة «الذكاء الاصطناعي التوليدي»؟","o":["برمجة القواعد الصريحة للحواسيب القديمة.","إنشاء محتوى جديد مثل النصوص والصور والصوت والبرمجيات.","تصنيف رسائل البريد المزعجة فقط دون توليد محتوى.","تشغيل الدوائر المتكاملة وفق قانون مور."],"c":1}],"essay":[{"q":"ما المكونات الأساسية للشبكة العصبية الاصطناعية؟","m":"الشبكة العصبية الاصطناعية (ANN) نموذج حاسوبي مستوحى بصورة مبسطة من فكرة ترابط العصبونات في الدماغ. ومكوناتها الأساسية: (1) وحدات بسيطة تسمى العصبونات. (2) ترابط هذه الوحدات في طبقات متصلة ببعضها. (3) أوزان على الروابط تتغير أثناء التدريب لتتعلم الشبكة أنماطاً من البيانات. وعند تعدد الطبقات تُستخدم في التعلم العميق لتعلم تمثيلات وأنماط معقدة."},{"q":"اشرح مفهوم «الذكاء الاصطناعي التوليدي (GenAI)» موضحاً ذلك بأمثلة.","m":"الذكاء الاصطناعي التوليدي (GenAI) أنظمة تنشئ محتوى جديداً، مثل النصوص والصور والصوت والبرمجيات، اعتماداً على الأنماط التي تعلمتها من بيانات التدريب، وتعتمد غالبية أنظمته الحديثة على نماذج التعلم العميق. أمثلة: ChatGPT لتوليد النصوص، وأدوات توليد الصور، وأدوات توليد الصوت."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص١٢","mcq":[{"q":"أي من التقنيات التالية تعتمد عليها غالبية أنظمة الذكاء الاصطناعي التوليدي الحديثة لإنشاء محتوى جديد؟","o":["القواعد المبرمجة صراحةً.","نماذج التعلم العميق والشبكات العصبية.","الحوسبة الطرفية وقانون مور.","البتات الكلاسيكية الثابتة."],"c":1},{"q":"ماذا يُقصد بمصطلح «الهلوسة» عندما ينتج الذكاء الاصطناعي التوليدي نصاً؟","o":["إنتاج نص يبدو معقولاً ومنطقياً لكنه غير صحيح واقعياً.","التوقف التام عن الاستجابة بسبب انقطاع الإنترنت.","توليد صور دقيقة بنسبة مئة بالمئة ومطابقة للواقع تماماً.","تصنيف رسائل البريد المزعجة بدقة فائقة."],"c":0}],"essay":[{"q":"اشرح العلاقة بين الذكاء الاصطناعي والتعلم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي.","m":"الذكاء الاصطناعي هو المجال الواسع. والتعلم الآلي فرع منه تتعلم فيه النماذج أنماطاً من البيانات. والتعلم العميق أسلوب ضمن التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات. وتعتمد غالبية أنظمة الذكاء الاصطناعي التوليدي الحديثة على التعلم العميق لإنشاء محتوى جديد. وهي علاقة تعليمية مبسطة وليست تسلسل احتواء صارماً في كل حالة."},{"q":"وضح المقصود بمصطلح «الهلوسة» في سياق الذكاء الاصطناعي التوليدي.","m":"الهلوسة في الذكاء الاصطناعي التوليدي هي توليد النموذج معلومات غير صحيحة أو غير مدعومة تبدو معقولة ومقنعة، فيبدو النص سليماً منطقياً وهو غير صحيح واقعياً. لذلك لا يُعتمد على مخرجاته كما هي، بل يجب التحقق منها ومن مصادرها."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص١٢-١٣","mcq":[{"q":"أي من الخيارات الآتية لا يُعد مثالاً مناسباً على تطبيقات «الذكاء الاصطناعي التوليدي»؟","o":["نموذج ChatGPT لتوليد النصوص.","أدوات توليد الصور باستخدام الذكاء الاصطناعي.","مرشح الرسائل المزعجة (Spam Filter).","أدوات توليد الصوت والمقاطع الصوتية."],"c":2},{"q":"ما هي المكونات الأساسية التي تتكون منها الشبكة العصبية الاصطناعية لتعلم الأنماط المعقدة من البيانات؟","o":["طبقات متصلة تضم وحدات عصبونية تتغير أوزانها أثناء التدريب.","مجموعة من الصمامات المفرغة والدوائر الكهربائية البسيطة.","قواعد برمجية ثابتة ومكتوبة بخوارزميات خطية بحتة.","مفاتيح يدوية لتنظيم تدفق التيار الكهربائي في المعالج."],"c":0}],"essay":[{"q":"افترض أن مزارعاً يريد استخدام نظام ذكاء اصطناعي للتمييز بين صور المحاصيل السليمة والمصابة بالأمراض. اشرح نوع البيانات التي يحتاجها النظام للتدريب، وحدد عاملاً قد يجعل تنبؤه خاطئاً.","h":1},{"q":"تحدث عن فائدة واحدة ومخاطرة واحدة لاستخدام الذكاء الاصطناعي التوليدي في كتابة تقرير مدرسي، وماذا ينبغي على المتعلمين فعله للتحقق من المخرجات؟","m":"الفائدة: السرعة، إذ يساعد الذكاء الاصطناعي التوليدي على إنتاج مسودة أو أفكار أولية للتقرير في وقت قصير. المخاطرة: الهلوسة، أي توليد معلومات غير صحيحة أو غير مدعومة تبدو معقولة ومقنعة، فقد يتضمن التقرير أخطاء دون أن يلاحظ الطالب. وينبغي على المتعلمين ألا يستخدموا الناتج كما هو، بل يتحققوا منه ومن مصادره بمقارنته بمصادر موثوقة كالكتاب المدرسي، ويصححوا الأخطاء ويحذفوا ما لا يدعمه مصدر، ثم يصوغوا التقرير بأسلوبهم."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص١٣-١٤","mcq":[{"q":"أي مما يلي يمثل فرعاً من الذكاء الاصطناعي تتعلم فيه النماذج أنماطاً من البيانات لإجراء تنبؤات أو تصنيفات دون برمجة كل قاعدة صراحةً؟","o":["التعلم العميق","الذكاء الاصطناعي التوليدي","التعلم الآلي","الحوسبة السحابية."],"c":2},{"q":"أسلوب من أساليب التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات لتعلم تمثيلات وأنماط معقدة مثل تحليل الصور والتعرف على الكلام هو:","o":["التعلم العميق","الذكاء الاصطناعي","الذكاء الاصطناعي التوليدي","البرمجة التقليدية."],"c":0},{"q":"نظام حاسوبي مستوحى بصورة مبسطة من فكرة ترابط العصبونات وتتغير أوزانه أثناء التدريب هو:","o":["الكيوبت الكمومي.","الشبكة العصبية الاصطناعية.","البت الكلاسيكي.","قانون مور."],"c":1},{"q":"عندما يُنتج الذكاء الاصطناعي التوليدي نصاً يبدو معقولاً ولكن غير صحيح واقعياً، تُسمى هذه الظاهرة بـ:","o":["الهلوسة.","التراكب الكمي.","الحوسبة الطرفية.","التشغيل الخطي."],"c":0}],"essay":[{"q":"عرّف الذكاء الاصطناعي ووضح كيف تختلف الأنظمة الذكية اليوم عن الحواسيب التقليدية المبرمجة بقواعد ثابتة.","m":"الذكاء الاصطناعي (AI) مجال يضم أنظمة حاسوبية تستطيع تنفيذ مهام مثل التعلم من البيانات والتنبؤ والتعرف وتوليد المحتوى واتخاذ القرارات أو دعمها. وتختلف الأنظمة الذكية اليوم بأنها تتعلم أنماطاً من البيانات لتتنبأ وتصنف، أما الحواسيب التقليدية فتنفذ قواعد ثابتة برمجها المبرمج صراحةً."},{"q":"اشرح بالتفصيل العلاقة المتداخلة بين الذكاء الاصطناعي والتعلم الآلي والتعلم العميق مدعماً إجابتك بالمفاهيم الأساسية لكل منها.","m":"الذكاء الاصطناعي مجال واسع يضم أنظمة تتعلم وتتنبأ وتتعرف على الكلام والصور. التعلم الآلي فرع منه تتعلم فيه النماذج أنماطاً من البيانات لإجراء تنبؤات أو تصنيفات دون برمجة كل قاعدة، مثل تصنيف الرسائل المزعجة. والتعلم العميق أسلوب ضمن التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات لتعلم أنماط معقدة، مثل تحليل الصور والتعرف على الكلام. فهي مفاهيم متداخلة، كل منها أكثر تخصصاً من سابقه."},{"q":"ما هو «الذكاء الاصطناعي التوليدي»، وكيف يعتمد على نماذج التعلم العميق لإنشاء محتوى جديد كالنصوص والصور؟","m":"الذكاء الاصطناعي التوليدي أنظمة تنشئ محتوى جديداً، مثل النصوص والصور والصوت والبرمجيات، اعتماداً على الأنماط التي تعلمتها من بيانات التدريب. وتعتمد غالبية أنظمته الحديثة على نماذج التعلم العميق، أي شبكات عصبية متعددة الطبقات تتعلم تمثيلات وأنماطاً معقدة من بيانات كبيرة، ثم تستخدمها لتوليد نصوص أو صور جديدة، مثل ChatGPT وأدوات توليد الصور."},{"q":"ناقش مشكلة «الهلوسة» في الذكاء الاصطناعي التوليدي، موضحاً سبب خطورتها والإجراء المناسب للتحقق من المخرجات.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص١٤-١٥","mcq":[{"q":"أي من الخيارات التالية يُعد مثالاً مباشراً على تطبيقات «التعلم الآلي»؟","o":["مرشحات الرسائل المزعجة وتوصيات المنتجات.","توليد الصور ومقاطع الفيديو الفنية المعقدة.","معالجة البيانات على الأجهزة الطرفية للسيارات.","تشغيل الدوائر المتكاملة وفق قانون مور."],"c":0},{"q":"ما هو الوصف الدقيق لـ «الذكاء الاصطناعي التوليدي (GenAI)»؟","o":["نظام يقتصر على تصنيف البريد المزعج وإزالة الفيروسات.","ذكاء اصطناعي يستخدم التعلم العميق لتوليد بيانات جديدة مثل النصوص والصور.","تقنية حوسبية تستخدم ميكانيكا الكم والمعالجة المتوازية.","شبكة عصبية بسيطة ذات طبقة إدخال وإخراج واحدة فقط."],"c":1},{"q":"ماذا تسمى الطبقات الواقعة بين طبقة الإدخال وطبقة الإخراج في الشبكة العصبية الاصطناعية؟","o":["الطبقات المخفية.","الطبقات الطرفية.","الطبقات السحابية.","الطبقات الخطية."],"c":0},{"q":"ما الذي يجب على المتعلمين فعله لتجنب مخاطر «الهلوسة» عند استخدام الذكاء الاصطناعي التوليدي في إعداد تقاريرهم المدرسية؟","o":["الاعتماد المطلق على المخرجات دون أي مراجعة بشرية.","التحقق من المخرجات ومصادرها ومقارنتها بالحقائق الموثوقة.","تجنب استخدام الهواتف والحواسيب بشكل كامل ودائم.","نسخ النصوص حرفياً وتسليمها للمدرس مباشرة."],"c":1}],"essay":[{"q":"اشرح كيف تساعد أمثلة الحياة اليومية مثل تصنيف الرسائل المزعجة وتوصيات المنتجات والترجمة في فهم تطبيقات الذكاء الاصطناعي.","m":"هذه الأمثلة تقرّب الذكاء الاصطناعي من حياتنا اليومية، فهي تعمل غالباً في الخلفية: تصنيف الرسائل المزعجة وتوصية المنتجات يتعلمان أنماطاً من البيانات (تعلم آلي)، والترجمة تطبيق للذكاء الاصطناعي. وتبيّن أن النظام لا يتبع قواعد ثابتة فقط، بل يتعلم من الأمثلة ليصنف ويتنبأ، فنفهم كيف يعمل الذكاء الاصطناعي."},{"q":"قارن بوضوح بين «التعلم الآلي» و«التعلم العميق» من حيث الاعتماد على الشبكات العصبية وحجم البيانات المطلوبة للتدريب.","m":"التعلم الآلي فرع من الذكاء الاصطناعي تتعلم فيه النماذج أنماطاً من البيانات بأساليب متنوعة، وليس بالضرورة بشبكات عصبية. أما التعلم العميق فهو أسلوب ضمن التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات لتعلم أنماط معقدة، وكثيراً ما يحتاج إلى بيانات كبيرة نسبياً كي يتعلم أنماطاً موثوقة."},{"q":"اشرح كيف يتمكن الذكاء الاصطناعي التوليدي من إنشاء محتوى جديد ومتنوع مثل النصوص والصور والأصوات اعتماداً على بيانات التدريب.","m":"يُدرَّب نظام الذكاء الاصطناعي التوليدي على بيانات تدريب كبيرة من نصوص وصور وأصوات باستخدام نماذج التعلم العميق، فيتعلم الأنماط الموجودة فيها. ثم ينشئ اعتماداً على هذه الأنماط محتوى جديداً متنوعاً استجابة لطلب المستخدم، كنص أو صورة أو مقطع صوتي، وليس مجرد نسخ لما تدرب عليه."},{"q":"ضع قاعدة مناسبة للتعامل مع الذكاء الاصطناعي التوليدي في الواجبات المدرسية مع ذكر سببين مقنعين لضرورة التحقق من دقة المصادر.","m":"القاعدة المقترحة: يُسمح باستخدام الذكاء الاصطناعي التوليدي في الواجبات للمساعدة فقط، بشرط التحقق من مخرجاته ومصادرها، وعدم تسليمها كما هي مع ذكر استخدامه. السببان: (1) قد يولد معلومات غير صحيحة أو غير مدعومة تبدو مقنعة (الهلوسة)، فيحتاج الطالب إلى التأكد منها. (2) قد تكون النتائج متحيزة إذا كانت بيانات التدريب غير ممثلة أو متحيزة، فيجب مقارنتها بمصادر موثوقة."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص١٥-١٦","mcq":[{"q":"معظم أنظمة الذكاء الاصطناعي الحالية تُصمم لأداء:","o":["مهمة محددة أو مجموعة محدودة من المهام (ضيق النطاق).","محاكاة الوعي البشري الكامل في جميع المجالات دون قيود.","برمجة الأجهزة الكهربائية المنزلية القديمة يدوياً.","إدارة شبكات الاتصال العسكرية العالمية فقط."],"c":0},{"q":"أي من الخيارات الآتية يمثل التقنية الأنسب لمهام تحليل الصور المعقدة والتعرف المتقدم على الكلام؟","o":["التعلم العميق المعتمد على شبكات عصبية متعددة الطبقات.","القواعد المبرمجة يدوياً بأسلوب خطي ثابت.","الحوسبة السحابية التقليدية دون ذكاء اصطناعي.","التجارة الإلكترونية والدفع غير النقدي."],"c":0},{"q":"ما هي الفائدة الأساسية للسرعة التي يوفرها الذكاء الاصطناعي التوليدي للطالب عند إعداد التقارير؟","o":["المساعدة في إنجاز المهام سريعاً مع ضرورة الانتباه لمخاطر عدم الصحة.","ضمان صحة جميع المعلومات بنسبة مئة بالمئة تلقائياً.","الاستغناء التام عن الكتب والمصادر المدرسية الرسمية.","منع حدوث ظاهرة الهلوسة نهائياً."],"c":0},{"q":"ما هو الإجراء السليم الذي ينبغي اتباعه عند استخدام أدوات الذكاء الاصطناعي التوليدي في الواجبات والمشاريع؟","o":["التحقق الدائم من صحة المعلومات ومراجعة المصادر والمراجع الأصلية.","اعتبار كل ما تنتجه الشاشات حقائق علمية مطلقة لا تقبل التشكيك.","عدم كتابة أي أبحاث مدرسية والاعتماد على الذكاء الاصطناعي كلياً.","إرسال مخرجات الذكاء الاصطناعي دون قراءتها أو تفحصها."],"c":0}],"essay":[{"q":"لماذا تُعد معظم أنظمة الذكاء الاصطناعي الحالية «ضيقة النطاق» (Narrow AI)؟","m":"لأن معظم الأنظمة الحالية صُمّمت ودُرّبت لأداء مهمة محددة أو مجموعة محدودة من المهام، مثل تصنيف الرسائل المزعجة أو التعرف على الصور أو التوصية بالمنتجات، وتتعلم أنماطها من بيانات تخص تلك المهمة فقط. لذلك لا تمتلك فهماً أو قدرات عامة تشمل جميع المجالات كما يفعل الإنسان، ولهذا تسمى ذكاءً اصطناعياً ضيق النطاق (Narrow AI)."},{"q":"عرّف الشبكة العصبية الاصطناعية.","m":"الشبكة العصبية الاصطناعية (ANN) نموذج حاسوبي مستوحى بصورة مبسطة من فكرة ترابط العصبونات. تتكون من وحدات بسيطة مترابطة تتغير أوزانها أثناء التدريب لتتعلم أنماطاً من البيانات، وتُستخدم للتعلم من البيانات وإصدار أحكام معقدة."},{"q":"ارسم شكلاً مبسطاً توضح فيه العلاقة بين الذكاء الاصطناعي والتعلم العميق والتعلم الآلي والذكاء الاصطناعي التوليدي.","h":1}]}],"1-3":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص١٧","mcq":[{"q":"أي من الخيارات التالية يُعد مثالاً على نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات؟","o":["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],"c":0},{"q":"ما هي الخدمة التي تقوم بترجمة النص تلقائياً إلى لغات مختلفة كما ورد في خدمات الذكاء الاصطناعي اليومية؟","o":["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],"c":2}],"essay":[{"q":"اشرح كيف أصبحت تقنيات مثل منصات الفيديو والمساعدات الصوتية جزءاً من الخدمات اليومية، وما هو الدور الأساسي للذكاء الاصطناعي فيها؟","m":"أصبحت منصات الفيديو تقترح عليك مقاطع تناسب اهتماماتك، وصارت المساعدات الصوتية تجيب عن أسئلتك وتنفذ أوامرك الصوتية، فدخلت هذه التقنيات في خدماتنا اليومية. ودور الذكاء الاصطناعي الأساسي هو التنبؤ بالتفضيلات من بيانات السلوك السابق وعرض التوصيات المناسبة، والتعرف على الصوت وفهم الأوامر وتنفيذها."},{"q":"وضّح المقصود بـ «الذكاء الاصطناعي للتشخيص بالصور» في مجال الرعاية الصحية، وكيف يسهم في الكشف عن الأمراض؟","m":"هو استخدام الذكاء الاصطناعي لتحليل الصور الطبية مثل الأشعة السينية والتصوير المقطعي. يكتشف النظام الأنماط في الصور وقد يلاحظ ما يفوت البشر ملاحظته، فيساعد في الكشف عن الأمراض مبكراً ودعم التشخيص، ويبقى الطبيب البشري هو من يؤكد التشخيص النهائي."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص١٧","mcq":[{"q":"ما هو المصطلح الذي يشير إلى نظام الذكاء الاصطناعي الذي يتعرف على الصوت، ويفهم الأوامر، وينفذها مثل (Siri) ومساعد جوجل؟","o":["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],"c":1},{"q":"أي من القطاعات الصناعية التالية ترتبط بمهمة «تحسين مسارات التوصيل»؟","o":["الرعاية الصحية","الزراعة","التصنيع","الخدمات اللوجستية"],"c":3}],"essay":[{"q":"اذكر أربع خدمات أساسية للذكاء الاصطناعي في الحياة اليومية مع بيان دور الذكاء الاصطناعي في كل خدمة؟","m":"(1) أنظمة التوصية: يتنبأ الذكاء الاصطناعي بتفضيلات المستخدم من سلوكه السابق ويعرض له توصيات مناسبة، كما في يوتيوب وأمازون. (2) المساعد الصوتي: يتعرف على الصوت ويفهم الأوامر وينفذها، مثل Siri ومساعد جوجل. (3) الترجمة الآلية: تترجم النص تلقائياً إلى لغات مختلفة. (4) التعرف على الوجه: يكشف عن الوجوه ويتعرف عليها تلقائياً، كما في فتح الهاتف الذكي."},{"q":"ما هو الدور الذي يلعبه الذكاء الاصطناعي في قطاع التصنيع؟ اذكر مثالين توضيحيين.","m":"يسهم الذكاء الاصطناعي في التصنيع بأتمتة فحص الجودة والتنبؤ بالأعطال، فيرفع جودة المنتجات ويقلل توقف الإنتاج. مثالان: (1) أتمتة فحص جودة المنتج، إذ يكتشف النظام العيوب تلقائياً أثناء الإنتاج. (2) الصيانة التنبؤية، إذ يتنبأ النظام بأعطال الآلات قبل وقوعها فتُجرى الصيانة في الوقت المناسب."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص١٨","mcq":[{"q":"ما هي الصناعة التي تستخدم الذكاء الاصطناعي للكشف عن الأمراض من صور الأشعة السينية والتصوير المقطعي؟","o":["الرعاية الصحية","الزراعة","التصنيع","الخدمات اللوجستية"],"c":0},{"q":"أي من الخيارات الآتية يمثل المهمة الرئيسية للذكاء الاصطناعي في قطاع الزراعة؟","o":["تحسين مسارات التوصيل","التنبؤ بموعد الحصاد والكشف عن الآفات والأمراض","فحص جودة المنتج والصيانة التنبؤية","تحليل الصور الطبية واكتشاف الأدوية"],"c":1}],"essay":[{"q":"وضّح كيف يتم استخدام الذكاء الاصطناعي في قطاع الزراعة ودوره في مراقبة المحاصيل والآفات.","m":"يُستخدم الذكاء الاصطناعي في الزراعة لتحليل بيانات وصور المحاصيل ومراقبتها باستمرار. فيتنبأ بموعد الحصاد المناسب، ويكشف الآفات والأمراض مبكراً لمعالجتها قبل انتشارها، مما يحسّن الإنتاجية ويقلل الخسائر."},{"q":"اذكر أربع مهام يمكن أن يؤديها الذكاء الاصطناعي في معالجة البيانات المعقدة والتعرف على الصور والأصوات.","m":"(1) إيجاد الأنماط وتصنيفها في البيانات المعقدة. (2) التعرف على الصور وتحليلها. (3) التعرف على الأصوات والنصوص. (4) الاستدلال الاحتمالي والتنبؤ استناداً إلى البيانات، إضافة إلى توليد بعض أنواع المحتوى."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص١٩","mcq":[{"q":"ما هو المصطلح الذي يصف توليد معلومات غير صحيحة أو غير مدعومة تبدو مقنعة من قبل الذكاء الاصطناعي؟","o":["مشكلة الصندوق الأسود","الهلوسة","التمييز أو التحيز","بيانات التدريب غير الكافية"],"c":1},{"q":"ماذا يُقصد بمشكلة «الصندوق الأسود» في سياق تطبيقات الذكاء الاصطناعي؟","o":["توليد معلومات غير صحيحة تبدو مقنعة للمستخدم.","عدم الوضوح حول كيفية توصل الذكاء الاصطناعي إلى حكمه أو قراره.","استخدام أعمال محمية بحقوق المؤلف كبيانات تدريب.","نقص بيانات التدريب أو عدم تمثيلها للواقع بدقة."],"c":1}],"essay":[{"q":"اشرح مقولة «الذكاء الاصطناعي بارع في إيجاد الأنماط في البيانات، لكن الحكم البشري لا يزال ضرورياً».","m":"يتفوق الذكاء الاصطناعي في إيجاد الأنماط في البيانات الكبيرة وتصنيفها، لكنه قد يخطئ أو يتحيز أو يهلوس إذا كانت بياناته غير كافية أو متحيزة. ولذلك يبقى الحكم البشري ضرورياً في القرارات ذات البعد الأخلاقي، وحماية الخصوصية، وتحديد المسؤولية عن النتائج، والتحقق من صحة المخرجات."},{"q":"اذكر ثلاثة احتياطات للاستخدام المتعلقة بالذكاء الاصطناعي.","m":"(1) الحذر في القرارات ذات البعد الأخلاقي لأنها قد تؤدي إلى تمييز أو تحيز. (2) الحذر عند التعامل مع المعلومات الشخصية والبيانات الحساسة لحماية الخصوصية. (3) عدم ترك القرارات عالية الأثر للنظام وحده، وتحديد المسؤولية عن نتائجها، والتحقق من المخرجات لتجنب الهلوسة."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص١٩","mcq":[{"q":"أي من الخدمات التالية تُستخدم لفتح الهاتف الذكي والكشف عن وجوه الأشخاص في الصور والتعرف عليها تلقائياً؟","o":["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],"c":3},{"q":"ما هي التقنية المستخدمة في فحص جودة المنتج والتنبؤ بأعطال الآلات قبل وقوعها؟","o":["الذكاء الاصطناعي للتشخيص بالصور.","الذكاء الاصطناعي في التصنيع والصيانة التنبؤية.","نظم التوصية والمساعد الصوتي.","الترجمة الآلية وشبكات التواصل."],"c":1},{"q":"من ضمن احتياطات الاستخدام للذكاء الاصطناعي، ماذا تعني ظاهرة «الهلوسة»؟","o":["عدم معرفة كيف توصل النظام لقراره.","توليد معلومات غير صحيحة أو غير مدعومة تبدو مقنعة.","وجود تحيز في بيانات التدريب.","انتهاك حقوق المؤلف للبيانات."],"c":1},{"q":"أي من الآتي يُعد الوصف الصحيح لما يبرع فيه الذكاء الاصطناعي؟","o":["إيجاد وتصنيف الأنماط في البيانات المعقدة والاستدلال الاحتمالي.","اتخاذ الأحكام الأخلاقية المطلقة بدون بشر.","ضمان خلو المخرجات تماماً من أي تحيز مستقبلي.","حفظ البيانات الشخصية وحمايتها بسرية تامة."],"c":0}],"essay":[{"q":"اشرح كيفية استخدام أنظمة التوصية في الحياة اليومية مع ذكر أمثلة تطبيقية مثل يوتيوب وأمازون؟","m":"تستخدم أنظمة التوصية بيانات السلوك السابق للمستخدم، كالمشاهدات والمشتريات، لتتنبأ بتفضيلاته ثم تعرض عليه توصيات مناسبة. من أمثلتها مقاطع الفيديو المقترحة في يوتيوب، والمنتجات المقترحة في أمازون، مما يوفر وقت البحث ويجعل التجربة مناسبة لكل مستخدم."},{"q":"اذكر استخدامات الذكاء الاصطناعي في الرعاية الصحية؟","m":"(1) الذكاء الاصطناعي للتشخيص بالصور: تحليل صور الأشعة السينية والتصوير المقطعي للكشف عن الأمراض وإيجاد الأنماط التي قد تفوت البشر. (2) دعم اكتشاف الأدوية وتحليل البيانات الطبية. ومع ذلك يؤكد الطبيب البشري التشخيص النهائي."},{"q":"اذكر أربعة قطاعات صناعية رئيسية يتم فيها إدخال تقنيات الذكاء الاصطناعي مع بيان دور كل قطاع باختصار؟","m":"(1) الرعاية الصحية: تحليل الصور الطبية كالأشعة السينية والمقطعية للكشف عن الأمراض، ودعم اكتشاف الأدوية. (2) الزراعة: التنبؤ بموعد الحصاد، والكشف عن الآفات والأمراض مبكراً. (3) التصنيع: أتمتة فحص جودة المنتج، والصيانة التنبؤية للتنبؤ بأعطال الآلات قبل وقوعها. (4) الخدمات اللوجستية: تحسين مسارات التوصيل لتوفير الوقت والتكلفة."},{"q":"اشرح ما يبرع فيه الذكاء الاصطناعي وما يتطلب الحذر عند استخدامه فيما يتعلق بالقرارات ذات البعد الأخلاقي والخصوصية؟","m":"يبرع الذكاء الاصطناعي في إيجاد الأنماط وتصنيفها في البيانات المعقدة، والتعرف على الصور والأصوات والنصوص، والاستدلال الاحتمالي. ويتطلب الحذر في القرارات ذات البعد الأخلاقي لأنها قد تسبب تمييزاً أو تحيزاً، وفي التعامل مع المعلومات الشخصية والبيانات الحساسة حفاظاً على الخصوصية، ولذلك يلزم الحكم البشري وتحديد المسؤولية."}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٢٠","mcq":[{"q":"خدمة يومية تستخدم لفهم الكلام وتنفيذ الأوامر الصوتية مثل Siri ومساعد جوجل هي:","o":["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],"c":1},{"q":"قطاع صناعي يستخدم الذكاء الاصطناعي لتحسين مسارات التوصيل هو:","o":["الرعاية الصحية","الزراعة","التصنيع","الخدمات اللوجستية"],"c":3},{"q":"ما هو المصطلح الذي يعبر عن عدم وضوح كيفية توصل الذكاء الاصطناعي إلى حكمه أو قراره؟","o":["الهلوسة","مشكلة الصندوق الأسود","التمييز أو التحيز","الاستدلال الاحتمالي"],"c":1},{"q":"من ضمن المهام التي يجيدها الذكاء الاصطناعي:","o":["اتخاذ القرارات الأخلاقية المعقدة.","التعرف على الصور والأصوات والنصوص وتوليد المحتوى.","ضمان دقة النتائج المطلقة دون بيانات تدريب.","حماية الخصوصية الشخصية تلقائياً."],"c":1}],"essay":[{"q":"اذكر دور الذكاء الاصطناعي في المساعدات الصوتية مع ذكر مثالين.","m":"يقوم الذكاء الاصطناعي في المساعدات الصوتية بالتعرف على الصوت وفهم الأوامر المنطوقة ثم تنفيذها، كالإجابة عن الأسئلة وتشغيل المهام المطلوبة. ومن أمثلتها: Siri ومساعد جوجل (Google Assistant)."},{"q":"ناقش دور الذكاء الاصطناعي في قطاعي الزراعة والخدمات اللوجستية في تحسين العمليات والإنتاجية؟","m":"في الزراعة: يتنبأ الذكاء الاصطناعي بموعد الحصاد ويكشف الآفات والأمراض مبكراً، فتُعالج قبل انتشارها وتزداد الإنتاجية. وفي الخدمات اللوجستية: يحسّن مسارات التوصيل، فيقل الوقت والتكلفة وتزيد كفاءة النقل. وفي القطاعين يحلل النظام البيانات للوصول إلى قرارات أفضل في العمليات."},{"q":"وضّح باختصار احتياطات الاستخدام المرتبطة ببيانات التدريب المتحيزة والقرارات عالية الأثر وتحديد المسؤولية؟","m":"(1) بيانات التدريب المتحيزة: إذا كانت غير كافية أو غير ممثلة أو متحيزة قلّت دقة النتائج وقد تنتج أحكاماً غير عادلة، لذا تُراجع البيانات والمخرجات. (2) القرارات عالية الأثر: لا تُترك للنظام وحده بل تحتاج إشرافاً وحكماً بشرياً. (3) تحديد المسؤولية: يجب معرفة من يتحمل نتائج قرارات النظام، فلا يُنسب الحكم إلى الذكاء الاصطناعي وحده."},{"q":"اشرح سبب ضرورة وجود تأكيد من طبيب بشري للتشخيص الطبي بدلاً من الاعتماد على الذكاء الاصطناعي وحده؟","m":"لأن الذكاء الاصطناعي قد يخطئ أو يتحيز، خصوصاً إذا كانت بيانات تدريبه غير كافية أو غير ممثلة، والقرار الطبي عالي الأثر في حياة المريض. لذلك يؤكد الطبيب البشري التشخيص النهائي ويتحمل مسؤوليته، ويكون الذكاء الاصطناعي أداة مساعدة فقط."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٢١","mcq":[{"q":"نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات في منصات مثل يوتيوب وأمازون يسمى:","o":["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],"c":0},{"q":"أي من الصناعات التالية تستخدم الذكاء الاصطناعي للتنبؤ بموعد الحصاد والكشف عن الآفات والأمراض؟","o":["الرعاية الصحية","الزراعة","التصنيع","الخدمات اللوجستية"],"c":1},{"q":"القرارات ذات البعد الأخلاقي التي قد تؤدي إلى تمييز أو تحيز تُعد ضمن:","o":["ما يبرع فيه الذكاء الاصطناعي.","ما يتطلب الحذر عند استخدام الذكاء الاصطناعي.","المهارات الأساسية للتعلم العميق.","دور أنظمة التوصية اليومية."],"c":1},{"q":"يُعرَّف التحيز في أنظمة الذكاء الاصطناعي على أنه:","o":["نمط قد يؤدي إلى نتائج غير عادلة.","الهلوسة.","التراكب الكمي.","الاستدلال الاحتمالي."],"c":0}],"essay":[{"q":"اشرح ثلاث خدمات يمكن أن يؤديها الذكاء الاصطناعي في الحياة اليومية.","m":"(1) نظام التوصية: يتنبأ بتفضيلات المستخدم من سلوكه السابق ويعرض توصيات مناسبة، كما في يوتيوب. (2) المساعد الصوتي: يتعرف على الصوت ويفهم الأوامر وينفذها، مثل Siri. (3) الترجمة الآلية: تترجم النص تلقائياً إلى لغات مختلفة، مثل Google Translate."},{"q":"اذكر مثالين لإسهام الذكاء الاصطناعي في قطاع التصنيع.","m":"(1) أتمتة فحص جودة المنتج: يكشف النظام العيوب تلقائياً أثناء الإنتاج فتتحسن الجودة. (2) الصيانة التنبؤية: يتنبأ النظام بأعطال الآلات قبل وقوعها فتُصان في الوقت المناسب ويقل توقف الإنتاج."},{"q":"وضّح الأبعاد المتعلقة بمشكلة الصندوق الأسود وقضايا الحقوق عند استخدام أعمال محمية بحقوق المؤلف كبيانات تدريب؟","m":"الصندوق الأسود: عدم وضوح كيفية توصل الذكاء الاصطناعي إلى حكمه أو قراره، مما يصعّب تقييمه واكتشاف أخطائه أو تحيزه، ويُعالج باستخدام XAI. قضايا الحقوق: استخدام أعمال محمية بحقوق المؤلف كبيانات تدريب يثير تساؤلات قانونية وأخلاقية حول حقوق أصحاب هذه الأعمال."},{"q":"وضّح الفروق الجوهرية بين ما يبرع فيه الذكاء الاصطناعي من إيجاد الأنماط وبين الجوانب التي تتطلب الحذر الشديد مثل الخصوصية والأخلاق؟","h":1}]}],"1-4":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٢٣","mcq":[{"q":"أي من الخيارات التالية يُعد سبباً غير مناسب أو غير صحيح لنشوء التحيز الخوارزمي؟","o":["بيانات التدريب متحيزة.","انعكاس نزعات تمييزية سابقة في البيانات.","سرعة معالجة الحاسوب بطيئة.","وجود بيانات غير كافية عن سمات معينة."],"c":2},{"q":"ماذا يمثل مصطلح «التحيز الخوارزمي» في أنظمة الذكاء الاصطناعي؟","o":["نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة.","تقنية تتيح للبشر فهم سبب اتخاذ الذكاء الاصطناعي حكماً معيناً.","التعامل المناسب مع البيانات الشخصية وحمايتها.","تحديد الجهات المسؤولة عن النظام وقراراته وآثاره."],"c":0}],"essay":[{"q":"ما المقصود بمصطلح «التحيز الخوارزمي» في أنظمة الذكاء الاصطناعي، وما هي أبرز أشكاله أو أمثلته؟","m":"التحيز الخوارزمي نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وقد ينشأ من البيانات أو تصميم النظام أو طريقة استخدامه أو السياق البشري والاجتماعي. من أمثلته: نظام توظيف يفضّل فئة بصورة غير عادلة، ونظام تعرف على الوجه تقل دقته مع فئات معينة."},{"q":"وضح الأسباب الرئيسية لنشوء التحيز الخوارزمي في أنظمة الذكاء الاصطناعي؟","m":"(1) بيانات التدريب المتحيزة، مثل بيانات غير كافية عن سمات معينة أو تعكس نزعات تمييزية سابقة. (2) طريقة بناء النظام، كاختيار غير مناسب للمتغيرات أو استخدام متغير بديل يمثل بشكل غير مباشر سمة محمية أو تصميم النموذج نفسه. (3) طريقة استخدام النظام والسياق البشري والاجتماعي المحيط به."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٢٣ – ٢٤","mcq":[{"q":"أي من الخيارات الآتية يمثل المفهوم الدقيق لـ «بيانات التدريب»؟","o":["الأمثلة التي يتعلم منها نظام الذكاء الاصطناعي أنماطه قبل استخدامه.","تقنية تتيح للبشر فهم سبب اتخاذ الذكاء الاصطناعي حكماً معيناً.","تحديد الجهات المسؤولة عن النظام وقراراته وآثاره.","عدم التمييز ظلماً ضد أي شخص أو مجموعة."],"c":0},{"q":"ما هي إحدى قضايا الخصوصية المرتبطة بالذكاء الاصطناعي؟","o":["تحسن سرعة حوسبة الذكاء الاصطناعي.","إنشاء الذكاء الاصطناعي لأعمال إبداعية.","التعرف على الأفراد وتتبعهم من خلال تقنية التعرف على الوجه.","زيادة كفاءة المعالجات الدقيقة."],"c":2}],"essay":[{"q":"اشرح كيف أدى تطور تقنية الذكاء الاصطناعي إلى ظهور قضايا جديدة تتعلق بالخصوصية والمراقبة في الأماكن العامة.","m":"أدى تطور الذكاء الاصطناعي إلى قضايا جديدة في الخصوصية. فبتقنية التعرف على الوجه تستطيع الكاميرات في الأماكن العامة التعرف على الأفراد وتتبعهم، وهي المراقبة. كما صارت كميات كبيرة من بيانات السلوك عبر الإنترنت تُجمع وتُحلَّل، وهو الجمع الجماعي للبيانات الشخصية، مما يثير مخاوف على حق الفرد في التحكم في بياناته."},{"q":"ما المقصود بمصطلح «بيانات التدريب» في أنظمة الذكاء الاصطناعي، وكيف يؤثر نقص تمثيلها على المخرجات؟","m":"بيانات التدريب هي الأمثلة التي يتعلم منها نظام الذكاء الاصطناعي أنماطه قبل استخدامه. وكلما قلّ تمثيلها للواقع، بأن كانت غير كافية أو غير ممثلة لبعض الفئات أو متحيزة، زاد احتمال تحيز مخرجات النظام وانخفضت دقة أحكامه، فقد تأتي نتائجه غير عادلة تجاه الفئات الناقصة التمثيل."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٢٤ – ٢٥","mcq":[{"q":"ما هو المصطلح الذي يصف التقنية التي تتيح للبشر فهم العوامل والسبب الذي أدى بالذكاء الاصطناعي إلى اتخاذ حكم معين؟","o":["الحوسبة السحابية.","الذكاء الاصطناعي القابل للتفسير (XAI).","الحوسبة الطرفية.","التحيز الخوارزمي."],"c":1},{"q":"ما الفرق الأساسي بين «المسؤولية» و«المساءلة» كما تم توضيحه في الدرس؟","o":["المسؤولية تعني إظهار عملية اتخاذ القرار بينما المساءلة تعني سرعة المعالجة.","المسؤولية تتعلق بتحديد أدوار وواجبات الأطراف، بينما تعني المساءلة تحديد الجهات التي يمكن محاسبتها وفق أدوارها.","المساءلة هي التقنية التي تفهم منطق الذكاء الاصطناعي بينما المسؤولية هي جمع البيانات.","لا يوجد أي فرق بينهما فهما مصطلحان مترادفان تماماً."],"c":1}],"essay":[{"q":"ما المقصود بمصطلح «الذكاء الاصطناعي القابل للتفسير (XAI)»، ولماذا يُعد أسلوباً أساسياً للتغلب على مشكلة

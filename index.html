الصندوق الأسود؟","m":"الذكاء الاصطناعي القابل للتفسير (XAI) هو أساليب وتقنيات تساعد البشر على فهم العوامل التي أسهمت في وصول النظام إلى مخرج أو قرار معين. وهو أساسي للتغلب على مشكلة الصندوق الأسود لأن غموض الآلية يصعّب تقييمها واكتشاف الأخطاء أو التحيز، بينما يوضح XAI هذه العوامل فيسهل ذلك."},{"q":"قارن بإيجاز بين مفهوم «المسؤولية» ومفهوم «المساءلة» في سياق أنظمة الذكاء الاصطناعي؟","m":"المسؤولية: تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه، كالمطور والجهة المشغلة والمستخدم. المساءلة: تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها. فالمسؤولية تتعلق بتوزيع الواجبات، والمساءلة بمن يُحاسَب على النتيجة، وليست المساءلة القدرة على شرح القرار فهذه وظيفة XAI."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٢٥","mcq":[{"q":"من بين المبادئ الأساسية لأخلاقيات الذكاء الاصطناعي، ما هو المبدأ الذي يقتضي عدم التمييز ظلماً ضد أي شخص أو مجموعة بعينها؟","o":["الشفافية.","المساءلة.","العدالة.","حماية الخصوصية."],"c":2},{"q":"ما هو المبدأ الذي يشير إلى إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده؟","o":["العدالة.","الشفافية.","حماية الخصوصية.","المسؤولية."],"c":1}],"essay":[{"q":"اذكر المبادئ الأربعة الأساسية لأخلاقيات الذكاء الاصطناعي مع شرح مبدأ «العدالة» باختصار.","m":"المبادئ الأربعة: (1) العدالة. (2) الشفافية. (3) حماية الخصوصية. (4) المساءلة. والعدالة تعني عدم التمييز ظلماً ضد أي شخص أو مجموعة بعينها في أحكام النظام ومخرجاته."},{"q":"وضح المقصود بكل من مبدأ «الشفافية» ومبدأ «حماية الخصوصية» في إطار الاستخدام المسؤول للذكاء الاصطناعي.","m":"الشفافية: إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده، ليفهم المستخدمون كيف يعمل وما قيوده. حماية الخصوصية: التعامل مع المعلومات الشخصية بشكل مناسب وحمايتها، وإتاحة التحكم في البيانات الشخصية التي تتم مشاركتها."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٢٦ – ٢٧","mcq":[{"q":"نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وينشأ من البيانات أو التصميم يسمى:","o":["الذكاء الاصطناعي القابل للتفسير (XAI).","التحيز الخوارزمي.","الشفافية المطلقة.","حماية الخصوصية."],"c":1},{"q":"تقنية تتيح للبشر فهم سبب اتخاذ الذكاء الاصطناعي حكماً معيناً وتساعد على تجنب مشكلة الصندوق الأسود هي:","o":["الذكاء الاصطناعي القابل للتفسير (XAI).","الحوسبة الطرفية.","بيانات التدريب.","التحيز الخوارزمي."],"c":0},{"q":"المبدأ الذي يعني التعامل مع المعلومات الشخصية بشكل مناسب وحمايتها هو:","o":["العدالة","الشفافية","حماية الخصوصية","المساءلة"],"c":2},{"q":"تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها يمثل مبدأ:","o":["الشفافية","العدالة","المساءلة","حماية الخصوصية"],"c":2}],"essay":[{"q":"اشرح ماهية «التحيز الخوارزمي» في أنظمة الذكاء الاصطناعي مبيناً كيف ينشأ من بيانات التدريب أو تصميم النظام وطريقة استخدامه مع ذكر أمثلة.","m":"التحيز الخوارزمي نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة. ينشأ من بيانات التدريب غير الكافية أو غير الممثلة أو التي تعكس نزعات تمييزية سابقة، ومن تصميم النظام كاختيار متغيرات غير مناسبة، ومن طريقة استخدامه وسياقه الاجتماعي. أمثلة: نظام توظيف يفضّل فئة بصورة غير عادلة، ونظام تعرف على الوجه تقل دقته مع فئات معينة."},{"q":"تكلم بالتفصيل عن «الذكاء الاصطناعي القابل للتفسير (XAI)» ومشكلة «الصندوق الأسود» وكيف يساهم في تقييم النظام واكتشاف الأخطاء؟","m":"الصندوق الأسود هو عدم وضوح كيفية وصول خوارزمية الذكاء الاصطناعي المعقدة إلى حكمها أو قرارها. أما الذكاء الاصطناعي القابل للتفسير (XAI) فهو أساليب تتيح للبشر فهم سبب اتخاذ النظام حكماً معيناً بتوضيح العوامل التي أسهمت في المخرج. وبذلك يسهل تقييم آلية النظام واكتشاف الأخطاء أو التحيز، بينما يصعب ذلك إذا بقيت الآلية غامضة."},{"q":"قارن بدقة بين مفهوم «المسؤولية» ومفهوم «المساءلة» موضحاً سبب اختلاف توزيع المسؤولية باختلاف السياقات والأطراف (المطور، المشغل، المستخدم)؟","m":"المسؤولية: تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه (المطور والجهة المشغلة والمستخدم). المساءلة: تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها. ولا يوجد توزيع واحد للمسؤولية يصلح لكل السياقات، إذ يختلف باختلاف النظام وطريقة استخدامه والقواعد المعمول بها، فقد يتحمل المطور أو المشغل أو المستخدم جزءاً مختلفاً في كل حالة."},{"q":"اذكر المبادئ الأربعة الأساسية لأخلاقيات الذكاء الاصطناعي واشرح باختصار المقصود بكل من «العدالة»، «الشفافية»، «حماية الخصوصية»، و«المساءلة».","m":"المبادئ الأربعة: (1) العدالة: عدم التمييز ظلماً ضد أي شخص أو مجموعة بعينها في أحكام النظام ومخرجاته. (2) الشفافية: إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده. (3) حماية الخصوصية: التعامل مع المعلومات الشخصية بشكل مناسب وحمايتها. (4) المساءلة: تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها."}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٢٧ – ٢٨","mcq":[{"q":"الأمثلة التي يتعلم منها نظام الذكاء الاصطناعي أنماطه قبل استخدامه وتؤثر بشكل مباشر على جودة مخرجاته تسمى:","o":["بيانات التدريب.","خوارزميات التشفير.","الأجهزة الطرفية.","الذاكرة العشوائية."],"c":0},{"q":"إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده يعد تعريفاً دقيقاً لمبدأ:","o":["العدالة.","الشفافية.","المساءلة.","حماية الخصوصية."],"c":1},{"q":"عدم التمييز ظلماً ضد أي شخص أو مجموعة بعينها في أحكام ومخرجات الذكاء الاصطناعي يمثل مبدأ:","o":["العدالة.","الشفافية.","حماية الخصوصية.","المساءلة."],"c":0},{"q":"الأسلوب أو التقنية التي تساعد البشر على فهم العوامل التي أسهمت في وصول النظام إلى مخرج أو قرار معين هي:","o":["التحيز الخوارزمي.","الذكاء الاصطناعي القابل للتفسير (XAI).","الجمع الجماعي للبيانات.","تدقيق الشبكات."],"c":1}],"essay":[{"q":"وضح كيف يمكن أن تؤدي بيانات التدريب غير الممثلة أو المتحيزة (مثل انعكاس نزعات تمييزية سابقة) إلى تكرار الذكاء الاصطناعي لهذا التحيز في أحكامه.","m":"يتعلم النظام أنماطه من بيانات التدريب، فإذا كانت غير ممثلة أو غير كافية عن سمات أو فئات معينة، أو تعكس نزعات تمييزية سابقة، تعلّمها النظام كأنها قاعدة صحيحة وكرّرها في أحكامه. فتأتي مخرجاته غير عادلة تجاه تلك الفئات، لأن النظام لا يعرف إلا ما ظهر في بياناته."},{"q":"اشرح مشكلة «الصندوق الأسود» في خوارزميات الذكاء الاصطناعي المعقدة ولماذا يجعل تقييم الآلية واكتشاف الأخطاء أمراً صعباً دون استخدام تقنيات التفسير.","m":"مشكلة الصندوق الأسود هي عدم وضوح كيفية توصل الخوارزمية المعقدة إلى حكمها أو قرارها. وعندما تكون آلية الوصول إلى النتيجة غير واضحة يصعب تقييمها واكتشاف الأخطاء أو التحيز، إذ لا نعرف العوامل التي أثرت في القرار. ولذلك تُستخدم تقنيات الذكاء الاصطناعي القابل للتفسير (XAI) لتوضيح العوامل التي أسهمت في المخرج."},{"q":"اذكر قضايا الخصوصية المرتبطة بانتشار تقنيات التعرف على الوجه في الأماكن العامة والجمع الجماعي للبيانات والسلوك عبر الإنترنت.","m":"(1) المراقبة عبر التعرف على الوجه: تستطيع الكاميرات في الأماكن العامة التعرف على الأفراد وتتبعهم، مما يهدد خصوصيتهم وقد تتحسن معه السلامة والراحة، فيلزم الموازنة بينها. (2) الجمع الجماعي للبيانات: تُجمع وتُحلَّل كميات كبيرة من بيانات السلوك الشخصي عبر الإنترنت، مما يثير مخاوف بشأن التحكم في البيانات الشخصية المشاركة."},{"q":"اشرح بالتفصيل المبادئ الأربعة الأساسية لأخلاقيات الذكاء الاصطناعي وكيف يوجه كل منها الاستخدام المسؤول لهذه التقنيات في المجتمع.","m":"(1) العدالة: عدم التمييز ظلماً ضد أي شخص أو مجموعة، فتُراجع البيانات والمخرجات للتأكد من إنصافها. (2) الشفافية: إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده، ليفهمه المستخدمون. (3) حماية الخصوصية: التعامل المناسب مع المعلومات الشخصية وحمايتها وإتاحة التحكم فيها. (4) المساءلة: تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها. وبالالتزام بها يكون استخدام هذه التقنيات في المجتمع مسؤولاً."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٢٨ – ٢٩","mcq":[{"q":"تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه (المطور، المشغل، المستخدم) يشير إلى مصطلح:","o":["المسؤولية.","التحيز الخوارزمي.","بيانات التدريب.","الشفافية."],"c":0},{"q":"نظام أو تقنية تجمع كميات كبيرة من بيانات السلوك عبر الإنترنت وتسمح بتتبع الأفراد في الأماكن العامة تثير قضايا تتعلق بـ:","o":["سرعة المعالجة الحاسوبية.","حماية الخصوصية","كفاءة الذاكرة المركزية.","قانون مور."],"c":1},{"q":"إحدى الآتي تمثل الوصف الدقيق لمبدأ «المساءلة»:","o":["إتاحة معلومات واضحة عن النظام وحدوده.","عدم التمييز ظلماً ضد أي شخص أو مجموعة.","تحديد الجهات المسؤولة عن النظام وقراراته وإمكان محاسبتها وفق أدوارها.","فهم العوامل التي أسهمت في وصول النظام إلى مخرج معين."],"c":2},{"q":"أي من الخيارات التالية يُعد مثالاً واضحاً على التحيز في أنظمة الذكاء الاصطناعي؟","o":["نظام توظيف يفضل فئة بصورة غير عادلة أو نظام تعرف على الوجه تقل دقته مع فئات معينة.","برنامج لتنظيم المجلدات والملفات الشخصية على الحاسوب المحلي.","تطبيق لحساب العمليات الرياضية البسيطة والعمليات الهندسية.","أداة لتعديل صور المناظر الطبيعية وتحسين إضاءتها."],"c":0}],"essay":[{"q":"ناقش أسباب التحيز الخوارزمي وكيف يمكن أن ينشأ من الاختيار غير المناسب للمتغيرات، أو استخدام متغير بديل يمثل بشكل غير مباشر سمة محمية؟","h":1},{"q":"بيّن أهمية «الذكاء الاصطناعي القابل للتفسير (XAI)» في معالجة صعوبة تقييم آلية الوصول إلى النتيجة عندما تكون غير واضحة للعين البشرية؟","m":"عندما تكون آلية وصول النظام إلى النتيجة غير واضحة للعين البشرية يصعب تقييمها واكتشاف الأخطاء أو التحيز. وهنا تأتي أهمية الذكاء الاصطناعي القابل للتفسير (XAI)، فهو أساليب تساعد البشر على فهم العوامل التي أسهمت في وصول النظام إلى مخرج أو قرار معين، فيمكن مراجعة القرار وتقييمه وكشف الخلل وتصحيحه، وهذا يعزز الشفافية والثقة."},{"q":"وضح الأبعاد المختلفة لمسؤولية الأطراف المتعددة (المطور، الشركة المشغلة، المستخدم) عند اتخاذ نظام الذكاء الاصطناعي حكماً خاطئاً أو غير عادل.","h":1},{"q":"اشرح كيف تتكامل المبادئ الأربعة لأخلاقيات الذكاء الاصطناعي (العدالة، الشفافية، حماية الخصوصية، المساءلة) لتشكيل إطار متكامل للاستخدام المسؤول.","m":"تعمل المبادئ الأربعة معاً كإطار واحد للاستخدام المسؤول: (1) العدالة تمنع التمييز ضد أي شخص أو مجموعة. (2) الشفافية تتيح معلومات واضحة عن النظام وقراراته وحدوده. (3) حماية الخصوصية تحفظ تحكم الأفراد في بياناتهم الشخصية. (4) المساءلة تحدد الجهات المسؤولة وتحاسبها وفق أدوارها. فالشفافية تكشف الخلل، والمساءلة تصححه، والعدالة والخصوصية تحميان الأفراد، فتزداد الثقة ويقل الضرر."}]}],"2-1":[{"n":"أولاً: المهام الأدائية","k":"classwork","p":"ص٣٠","mcq":[{"q":"أي من التقنيات التالية يُستخدم أساساً لتشفير بيانات الجلسة بسرعة وكفاءة عالية بعد اكتمال عملية المصافحة واتفاق الأمان؟","o":["التشفير بالمفتاح العام.","التشفير المتماثل.","التوقيع الرقمي.","الشهادة الرقمية."],"c":1},{"q":"ماذا تسمى الخطوات الخاصة بإنشاء الاتصال الآمن والتحقق من هوية الخادم واسم النطاق عبر بروتوكول HTTPS؟","o":["مصافحة TLS.","التوقيع الرقمي.","المصادقة الثنائية.","التشفير المتماثل."],"c":0}],"essay":[{"q":"اشرح كيف تعمل اتصالات HTTPS على حماية الاتصال، وما دور بروتوكول TLS في ذلك؟","m":"HTTPS هو بروتوكول HTTP منقول عبر اتصال TLS مؤمن، ويوفر بذلك سرية البيانات وسلامتها أثناء النقل. ويبدأ الاتصال بمصافحة TLS وهي خطوات إنشاء الاتصال الآمن، يرسل فيها الخادم شهادته الرقمية فيتحقق المتصفح من هوية الخادم واسم النطاق، ثم تشتق مفاتيح الجلسة، وبعدها تحمى البيانات بالتشفير المتماثل."},{"q":"ميز بين دور كل من التشفير المتماثل والتشفير بالمفتاح العام أثناء تدفق اتصال HTTPS؟","m":"التشفير بالمفتاح العام يستخدم زوجاً من المفاتيح المرتبطة (عام وخاص)، ويعمل أثناء مصافحة TLS للمصادقة والاتفاق الآمن على أسرار مشتركة تشتق منها مفاتيح الجلسة. أما التشفير المتماثل فيستخدم مفتاح الجلسة لحماية بيانات الجلسة بعد المصافحة، وهو سريع وكفؤ في حماية البيانات المتبادلة."}]},{"n":"ثانياً: أداءات منزلية","k":"homework","p":"ص٣٠","mcq":[{"q":"أي من الخيارات التالية يمثل عاملين من فئتين مختلفتين تماماً (المعرفة والحيازة) يُستخدمان في المصادقة الثنائية للخدمات المصرفية؟","o":["كلمة مرور + كلمة مرور ثانية نصية.","كلمة مرور + كلمة مرور لمرة واحدة (OTP).","بصمة الإصبع + التعرف على الوجه.","بطاقة هوية ورقية + اسم المستخدم فقط."],"c":1},{"q":"ماذا يُقصد بمصطلح المصادقة متعددة العوامل (MFA)؟","o":["استخدام كلمة مرور واحدة قوية ومعقدة للغاية.","استخدام عاملين أو أكثر من فئات مختلفة مثل المعرفة والحيازة والسمات الحيوية.","الاعتماد حصراً على بصمة الإصبع فقط لتسجيل الدخول.","استخدام عنوان البريد الإلكتروني مع كلمة المرور التقليدية."],"c":1}],"essay":[{"q":"ما المقصود بمصطلح «المصادقة الثنائية (2FA)»، وكيف يقلل استخدام عامل مستقل ثانٍ من مخاطر الدخول غير المصرح به؟","m":"المصادقة الثنائية (2FA) هي استخدام عاملين مستقلين من فئتين مختلفتين لإثبات الهوية، مثل كلمة المرور (المعرفة) ورمز لمرة واحدة على الهاتف (الحيازة). وهي تقلل احتمال تسجيل الدخول غير المصرح به، لأن معرفة المهاجم لكلمة المرور وحدها لا تكفي، إذ يحتاج أيضاً إلى العامل الثاني المستقل الذي لا يملكه."},{"q":"اذكر الفروق الأساسية بين المصادقة الثنائية (2FA) والمصادقة متعددة العوامل (MFA) من حيث عدد وفئات العوامل المستخدمة؟","m":"(1) من حيث العدد: 2FA تستخدم عاملين فقط، بينما MFA تستخدم عاملين أو أكثر. (2) من حيث الفئات: في الحالتين يجب أن تكون العوامل مستقلة ومن فئات مختلفة، وهي المعرفة (كلمة المرور) والحيازة (الهاتف أو البطاقة الذكية) والسمات الحيوية (بصمة الإصبع أو الوجه). (3) تعد 2FA حالة خاصة من MFA، وتتيح MFA إضافة عوامل أخرى مختلفة الفئة لزيادة قوة التحقق، وكلمتا مرور من فئة المعرفة لا تعدان مصادقة ثنائية."}]},{"n":"أولاً: المهام الأدائية","k":"classwork","p":"ص٣١","mcq":[{"q":"ما هي التقنية التي تساعد المتصفح على التحقق من هوية الخادم وارتباط الشهادة باسم النطاق الذي يتصل به؟","o":["التشفير المتماثل","التوقيع الرقمي","الشهادة الرقمية","المصادقة الثنائية"],"c":2},{"q":"أي من التقنيات الآتية تكتشف التلاعب وانتحال الشخصية وتوفر دليلاً يدعم عدم التنصل؟","o":["التشفير المتماثل","التوقيع الرقمي","مصافحة TLS","المصادقة الثنائية"],"c":1}],"essay":[{"q":"ما الدور الأساسي للشهادة الرقمية وآليات المفتاح العام في بدء اتصال TLS آمن؟","m":"الشهادة الرقمية تعرّف بالخادم وتساعد المتصفح على التحقق من هويته واسم النطاق الذي يتصل به. فأثناء مصافحة TLS يرسل الخادم شهادته، ويتحقق المتصفح من صلاحيتها وسلسلة الثقة ومن ملاءمتها لاسم الموقع. وتستخدم المصافحة الشهادات وآليات المفتاح العام للمصادقة والاتفاق الآمن على أسرار تشتق منها مفاتيح الجلسة."},{"q":"قارن بإيجاز بين وظيفة التوقيع الرقمي ووظيفة الشهادة الرقمية في أنظمة الأمان.","m":"التوقيع الرقمي يدعم التحقق من سلامة البيانات وهوية الموقِّع، ويكتشف التلاعب وانتحال الشخصية، ويوفر دليلاً يدعم عدم التنصل عندما يتطلب النظام ذلك. أما الشهادة الرقمية فتساعد المتصفح على التحقق من هوية الخادم وارتباط الشهادة باسم النطاق الذي يتصل به. فالأول يخص البيانات والموقِّع، والثانية تخص هوية الخادم والنطاق."}]},{"n":"ثانياً: أداءات منزلية","k":"homework","p":"ص٣٢","mcq":[{"q":"أي من التقنيات التالية تمنع قراءة محتوى الاتصال من قبل أطراف ثالثة أثناء نقل البيانات عبر الشبكة؟","o":["التشفير (بالمفتاح المتماثل والمفتاح العام).","التوقيع الرقمي.","المصادقة الثنائية (2FA).","الشهادة الرقمية."],"c":0},{"q":"من بين الخيارات التالية، أي خيار يُعد مثالاً خاطئاً للمصادقة الثنائية لأنه يعتمد على نفس فئة العامل (المعرفة)؟","o":["كلمة مرور + كلمة مرور لمرة واحدة ترسل للهاتف.","كلمة مرور + بصمة الإصبع.","كلمة مرور + كلمة مرور سرية ثانية.","كلمة مرور + رمز من تطبيق مصادقة."],"c":2}],"essay":[{"q":"اشرح باختصار كيف يتم الجمع بين تقنيات الأمان المختلفة (التشفير، الشهادات، المصادقة الثنائية) عند إتمام عملية شراء عبر متجر إلكتروني.","m":"عند الشراء من متجر إلكتروني تجتمع عدة تقنيات: (1) يبدأ اتصال HTTPS فيمنع التشفير قراءة محتوى الاتصال من أطراف ثالثة. (2) يتحقق المتصفح من الشهادة الرقمية واسم النطاق للتأكد من هوية الخادم. (3) يدعم التوقيع الرقمي سلامة البيانات وعدم التنصل عند الحاجة. (4) تقلل المصادقة الثنائية احتمال تسجيل الدخول غير المصرح به إلى حساب المشتري."},{"q":"لماذا لا يُكتفى بتقنية أمان واحدة فقط لضمان حماية الخدمات والاتصالات عبر الإنترنت، وما هي الفائدة العملية لتعدد الطبقات؟","m":"لأن كل تقنية تعالج خطراً مختلفاً ولا تغني عن غيرها: التشفير يمنع قراءة المحتوى، والشهادة تتحقق من هوية الخادم، والتوقيع يكشف التلاعب، والمصادقة الثنائية تقلل الدخول غير المصرح به. والفائدة العملية لتعدد الطبقات أنها تغطي مخاطر متعددة معاً، وإذا ضعفت إحداها أو فشلت بقيت الأخرى تحد من الضرر، فلا يعتمد الأمان على نقطة واحدة."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٣٢","mcq":[{"q":"بروتوكول HTTP منقول عبر اتصال TLS مؤمن يوفر سرية البيانات وسلامتها أثناء النقل يُعرف بـ:","o":["HTTPS","FTP","SMTP","DNS"],"c":0},{"q":"استخدام عاملين مستقلين من فئتين مختلفتين لإثبات الهوية يُعرف بـ:","o":["التشفير المتماثل.","المصادقة الثنائية (2FA).","التوقيع الرقمي.","الشهادة الرقمية."],"c":1},{"q":"تقنية تكتشف التلاعب وانتحال الشخصية وتوفر دليلاً يدعم عدم التنصل هي:","o":["التوقيع الرقمي.","التشفير بالمفتاح العام.","مصافحة TLS.","الحوسبة السحابية."],"c":0},{"q":"أي من الخيارات الآتية يمثل فئات عوامل المصادقة متعددة العوامل (MFA) بدقة؟","o":["المعرفة والحيازة والسمات الحيوية.","السرعة والكفاءة والتكلفة.","المفتاح العام والمفتاح الخاص وكلمة المرور.","الاتصال اللاسلكي والشبكة المحلية والسحابة."],"c":0}],"essay":[{"q":"اشرح بالتفصيل كيف تستخدم اتصالات HTTPS تقنيات مختلفة لحماية الاتصال منذ لحظة بدء المصافحة وحتى تبادل البيانات.","m":"(1) تبدأ مصافحة TLS عند بدء الاتصال، وهي خطوات إنشاء الاتصال الآمن. (2) يرسل الخادم شهادته الرقمية، فيتحقق المتصفح من صلاحيتها وسلسلة الثقة ومن ملاءمتها لاسم الموقع (التشفير بالمفتاح العام والشهادات). (3) في المصافحة نفسها يتفاوض الطرفان على أسرار مشتركة تشتق منها مفاتيح الجلسة دون إرسال المفتاح نفسه عبر الشبكة. (4) بعد اكتمال المصافحة تحمى بيانات الجلسة بالتشفير المتماثل وآليات سلامة البيانات."},{"q":"ميز بدقة بين دور التشفير المتماثل والتشفير بالمفتاح العام، موضحاً سبب استخدام كل منهما في مراحل اتصال HTTPS.","m":"التشفير بالمفتاح العام يستخدم زوجاً مرتبطاً من مفتاح عام وخاص، ويستخدم في مرحلة المصافحة للمصادقة والاتفاق الآمن على أسرار مشتركة تشتق منها مفاتيح الجلسة، دون إرسال المفتاح نفسه عبر الشبكة. أما التشفير المتماثل فيستخدم مفتاح الجلسة في مرحلة تبادل البيانات لحمايتها بسرعة وكفاءة. فلكل منهما مرحلة تناسب وظيفته."},{"q":"وضح بمثال عملي كيف تستخدم المصادقة الثنائية في تسجيل الدخول إلى حسابات وسائل التواصل الاجتماعي أو الخدمات المصرفية.","m":"عند تسجيل الدخول إلى حساب مصرفي أو حساب على وسائل التواصل الاجتماعي، يدخل المستخدم اسمه وكلمة المرور (عامل المعرفة). ثم يطلب النظام عاملاً ثانياً مستقلاً من فئة أخرى، كرمز لمرة واحدة OTP يرسل إلى هاتفه أو يظهر في تطبيق مصادقة (عامل الحيازة). ولا يسمح بالدخول إلا بنجاح العاملين معاً، فلا تكفي كلمة المرور المسروقة وحدها."},{"q":"ناقش العبارة التالية: «يعتمد الاتصال والخدمات الآمنة عبر الإنترنت على الجمع بين التشفير والمصادقة، وليس على تقنية واحدة فقط». مبيناً دور كل تقنية مجتمعة؟","h":1}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٣٣","mcq":[{"q":"زوج من المفاتيح المرتبطة يتكون من مفتاح عام ومفتاح خاص يُستخدم في التشفير لتأمين الاتصال هو:","o":["التشفير بالمفتاح العام.","التشفير المتماثل.","الكيوبت الكمومي.","البت الكلاسيكي."],"c":0},{"q":"خدمة أو نظام يساعد المتصفح على التحقق من هوية الخادم ومن مطابقة اسم النطاق للشهادة الرقمية:","o":["التوقيع الرقمي.","الشهادة الرقمية.","التشفير المتماثل.","المصادقة الثنائية."],"c":1},{"q":"أي من الخيارات التالية يعد مثالاً صحيحاً لعامل «الحيازة» في المصادقة الثنائية؟","o":["معرفة السؤال السري.","كلمة مرور لمرة واحدة مرسلة للهاتف أو بطاقة ذكية.","بصمة الإصبع الخاصة بالمستخدم.","التعرف على ملامح الوجه."],"c":1},{"q":"تركيبات تقنيات الأمان في المتاجر الإلكترونية تضمن حماية التسجيل والدفع من خلال:","o":["الاعتماد على تقنية واحدة فقط لسرعة التنفيذ.","الجمع بين التشفير والشهادات والتوقيعات والمصادقة الثنائية لتقليل المخاطر المتعددة.","إلغاء استخدام كلمات المرور نهائياً.","الاكتفاء بالتشفير المتماثل دون أي مصادقة."],"c":1}],"essay":[{"q":"اشرح الخطوات الأساسية التي تحدث خلال «مصافحة TLS» وكيف يتحقق المتصفح من شهادة الخادم.","m":"(1) عند بدء اتصال HTTPS ينفذ الطرفان مصافحة TLS ويرسل الخادم شهادته الرقمية. (2) يتحقق المتصفح من الشهادة بثلاثة أمور: صلاحيتها، وسلسلة الثقة، وملاءمتها لاسم الموقع الذي يتصل به. (3) يتفاوض الطرفان في المصافحة نفسها على أسرار مشتركة تشتق منها مفاتيح الجلسة، ويشتق كل طرف مفتاح الجلسة لديه. (4) بعد اكتمال المصافحة تحمى بيانات الجلسة بالتشفير المتماثل وآليات سلامة البيانات."},{"q":"وضح لماذا يكون استخدام التشفير بالمفتاح العام لجميع البيانات المتبادلة بطيئاً، وكيف يعالج بروتوكول TLS هذه المشكلة باستخدام مفاتيح الجلسة.","m":"التشفير بالمفتاح العام يعتمد على زوج مفاتيح مرتبطة، وهو أبطأ وأقل كفاءة في حماية كميات كبيرة من البيانات المتبادلة طوال الجلسة. ويعالج TLS ذلك بأن يقصر استخدامه على المصافحة، للمصادقة والاتفاق الآمن على أسرار تشتق منها مفاتيح الجلسة، ثم يستخدم التشفير المتماثل بهذه المفاتيح لحماية بيانات الجلسة بسرعة وكفاءة."},{"q":"قارن بين فئات عوامل المصادقة المختلفة (المعرفة، الحيازة، السمات الحيوية) مع ذكر مثال لكل فئة منها.","m":"(1) المعرفة: ما يعرفه المستخدم، مثل كلمة المرور أو الرقم السري. (2) الحيازة: ما يملكه المستخدم، مثل الهاتف الذي يستقبل رمز OTP أو البطاقة الذكية. (3) السمات الحيوية: ما يميز المستخدم جسدياً، مثل بصمة الإصبع أو التعرف على الوجه. ويجب أن يكون العاملان المستخدمان مستقلين ومن فئتين مختلفتين، فهذا ما يجعل الجمع بينهما أقوى."},{"q":"اشرح كيف يمنع استخدام عامل ثانٍ مستقل (مثل تطبيق المصادقة أو رمز الرسائل القصيرة) اختراق الحساب حتى لو تسربت كلمة المرور الأساسية.","m":"لنفرض أن مهاجماً حصل على كلمة المرور (عامل المعرفة) بعد تسريبها. عند محاولته الدخول يطلب النظام عاملاً ثانياً مستقلاً من فئة مختلفة، كرمز من تطبيق مصادقة أو رسالة قصيرة إلى هاتف المستخدم (عامل الحيازة)، وهذا لا يملكه المهاجم، فيفشل الدخول رغم معرفته كلمة المرور. ولهذا يشترط أن يكون العاملان مستقلين ومن فئتين مختلفتين، حتى لا تعني سرقة أحدهما سرقة الآخر. وتقلل هذه الطريقة احتمال تسجيل الدخول غير المصرح به كثيراً، لكنها لا تعطي حماية مطلقة."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٣٤","mcq":[{"q":"خطوات إنشاء الاتصال الآمن والاتفاق على أسرار مشتركة تشتق منها مفاتيح الجلسة تسمى:","o":["مصافحة TLS.","التشفير المتماثل.","التوقيع الرقمي.","الشهادة الرقمية."],"c":0},{"q":"استخدام عاملين أو أكثر من فئات مختلفة لإثبات الهوية (مثل المعرفة والحيازة والسمات الحيوية) يسمى:","o":["المصادقة متعددة العوامل (MFA).","التشفير بالمفتاح العام.","مصافحة TLS.","التشفير المتماثل."],"c":0},{"q":"أي مما يلي يُعد مثالاً على عامل «السمات الحيوية» في المصادقة؟","o":["كلمة المرور النصية.","بصمة الإصبع أو التعرف على الوجه.","بطاقة الصراف الآلي.","رمز التحقق عبر الرسائل القصيرة."],"c":1},{"q":"الاتصال والخدمات الآمنة عبر الإنترنت تعتمد بشكل أساسي على:","o":["تقنية واحدة فريدة ومطلقة.","الجمع بين التشفير والمصادقة والشهادات والتوقيعات الرقمية.","استخدام كلمات المرور البسيطة فقط.","إلغاء استخدام المفاتيح العامة والخاصة."],"c":1}],"essay":[{"q":"اشرح بالتفصيل كيف تساهم الشهادات الرقمية وسلسلة الثقة في تمكين المتصفح من التحقق من صحة وملاءمة اسم الموقع الخادم.","m":"أثناء مصافحة TLS يرسل الخادم شهادته الرقمية إلى المتصفح. يتحقق المتصفح من صلاحيتها، ثم من سلسلة الثقة التي تربطها بجهة موثوقة، ثم من ملاءمتها لاسم الموقع الذي يتصل به. وبذلك تساعده الشهادة على التحقق من هوية الخادم وارتباط الشهادة باسم النطاق، قبل أن تبدأ حماية بيانات الجلسة."},{"q":"تكلم باختصار عن التوقيع الرقمي مبيناً خصائصه، وكيف يساعد في اكتشاف التلاعب وانتحال الشخصية وتوفير دليل عدم التنصل.","m":"التوقيع الرقمي تقنية تدعم التحقق من سلامة البيانات وهوية الموقِّع. فهو يكتشف أي تغيير في البيانات (التلاعب) ويكشف انتحال الشخصية، ويوفر دليلاً يدعم عدم التنصل، أي صعوبة إنكار الموقِّع ما وقّعه، وذلك عندما يتطلب النظام ذلك."},{"q":"ما هي الفوائد الأمنية الناتجة عن جمع عدة تقنيات أمان (التشفير، التوقيعات، الشهادات، المصادقة الثنائية) في سياق الخدمات المصرفية والتسوق الإلكتروني؟","m":"يؤدي الجمع بين التقنيات إلى تغطية مخاطر متعددة: التشفير يمنع قراءة محتوى الاتصال من أطراف ثالثة، والتوقيع الرقمي يدعم سلامة البيانات وهوية الموقِّع وعدم التنصل، والشهادة تتحقق من هوية الخادم واسم النطاق، والمصادقة الثنائية تقلل الدخول غير المصرح به. فيقل احتمال نجاح الاختراق أو الاحتيال في الخدمات المصرفية والتسوق الإلكتروني."},{"q":"ناقش بحرية لماذا لا تعني وسائل الأمان المتقدمة مثل TLS والمصادقة الثنائية أن الحماية مطلقة أو أن محتوى الموقع موثوق تماماً.","h":1}]}],"2-2":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٣٦","mcq":[{"q":"أي من الخيارات التالية يُعَد التعريف الدقيق لمفهوم «الدفاع في العمق» في أمان الشبكات؟","o":["الاعتماد الكامل على جدار حماية قوي عند حدود الشبكة.","استخدام طبقات متعددة من الضوابط الأمنية بحيث تقلل الطبقات الأخرى الخطر إذا فشلت إحدى الطبقات.","منح الثقة التلقائية لجميع الأجهزة الموجودة داخل النطاق الجغرافي للمؤسسة.","تشفير حركة المرور بالكامل حصرياً عند استخدام شبكات Wi-Fi العامة."],"c":1},{"q":"ما هو المصطلح الذي يطلق على نظام أو برنامج يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفق قواعد أمنية محددة؟","o":["الشبكة الافتراضية الخاصة.","المنطقة المعزولة.","جدار الحماية.","نهج انعدام الثقة."],"c":2}],"essay":[{"q":"اشرح ما المقصود بمفهوم «الدفاع في العمق» في أمان الشبكات، ولماذا يُعد توفير طبقات متعددة أضمن من الاعتماد على وسيلة حماية واحدة.","m":"الدفاع في العمق هو استخدام طبقات متعددة من الضوابط الأمنية، بحيث تساعد الطبقات الأخرى على تقليل الخطر والحد من أثر الاختراق إذا فشلت إحدى الطبقات. وهو أضمن من وسيلة واحدة لأن فشل وسيلة واحدة يكشف النظام كله، أما مع الطبقات المتعددة فيصبح من غير المرجح أن يؤدي خرق واحد إلى كشف النظام بأكمله."},{"q":"وضح الدور الأساسي لجدار الحماية (Firewall) في أمان الشبكات، واذكر مثالاً على كيفية تحكمه في حركة المرور.","m":"جدار الحماية يعمل عند مدخل الشبكة، فيراقب حركة المرور ويسمح بالاتصال أو يمنعه استناداً إلى قواعد محددة مسبقاً، فيمنع الاتصال غير المصرح به. مثال: قاعدة تسمح بحركة تصفح الويب المصرح بها، وقاعدة أخرى تحجب اتصالاً وارداً من الإنترنت إلى جهاز داخلي لا يجب الوصول إليه."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٣٧","mcq":[{"q":"ما هو المصطلح الذي يشير إلى اتصال أو شبكة منطقية خاصة تُنشأ عبر شبكة عامة مثل الإنترنت وتستخدم التشفير لحماية البيانات؟","o":["جدار الحماية.","الشبكة الافتراضية الخاصة (VPN).","المنطقة المعزولة (DMZ).","نهج انعدام الثقة."],"c":1},{"q":"أي من الخيارات الآتية يمثل الاستخدام الأنسب والأكثر شيوعاً للشبكة الافتراضية الخاصة (VPN) في بيئات العمل الحديثة؟","o":["الاتصال بأمان بشبكة المؤسسة من المنزل أو أثناء التنقل والعمل عن بعد.","حماية الأجهزة الطرفية من الفيروسات وإزالتها تلقائياً بدون برامج مساعدة.","مراقبة حركة مرور الشبكة المحلية ومنع البريد الإلكتروني العشوائي.","توفير منصات تتيح للمستخدمين نشر المحتوى ومشاركته بسرعة فائقة."],"c":0}],"essay":[{"q":"ما المقصود بمصطلح «الشبكة الافتراضية الخاصة (VPN)»؟ اذكر اثنين من استخداماتها الرئيسية.","m":"الشبكة الافتراضية الخاصة (VPN) هي اتصال أو شبكة منطقية خاصة تنشأ عبر شبكة عامة مثل الإنترنت وتستخدم التشفير لحماية البيانات. من استخداماتها: (1) اتصال الموظف بأمان بشبكة المؤسسة من المنزل أو أثناء التنقل للعمل عن بعد. (2) تشفير الاتصال لحماية البيانات أثناء مرورها عبر الشبكة العامة، وهي الطبقة الخاصة بمسار الاتصال في الدفاع في العمق."},{"q":"لماذا يكون وضع خادم ويب عام في «المنطقة المعزولة (DMZ)» أكثر أماناً من وضعه مباشرة داخل الشبكة الداخلية للمؤسسة؟","m":"لأن الخادم العام معرض للشبكة الخارجية فاحتمال مهاجمته أكبر. وتفصل المنطقة المعزولة (DMZ) الخوادم المواجهة للجمهور عن الشبكة الداخلية، فإذا تم اختراق الخادم العام فإن الشبكة الداخلية تظل محمية ولا يصل المهاجم مباشرة إلى مواردها، بخلاف وضعه داخل الشبكة الداخلية حيث يصبح اختراقه مدخلاً إليها."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٣٧","mcq":[{"q":"ماذا يُقصد بمصطلح «المنطقة المعزولة (DMZ)» في هيكلة أمان الشبكات؟","o":["شبكة عامة مفتوحة بالكامل تتيح للمخترقين الوصول إلى قواعد البيانات الحساسة.","منطقة توضع فيها الخوادم المعرضة للشبكة الخارجية بشكل منفصل عن الشبكة الداخلية للمؤسسة.","برمجية خبيثة تقوم بمراقبة حركة المرور وتعديل قواعد جدار الحماية تلقائياً.","خط خاص افتراضي مشفر يربط بين الفروع المختلفة عبر الإنترنت العام."],"c":1},{"q":"ما هي الفرضية الأساسية التي يعتمد عليها «نهج انعدام الثقة (Zero Trust)» في تأمين موارد المؤسسة؟","o":["اعتبار كل جهاز أو مستخدم داخل شبكة المؤسسة موثوقاً تماماً بشكل تلقائي.","عدم منح الثقة تلقائياً لمستخدم أو جهاز لمجرد وجوده داخل الشبكة أو ملكيته للمؤسسة وفحص الهوية والسياق.","الاعتماد المطلق على المحيط الأمني الخارجي وعدم فحص التطبيقات الداخلية.","تشفير رسائل البريد الإلكتروني فقط دون الاهتمام بصلاحيات الوصول للبيانات."],"c":1}],"essay":[{"q":"وضح المقصود بـ «المنطقة المعزولة (DMZ)» في تصاميم الشبكات، وكيف تحمي مكونات البنية التحتية الداخلية.","m":"المنطقة المعزولة (DMZ) هي منطقة في تصميم الشبكة تفصل الخوادم المواجهة للجمهور، مثل خادم الويب العام، عن الشبكة الداخلية للمؤسسة. وتحمي البنية التحتية الداخلية لأن هذه الخوادم هي المعرضة للشبكة الخارجية، فإذا هوجم خادم عام ظلت الشبكة الداخلية محمية ومحدودة الوصول من المهاجم."},{"q":"قارن بإيجاز بين الأمان التقليدي و«نهج انعدام الثقة (Zero Trust)» من حيث التعامل مع مستخدمي الشبكة الداخلية.","m":"الأمان التقليدي يفترض أن داخل الشبكة آمن وخارجها خطر، فيثق بمستخدميها الداخليين. أما نهج انعدام الثقة فلا يمنح ثقة تلقائية لأي مستخدم أو جهاز داخلي، ويفحص الهوية والصلاحيات والسياق."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٣٨","mcq":[{"q":"ما هو المفهوم الذي يصف الحدود التقليدية التي تفترض أن ما بداخل شبكة المؤسسة آمن تماماً وما خارجها غير آمن والتي طمستها الخدمات السحابية والعمل عن بعد؟","o":["المنطقة المعزولة.","المحيط الأمني.","الحوسبة الطرفية.","التراكب الكمي."],"c":1},{"q":"أي من طبقات «الدفاع في العمق» التالية ترتبط ارتباطاً مباشراً بتثبيت برامج مكافحة الفيروسات وتحديث نظام التشغيل؟","o":["مدخل الشبكة.","مسار الاتصال.","وضع الخوادم.","الأجهزة الطرفية."],"c":3}],"essay":[{"q":"اشرح كيف تغيرت الفرضيات الأمنية حول «المحيط الأمني» التقليدي في ظل انتشار الحوسبة السحابية والعمل عن بعد.","m":"صُمم أمان الشبكات التقليدي حول حماية المحيط الأمني، بناءً على فرضية أن داخل شبكة المؤسسة آمن وخارجها خطر. ومع انتشار الخدمات السحابية والعمل عن بعد أصبحت الحدود بين الداخل والخارج غير واضحة، فلم تعد التصاميم التي تحمي المحيط فقط كافية. ولذلك يتجه الأمان إلى الدفاع في العمق ونهج انعدام الثقة."},{"q":"اذكر أمثلة على الإجراءات الأمنية الأربعة المرتبطة بطبقات الدفاع في العمق (مدخل الشبكة، مسار الاتصال، وضع الخوادم، الأجهزة الطرفية).","m":"(1) مدخل الشبكة: منع الاتصال غير المصرح به باستخدام جدار الحماية. (2) مسار الاتصال: تشفير الاتصال باستخدام الشبكة الافتراضية الخاصة (VPN). (3) وضع الخوادم: فصل الخوادم المواجهة للجمهور عن الشبكة الداخلية باستخدام المنطقة المعزولة (DMZ). (4) الأجهزة الطرفية: تثبيت برنامج مكافحة الفيروسات والحفاظ على تحديث نظام التشغيل."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٣٩","mcq":[{"q":"أي من الأجهزة أو الأنظمة التالية يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفق قواعد أمنية محددة؟","o":["جدار الحماية.","المنطقة المعزولة.","الشبكة الافتراضية الخاصة.","الحوسبة الطرفية."],"c":0},{"q":"ماذا تُسمى المنطقة التي تُعزل فيها الخوادم المواجهة للجمهور عن الشبكة الداخلية لتقليل أثر الهجمات؟","o":["المحيط الأمني.","المنطقة المعزولة (DMZ).","مسار الاتصال.","الأجهزة الطرفية."],"c":1},{"q":"ما هو المصطلح الذي يعبر عن نهج أمني لا يمنح الثقة تلقائياً لمستخدم أو جهاز لمجرد وجوده داخل الشبكة؟","o":["الدفاع في العمق.","جدار الحماية.","نهج انعدام الثقة (Zero Trust).","الشبكة الافتراضية الخاصة."],"c":2},{"q":"أي من الخيارات الآتية يمثل الاستخدام الرئيسي للشبكة الافتراضية الخاصة (VPN) لربط المكاتب أو الموظفين؟","o":["تشفير الاتصال وحماية البيانات عبر شبكات غير موثوقة أو العمل عن بعد.","التخلص التلقائي من الفيروسات الموجودة على القرص الصلب.","تسريع اتصالات الإنترنت العامة بدون الحاجة لكلمات مرور.","توفير واجهة رسومية لإدارة قواعد البيانات الضخمة."],"c":0}],"essay":[{"q":"اشرح بالتفصيل كيف يعمل «الدفاع في العمق» على حماية المؤسسة بشكل أفضل من الاعتماد على وسيلة حماية واحدة، مستعيناً بما يحدث عند اختراق أحد الدفاعات.","m":"الدفاع في العمق هو استخدام طبقات متعددة من الضوابط الأمنية، بحيث تساعد الطبقات الأخرى على تقليل الخطر والحد من أثر الاختراق إذا فشلت إحداها. فمثلاً: جدار الحماية عند مدخل الشبكة، وVPN لتشفير مسار الاتصال، وDMZ لفصل الخوادم العامة، ومكافحة الفيروسات وتحديث النظام على الأجهزة الطرفية. فإذا اخترق المهاجم طبقة واحدة وجد أمامه طبقات أخرى، أما الاعتماد على وسيلة واحدة فيجعل فشلها كشفاً للنظام كله."},{"q":"وضح الدور التقني لـ «جدار الحماية» في مراقبة حركة مرور الشبكة، ومثّل على ذلك بحماية قواعد البيانات.","m":"جدار الحماية نظام أو برنامج يعمل عند نقطة دخول وخروج الشبكة، فيراقب حركة المرور ويسمح بالاتصال أو يمنعه استناداً إلى قواعد أمنية محددة مسبقاً. مثال حماية قواعد البيانات: تُضبط قواعده بحيث يُمنع أي اتصال غير مصرح به قادم من الإنترنت إلى خادم قاعدة البيانات الداخلي، ولا يُسمح إلا بالمرور الذي تجيزه القواعد."},{"q":"اذكر المفهوم التفصيلي لـ «الشبكة الافتراضية الخاصة (VPN)» وبيّن كيف تحمي البيانات المنقولة عبر شبكات Wi-Fi العامة من التنصت.","m":"الشبكة الافتراضية الخاصة (VPN) اتصال أو شبكة منطقية خاصة عبر شبكة عامة مثل الإنترنت، تستخدم عادةً التشفير وتقنيات النفق لحماية البيانات بين الطرفين. وعند استخدام Wi-Fi عامة يُشفَّر محتوى الاتصال، فإذا اعترضه متنصت لم يستطع قراءته، وبذلك تقل مخاطر التنصت."},{"q":"قارن بالتفصيل بين الأمان التقليدي ونهج انعدام الثقة (Zero Trust) موضحاً سبب عدم كفاءة التصاميم التقليدية وحدها حالياً.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٤٠","mcq":[{"q":"التقنية التي تنشئ خطاً خاصاً افتراضياً مشفراً عبر الإنترنت للاتصال الآمن من موقع بعيد هي:","o":["جدار الحماية.","الشبكة الافتراضية الخاصة (VPN).","المنطقة المعزولة.","نهج انعدام الثقة."],"c":1},{"q":"طبقة الدفاع في العمق التي تهتم بتثبيت برنامج مكافحة الفيروسات والحفاظ على تحديث نظام التشغيل هي:","o":["مدخل الشبكة.","مسار الاتصال.","وضع الخوادم.","الأجهزة الطرفية."],"c":3},{"q":"الحدود التقليدية التي تفترض أن داخل شبكة المؤسسة آمن تماماً وخارجها خطر تُعرف بـ:","o":["المحيط الأمني.","المنطقة المعزولة.","التراكب الكمي.","الحوسبة الطرفية."],"c":0},{"q":"نظام أو برنامج يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفق قواعد أمنية محددة:","o":["جدار الحماية (Firewall).","الشبكة الافتراضية الخاصة.","الكيوبت.","الحوسبة الطرفية."],"c":0}],"essay":[{"q":"اشرح كيف تحمي «المنطقة المعزولة (DMZ)» شبكة المؤسسة الداخلية عند تعرض أحد خوادم الويب العامة للاختراق الهجومي الخارجي.","m":"تُوضع الخوادم المواجهة للجمهور، مثل خادم الويب، في DMZ منفصلة عن الشبكة الداخلية. فإذا تعرض أحد هذه الخوادم للاختراق من مهاجم خارجي قلّ احتمال وصول الهجوم منه إلى الشبكة الداخلية، وبقيت الشبكة الداخلية والبيانات السرية محمية خلف جدار حماية آخر."},{"q":"تحدث عن طبقات «الدفاع في العمق» الأربعة مبيناً الإجراء الأمني المرتبط بكل طبقة من مدخل الشبكة وحتى الأجهزة الطرفية.","m":"(1) الطبقة الأولى، مدخل الشبكة: منع الاتصال غير المصرح به باستخدام جدار الحماية. (2) الطبقة الثانية، مسار الاتصال: تشفير الاتصال باستخدام الشبكة الافتراضية الخاصة (VPN). (3) الطبقة الثالثة، وضع الخوادم: فصل الخوادم المواجهة للجمهور عن الشبكة الداخلية باستخدام المنطقة المعزولة (DMZ). (4) الطبقة الرابعة، الأجهزة الطرفية: تثبيت برنامج مكافحة الفيروسات والحفاظ على تحديث نظام التشغيل."},{"q":"وضح كيف يساهم تطبيق «نهج انعدام الثقة (Zero Trust)» في التحقق من كل عملية وصول بناءً على الهوية والصلاحيات والسياق.","m":"لا يمنح نهج انعدام الثقة أي مستخدم أو جهاز ثقة تلقائية لمجرد وجوده داخل الشبكة أو ملكيته للمؤسسة. بل تُفحص الهوية والصلاحيات والسياق عند كل طلب وصول إلى الموارد وفق سياسة المؤسسة، فلا يُسمح بالوصول إلا بعد التحقق المناسب. وبذلك يقل احتمال أن يؤدي خرق واحد إلى كشف النظام بأكمله."},{"q":"ناقش سبب تراجع فاعلية «المحيط الأمني» التقليدي في بيئات العمل الحديثة التي تعتمد على الحوسبة السحابية والعمل عن بعد.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٤١","mcq":[{"q":"منطقة توضع فيها الخوادم المعرضة للشبكة الخارجية بشكل منفصل عن الشبكة الداخلية تسمى:","o":["جدار الحماية.","المنطقة المعزولة (DMZ).","الشبكة الافتراضية الخاصة.","الأجهزة الطرفية."],"c":1},{"q":"نهج أمني لا يمنح الثقة تلقائياً لمستخدم أو جهاز لمجرد وجوده داخل الشبكة أو ملكيته للمؤسسة هو:","o":["الدفاع في العمق.","نهج انعدام الثقة (Zero Trust).","المحيط الأمني.","جدار الحماية."],"c":1},{"q":"أي مما يلي يمثل الطبقة الأولى (مدخل الشبكة) في استراتيجية الدفاع في العمق؟","o":["تشفير الاتصال باستخدام الشبكة الافتراضية الخاصة.","منع الاتصال غير المصرح به باستخدام جدار الحماية.","فصل الخوادم المواجهة للجمهور باستخدام المنطقة المعزولة.","تثبيت برنامج مكافحة الفيروسات على الأجهزة الطرفية."],"c":1},{"q":"اتصال أو شبكة منطقية خاصة عبر شبكة عامة مثل الإنترنت تستخدم التشفير وتقنيات النفق لحماية البيانات هي:","o":["الشبكة الافتراضية الخاصة (VPN).","المنطقة المعزولة.","جدار الحماية.","نهج انعدام الثقة."],"c":0}],"essay":[{"q":"ناقش الأهمية الأمنية لاستخدام «الشبكة الافتراضية الخاصة (VPN)» عند الاتصال بشبكات غير موثوقة وكيف تحمي محتوى الاتصال من التنصت.","h":1},{"q":"اشرح كيف يتكامل كل من جدار الحماية، والشبكة الافتراضية الخاصة، والمنطقة المعزولة، وضوابط الأجهزة الطرفية لتشكيل استراتيجية «دفاع في العمق» متكاملة.","m":"تعمل هذه الإجراءات كطبقات متعددة: (1) جدار الحماية عند مدخل الشبكة يمنع الاتصال غير المصرح به. (2) VPN يُشفِّر مسار الاتصال. (3) DMZ تفصل الخوادم المواجهة للجمهور عن الشبكة الداخلية. (4) ضوابط الأجهزة الطرفية، مثل مكافحة الفيروسات وتحديث النظام، تحمي الأجهزة نفسها. فإذا فشلت إحدى الطبقات بقيت الأخرى تقلل الخطر وتحد من أثر الاختراق."},{"q":"بيّن كيف يتعامل «نهج انعدام الثقة (Zero Trust)» مع الهوية والسياق والصلاحيات مقارنة بالأمان التقليدي الذي يثق بكل ما هو داخل المحيط؟","m":"الأمان التقليدي يثق تلقائياً بكل ما هو داخل المحيط الأمني. أما نهج انعدام الثقة فلا يمنح ثقة لمجرد وجود المستخدم أو الجهاز داخل الشبكة أو ملكيته للمؤسسة. فهو يتحقق من الهوية (من الطالب؟)، ومن الصلاحيات (ما المسموح له؟)، ومن السياق (ظروف الطلب) عند كل طلب وصول إلى الموارد وفق سياسة المؤسسة."},{"q":"اشرح لماذا يعد وضع خادم البريد الإلكتروني أو خادم الويب في «المنطقة المعزولة (DMZ)» إجراءً وقائياً أساسياً لسلامة قواعد البيانات الداخلية الحساسة.","m":"خادم البريد وخادم الويب مواجهان للشبكة الخارجية، فهما أكثر عرضة للهجوم. ووضعهما في DMZ منفصلة عن الشبكة الداخلية يقلل احتمال وصول الهجوم منهما إلى الشبكة الداخلية إذا تعرض أحدهما للاختراق، فتبقى قواعد البيانات الداخلية الحساسة محمية. أما وضعهما داخل الشبكة الداخلية فيجعل اختراق أحدهما بوابة نحو البيانات السرية."}]}],"2-3":[{"n":"أولاً: المهام الأدائية","k":"classwork","p":"ص٤٣","mcq":[{"q":"أي من الخيارات التالية يُعد مثالاً نموذجياً على حادث أمني يؤثر في توافر الخدمة؟","o":["تسرب المعلومات الشخصية أو السرية إلى الخارج","تعديل البيانات داخل نظام ما دون تصريح","انقطاع الخدمة بسبب هجمات على الخادم","إنشاء إجراءات وهياكل استجابة مسبقاً"],"c":2},{"q":"ما هي المرحلة الأولى من نموذج الاستجابة للحوادث التي تهدف إلى إنشاء إجراءات وهياكل استجابة مسبقاً استعداداً للحوادث؟","o":["الاكتشاف","التحضير","الاحتواء","الاستعادة"],"c":1}],"essay":[{"q":"ما المقصود بمصطلح «الحادث الأمني» وما هي أبرز الأمثلة النموذجية عليه؟","m":"الحادث الأمني حدث يؤثر في سرية المعلومات أو سلامتها أو توافرها، أو يهددها بجدية، أو يخالف سياسة أمنية. من أمثلته: تسرب المعلومات، والتلاعب بالبيانات، وانقطاع الخدمة."},{"q":"اشرح المراحل الست للاستجابة للحوادث، مبيناً الغرض الأساسي من مرحلتي «التحضير» و«الاكتشاف».","m":"المراحل الست: (1) التحضير (2) الاكتشاف (3) الاحتواء (4) إزالة التهديد (الاستئصال) (5) الاستعادة (6) الدروس المستفادة والتحسين. غرض التحضير: إنشاء إجراءات وهياكل استجابة مسبقاً استعداداً للحوادث. غرض الاكتشاف: اكتشاف وقوع حادث وتأكيده."}]},{"n":"ثانياً: أداءات منزلية","k":"homework","p":"ص٤٣","mcq":[{"q":"ما هو المصطلح الذي يُطلق على إجراء عزل الجزء المتأثر أو تقييد أثره بالطريقة المناسبة لمنع انتشار المشكلة؟","o":["التحضير","الاكتشاف","الاحتواء","الاستعادة"],"c":2},{"q":"كيف يتم حساب درجة الخطر في المصفوفة المبسطة؟","o":["التأثير + الاحتمالية","التأثير × الاحتمالية","التأثير - الاحتمالية","التأثير ÷ الاحتمالية"],"c":1}],"essay":[{"q":"وضح الغرض من مرحلتي «الاحتواء» و«إزالة التهديد (الاستئصال)» في نموذج الاستجابة للحوادث.","m":"الاحتواء: تحديد نطاق التأثير بعزل الجزء المتأثر أو تقييد أثره بالطريقة المناسبة، حتى لا ينتشر الضرر أكثر. إزالة التهديد (الاستئصال): إزالة التهديد ومسبباته، مثل حذف البرمجيات الخبيثة ومعالجة الثغرة المستغلة."},{"q":"كيف يتم تقدير درجة الخطر في النموذج المبسط للدرس؟ اذكر معادلته والعاملين الأساسيين المكونين له.","m":"تُقدَّر درجة الخطر بالمعادلة: درجة الخطر = درجة التأثير × درجة الاحتمالية. والعاملان: التأثير، وهو حجم الضرر إذا وقع الحدث، والاحتمالية، وهي مدى احتمال وقوعه."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٤٤","mcq":[{"q":"ما هي المرحلة التي تتضمن إعادة الأنظمة والخدمات إلى حالة تشغيل آمنة وطبيعية وقد تشمل الاستعادة من نسخة احتياطية سليمة؟","o":["التحضير","الاحتواء","الاستعادة","الدروس المستفادة والتحسين"],"c":2},{"q":"أي مرحلة تُختتم بها المراحل الست للاستجابة للحوادث وتتضمن تحليل ما حدث وتوثيق الدروس لتحسين الضوابط؟","o":["الاكتشاف","إزالة التهديد","الاستعادة","الدروس المستفادة والتحسين"],"c":3}],"essay":[{"q":"اشرح المقصود بمرحلتي «الاستعادة» و«الدروس المستفادة والتحسين» في نموذج الاستجابة للحوادث.","m":"الاستعادة: إعادة الأنظمة والخدمات إلى حالة تشغيل آمنة وطبيعية، وقد تشمل الاستعادة من نسخة احتياطية سليمة. الدروس المستفادة والتحسين: المرحلة الأخيرة، يُحلَّل فيها ما حدث وتُوثَّق الدروس وتُحسَّن الضوابط لتقليل احتمال تكرار الحادث وأثره."},{"q":"لماذا يجب تنفيذ مرحلة «الاحتواء» قبل مرحلة «الاستئصال (إزالة التهديد)»؟ ماذا قد يحدث إذا تم عكس هذا الترتيب؟","m":"(1) الاحتواء يعزل الجزء المتأثر ويحدد نطاق التأثير فيمنع انتشار الضرر أكثر؛ وبعد حصر المشكلة تُزال الأسباب بأمان. (2) لو بدأ الاستئصال قبل الاحتواء فقد يستمر الضرر في الانتشار إلى أجزاء أخرى أثناء محاولة الإزالة، وقد تبقى أجزاء متأثرة دون عزل فتتسع الخسائر ويصعب إنهاء الحادث. ولذلك ينص الدرس على منع انتشار الضرر أولاً ثم إزالة السبب."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٤٤","mcq":[{"q":"وفقاً لمصفوفة تقييم المخاطر، ما هي الفئة التي تُعد من أعلى الأولويات ويجب معالجتها أولاً؟","o":["التأثير المنخفض والاحتمالية المنخفضة","التأثير المتوسط والاحتمالية المتوسطة","التأثير المرتفع والاحتمالية المرتفعة","التأثير المنخفض والاحتمالية المرتفعة"],"c":2},{"q":"ما المقصود بمصطلح «التأثير» في سياق تقييم المخاطر؟","o":["مدى احتمال وقوع الحدث","مقدار الضرر إذا وقعت المخاطرة","سرعة الاستجابة للحادث الأمني","عدد المرات التي تكرر فيها الحادث"],"c":1}],"essay":[{"q":"وضح كيف يتم التعامل مع المخاطر وفقاً لـ«مصفوفة تقييم المخاطر»، وأي فئة تمثل أعلى أولويات المعالجة.","m":"في مصفوفة تقييم المخاطر تُقيَّم كل مخاطرة بحسب التأثير (حجم الضرر إذا وقعت) والاحتمالية (مدى احتمال وقوعها)، فتُحدَّد درجتها وتُصنَّف على المصفوفة. وتُعد المخاطر ذات التأثير المرتفع والاحتمالية المرتفعة من أعلى الأولويات فتُعالَج أولاً، أما ترتيب الحالات الأخرى فيعتمد على درجات المصفوفة والسياق والضوابط المتاحة."},{"q":"اذكر أمثلة على التداخل أو التكرار الذي قد يحدث بين مراحل الاستجابة للحوادث في الواقع العملي.","m":"المراحل الست تسلسل عام، لكن الاستجابة الفعلية قد تتداخل فيها الأنشطة أو تتكرر. مثال: قد تكشف مرحلة الاستعادة بقايا للتهديد، فتستلزم العودة إلى الاحتواء أو إزالة التهديد. ومثال آخر: قد تظهر أثناء الاحتواء معلومات جديدة تؤكد الحادث أو تغير تقديره، فتتداخل مع الاكتشاف."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٤٥","mcq":[{"q":"حدث يؤثر في سرية المعلومات أو سلامتها أو توافرها أو يخالف سياسة أمنية يسمى:","o":["حادثاً أمنياً","تقييماً للمخاطر","احتواءً للتهديد","درساً مستفاداً"],"c":0},{"q":"المرحلة التي تُستخدم للحد من انتشار الضرر وعزل الجزء المتأثر تسمى:","o":["التحضير","الاحتواء","الاستعادة","الاستئصال"],"c":1},{"q":"المخاطر التي تمثل أعلى أولوية في مصفوفة تقييم المخاطر هي ذات:","o":["التأثير المنخفض والاحتواء السريع","التأثير المرتفع والاحتمالية المرتفعة","التأثير الصغير والاحتمالية المنخفضة","التأثير المتوسط والاحتمالية المعدومة"],"c":1},{"q":"ماذا تعني مرحلة «الاستئصال» في نموذج الاستجابة للحوادث؟","o":["إنشاء إجراءات استجابة مسبقاً","إزالة التهديد ومسبباته مثل حذف البرمجيات الخبيثة","استعادة الأنظمة من نسخة احتياطية","توثيق الدروس المستفادة"],"c":1}],"essay":[{"q":"عرّف الحادث الأمني بالتفصيل واذكر ثلاثة من أمثلته النموذجية مع بيان وصف كل منها.","m":"الحادث الأمني حدث يؤثر في سرية المعلومات أو سلامتها أو توافرها، أو يهددها بجدية، أو يخالف سياسة أمنية. أمثلته: (1) تسرب المعلومات: خروج معلومات شخصية أو سرية إلى الخارج. (2) التلاعب بالبيانات: تعديل البيانات داخل نظام ما دون تصريح. (3) انقطاع الخدمة: تصبح الخدمة غير متاحة بسبب هجمات على الخادم وغيرها."},{"q":"اذكر المراحل الست للاستجابة للحوادث بترتيبها التسلسلي مع شرح وجيز لمرحلتي التحضير والاحتواء.","m":"الترتيب: (1) التحضير (2) الاكتشاف (3) الاحتواء (4) إزالة التهديد (الاستئصال) (5) الاستعادة (6) الدروس المستفادة والتحسين. التحضير: إنشاء إجراءات وهياكل استجابة مسبقاً استعداداً للحوادث. الاحتواء: تحديد نطاق التأثير بعزل الجزء المتأثر أو تقييد أثره حتى لا ينتشر الضرر أكثر."},{"q":"اشرح كيفية استخدام مصفوفة تقييم المخاطر لتحديد أولويات المعالجة بناءً على التأثير والاحتمالية.","m":"نقدّر لكل مخاطرة التأثير (حجم الضرر إذا وقعت) والاحتمالية (مدى احتمال وقوعها)، ثم نحسب درجة الخطر = التأثير × الاحتمالية ونضعها على المصفوفة. تُعالَج أولاً المخاطر ذات التأثير المرتفع والاحتمالية المرتفعة، لأن الفريق لا يستطيع معالجة كل المخاطر في وقت واحد، ويعتمد ترتيب بقية الحالات على الدرجات والسياق."},{"q":"ناقش سبب أهمية تنفيذ المراحل الست للاستجابة بالترتيب، وما طبيعة التداخل أو التكرار المحتمل بينها أثناء المعالجة الفعلية.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٤٦","mcq":[{"q":"تعديل البيانات داخل نظام ما دون تصريح يُعد مثالاً نموذجياً على:","o":["انقطاع الخدمة","تسرب المعلومات","التلاعب بالبيانات","التحضير المسبق"],"c":2},{"q":"المرحلة التي تُعنى بإعادة الأنظمة والخدمات إلى حالة تشغيل آمنة وطبيعية وتشمل الاستعادة من نسخة احتياطية هي:","o":["الاستعادة","الاحتواء","الاكتشاف","التحضير"],"c":0},{"q":"درجة الخطر في النموذج المبسط تحسب كالتالي:","o":["التأثير ÷ الاحتمالية","التأثير + الاحتمالية","التأثير × الاحتمالية","التأثير - الاحتمالية"],"c":2},{"q":"ماذا يُقصد بمصطلح «الاحتمالية» في تقييم المخاطر؟","o":["حجم الضرر المتوقع إذا وقع الحدث","مدى احتمال وقوع الحدث أو المخاطرة","عدد الأجهزة المتأثرة بالهجوم","سرعة تنفيذ مراحل الاستجابة"],"c":1}],"essay":[{"q":"وضح بالتفصيل الغرض من مرحلتي «الاكتشاف» و«إزالة التهديد (الاستئصال)» ضمن المراحل الست للاستجابة للحوادث.","m":"الاكتشاف: اكتشاف وقوع الحادث وتأكيده بعد التحضير المسبق، ليبدأ التعامل معه. إزالة التهديد (الاستئصال): إزالة التهديد ومسبباته، مثل حذف البرمجيات الخبيثة ومعالجة الثغرة المستغلة، وتأتي بعد الاحتواء."},{"q":"اشرح المقصود بمفهومي «التأثير» و«الاحتمالية» في سياق تقييم المخاطر وكيف يساهمان في حساب درجة الخطر.","m":"التأثير هو حجم الضرر إذا وقع الحدث، والاحتمالية هي مدى احتمال وقوعه. يُقدَّر كل منهما بدرجة، وتُحسب درجة الخطر في النموذج المبسط بالمعادلة: درجة الخطر = درجة التأثير × درجة الاحتمالية."},{"q":"تحدث عن أهمية مرحلة «الدروس المستفادة والتحسين» وكيف تساهم في منع تكرار الحوادث الأمنية مستقبلاً.","m":"هي المرحلة السادسة والأخيرة، يُحلَّل فيها ما حدث وتُوثَّق الدروس وتُحسَّن الضوابط. وتساهم في منع تكرار الحوادث لأنها تكشف أسباب الحادث وأوجه القصور فتُعالَج، فيقل احتمال تكرار الحادث وأثره مستقبلاً."},{"q":"قارن بين أنواع الحوادث الأمنية الثلاثة المذكورة في الدرس (تسرب المعلومات، التلاعب بالبيانات، انقطاع الخدمة) من حيث الوصف.","m":"(1) تسرب المعلومات: خروج المعلومات الشخصية أو السرية إلى الخارج، فيتأثر عنصر السرية. (2) التلاعب بالبيانات: تعديل البيانات داخل نظام ما دون تصريح. (3) انقطاع الخدمة: تصبح الخدمة غير متاحة بسبب هجمات على الخادم وغيرها."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٤٧","mcq":[{"q":"تسرب المعلومات الشخصية أو السرية إلى الخارج يمثل حادثاً أمنياً من نوع:","o":["تسرب المعلومات","انقطاع الخدمة","التلاعب بالبيانات","الاستعادة الآمنة"],"c":0},{"q":"تحليل ما حدث وتوثيق الدروس وتحسين الضوابط لتقليل احتمال التكرار يتم في مرحلة:","o":["التحضير","الاحتواء","الاستئصال","الدروس المستفادة والتحسين"],"c":3},{"q":"المخاطر ذات التأثير المرتفع والاحتمالية المنخفضة في مصفوفة تقييم المخاطر تصنف عادة على أنها ذات خطورة:","o":["مرتفعة جداً","متوسطة","منخفضة جداً","معدومة"],"c":1},{"q":"المرحلة التي تتضمن اكتشاف وتأكيد وقوع حادث أمني بعد التحضير المسبق هي مرحلة:","o":["الاستعادة","الاكتشاف","الدروس المستفادة","الاستئصال"],"c":1}],"essay":[{"q":"اشرح بالتفصيل كيف يتم تنفيذ مرحلتي «الاستعادة» و«الدروس المستفادة والتحسين» عند التعامل مع حادث أمني مثل هجوم ببرمجية فدية.","m":"الاستعادة في هجوم برمجية الفدية: إعادة الأنظمة والخدمات إلى تشغيل آمن وطبيعي، وقد تشمل الاستعادة من نسخة احتياطية سليمة بعد إزالة البرمجية. الدروس المستفادة والتحسين: تحليل كيفية حدوث الهجوم وتوثيق الدروس وتحسين الضوابط لتقليل احتمال تكراره وأثره."},{"q":"ناقش العلاقة بين مرحلتي «الاحتواء» و«الاستئصال» ولماذا يجب أن يسبق الاحتواء عملية إزالة السبب.","m":"الاحتواء يعزل الجزء المتأثر ويمنع انتشار الضرر، ثم يأتي الاستئصال فيزيل التهديد ومسبباته. ويسبقه الاحتواء لأن إزالة السبب قبل حصر الضرر قد تتركه ينتشر إلى أجزاء أخرى، فيصعب إنهاء الحادث."},{"q":"اذكر المراحل الست للاستجابة للحوادث بالتسلسل، وبين كيف يمكن أن تحدث تداخلات أو عودة لمراحل سابقة أثناء الاستجابة الفعلية.","m":"المراحل: التحضير، الاكتشاف، الاحتواء، إزالة التهديد (الاستئصال)، الاستعادة، الدروس المستفادة والتحسين. وهي تسلسل عام قد تتداخل أنشطته؛ فمثلاً قد تكشف الاستعادة بقايا للتهديد فيُعاد إلى الاحتواء أو إزالة التهديد."},{"q":"اشرح كيف تستخدم المؤسسات مصفوفة تقييم المخاطر لتصنيف المخاطر وتوجيه الجهود نحو المعالجة الأولوية الفعالة.","m":"تُقدِّر المؤسسة لكل مخاطرة تأثيرها (حجم الضرر) واحتماليتها، وتحسب الدرجة = التأثير × الاحتمالية، ثم تضعها في المصفوفة لتصنيفها. تُعد ذات التأثير المرتفع والاحتمالية المرتفعة من أعلى الأولويات فتُعالَج أولاً، أما الحالات الأخرى فيعتمد ترتيبها على درجات المصفوفة والسياق والضوابط المتاحة. وبذلك تُوجَّه الجهود نحو الأخطر، لأن الفريق لا يعالج كل المخاطر معاً."}]}],"3-1":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٤٨","mcq":[{"q":"يُبنى عادةً تطبيق الويب من:","o":["ثلاث طبقات","طبقتين","طبقة واحدة","عدة طبقات"],"c":0},{"q":"الطبقة المسؤولة عن عرض الشاشات وتجميع بيانات وإجراءات المستخدم هي:","o":["الواجهة الخلفية","قاعدة البيانات","الواجهة الأمامية","خادم المعالجة"],"c":2}],"essay":[{"q":"عرّف تطبيق الويب.","m":"تطبيق الويب تطبيق يُستخدم عادةً من خلال متصفح الويب، وقد يكون بعضه قابلاً للتثبيت على الجهاز. من أمثلته خدمات الفيديو والتسوق والبريد والخرائط على الويب."},{"q":"عدّد الطبقات الرئيسة التي يتكون منها تطبيق الويب.","m":"يتكون تطبيق الويب عادةً من ثلاث طبقات رئيسة: (1) الواجهة الأمامية، وهي ما يراه المستخدم ويتفاعل معه (العرض). (2) الواجهة الخلفية، وهي الجزء الذي يعمل على الخادم (المعالجة). (3) قاعدة البيانات (طبقة البيانات)، وهي التي تخزن البيانات وتوفرها."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٤٨–٤٩","mcq":[{"q":"في موقع مشاركة الفيديو، تتبع عملية تجميع عدد المشاهدات واختيار الفيديوهات الموصى بها لـ:","o":["الواجهة الأمامية","الواجهة الخلفية","قاعدة البيانات","شبكة الاتصال"],"c":1},{"q":"تخزين بيانات المنشورات وعلاقات المتابعة والرسائل في شبكة تواصل اجتماعي هو وظيفة:","o":["خادم المعالجة","قاعدة البيانات","الواجهة الأمامية","الواجهة الخلفية"],"c":1}],"essay":[{"q":"قارن بين دور الواجهة الأمامية ودور الواجهة الخلفية في تطبيق شبكة التواصل الاجتماعي.","m":"في شبكة التواصل الاجتماعي: الواجهة الأمامية هي الجزء الذي يتفاعل معه المستخدم في المتصفح، فتعرض الخط الزمني وشاشات النشر وتجمع ما يكتبه المستخدم وإجراءاته. أما الواجهة الخلفية فتعمل على الخادم وتعالج الطلبات، فتحدد الجمهور المستهدف للمنشورات وتتحكم في الإشعارات الفورية. فالأمامية للعرض والإدخال، والخلفية للمعالجة والقرار."},{"q":"كيف تتعامل الواجهة الخلفية مع البيانات الواردة من الواجهة الأمامية والبيانات المخزنة في قاعدة البيانات في موقع للتجارة الإلكترونية؟","m":"تستقبل الواجهة الخلفية على الخادم الطلبات الواردة من الواجهة الأمامية، مثل البحث أو إجراء طلب شراء. فتطلب من قاعدة البيانات المعلومات اللازمة كبيانات المنتجات والعملاء وسجل الطلبات، وتحفظ فيها البيانات الجديدة كالطلب الجديد. كما تتحقق من الطلب (ومن المخزون) وترسل طلبات الدفع وتتعامل مع نتائجها، ثم تجهز النتائج وترسلها إلى الواجهة الأمامية لتعرضها للمستخدم."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٤٩","mcq":[{"q":"إرسال طلبات الدفع والتعامل مع نتائجها في موقع التجارة الإلكترونية هو عمل مشترك بين المعالجة والتحكم في:","o":["الواجهة الأمامية","قاعدة البيانات","الواجهة الخلفية","متصفح المستخدم"],"c":2},{"q":"الدور الرئيس لطبقة قاعدة البيانات في تطبيقات الويب هو:","o":["استقبال إجراءات المستخدم","تخزين البيانات واسترجاعها","معالجة العمليات الحسابية","عرض الشاشات والواجهات"],"c":1}],"essay":[{"q":"صمّم مخططاً هيكلياً يوضح كيف تتعاون الطبقات الثلاث لتنفيذ إجراءات المستخدم.","h":1},{"q":"ناقش أهمية طبقة قاعدة البيانات في مواقع التجارة الإلكترونية.","h":1}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٤٩–٥٠","mcq":[{"q":"في موقع مشاركة الفيديو، يتم تخزين سجل المشاهدات ومعلومات المستخدمين في:","o":["شاشات البحث","الواجهة الخلفية","الواجهة الأمامية","طبقة قاعدة البيانات"],"c":3},{"q":"التحكم في الإشعارات الفورية وتحديد الجمهور المستهدف للمنشورات يتم عبر:","o":["الواجهة الخلفية","الواجهة الأمامية","قاعدة البيانات","الخط الزمني"],"c":0}],"essay":[{"q":"اشرح البنية العامة لتطبيقات الويب والطبقات الثلاث.","m":"يُبنى تطبيق الويب من ثلاث طبقات تتعاون لتحويل إجراء المستخدم إلى نتيجة: الواجهة الأمامية تعرض الشاشات وتجمع إدخال المستخدم، والواجهة الخلفية تعالج الطلبات على الخادم، وقاعدة البيانات تخزن البيانات وتوفرها."},{"q":"وضح كيف تتكامل الطبقات الثلاث في تقديم خدمة «مشاركة الفيديو» مع ذكر مثال لوظيفة كل طبقة.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٥٠–٥١","mcq":[{"q":"أي مما يأتي يمثل دور الواجهة الأمامية في تطبيق الويب؟","o":["معالجة الطلبات","عرض المحتوى واستقبال إدخال المستخدم","تخزين البيانات","التحقق من تسجيل الدخول"],"c":1},{"q":"عند البحث عن منتج في متجر إلكتروني، أي طبقة تُرسل الطلب إلى قاعدة البيانات؟","o":["الواجهة الأمامية","الواجهة الخلفية","قاعدة البيانات نفسها","المتصفح"],"c":1},{"q":"أي من التالي يُعتبر مثالاً على البيانات المخزنة في قاعدة بيانات موقع تجارة إلكترونية؟","o":["شاشة البحث","سجل الطلبات","التحقق من تسجيل الدخول","واجهة المستخدم"],"c":1},{"q":"الفكرة الرئيسة للبنية العامة لتطبيقات الويب هي:","o":["بناء التطبيق من طبقة واحدة فقط","تعاون ثلاث طبقات: واجهة أمامية، واجهة خلفية، قاعدة بيانات","استخدام المتصفح فقط","الاعتماد على الواجهة الخلفية دون قاعدة بيانات"],"c":1}],"essay":[{"q":"وضّح الفرق بين الواجهة الأمامية والواجهة الخلفية في تطبيقات الويب مع ذكر مثال لكل منهما.","m":"الواجهة الأمامية هي ما يراه المستخدم ويتفاعل معه في المتصفح؛ تعرض المحتوى وتستقبل الإدخال، مثل شاشة البحث. الواجهة الخلفية هي الجزء الذي يعمل على الخادم لا على المتصفح؛ تعالج الطلبات، مثل التحقق من تسجيل الدخول."},{"q":"اشرح دور قاعدة البيانات في تطبيق ويب، وكيف تتعاون مع الواجهة الخلفية لإظهار النتائج للمستخدم.","m":"قاعدة البيانات هي طبقة البيانات، تخزن السجلات وتوفرها للتطبيق. وتتعاون مع الواجهة الخلفية كما يلي: تطلب الخلفية من القاعدة البيانات المطلوبة، فتعيد القاعدة النتائج المطابقة، ثم تجهزها الخلفية وترسلها إلى الواجهة الأمامية، فتعرضها على شاشة المستخدم."},{"q":"تتبع خطوات تدفق طلب البحث عن منتج في متجر إلكتروني عبر الطبقات الثلاث، وبيّن دور كل طبقة.","h":1},{"q":"صمّم توزيعاً مناسباً لمسؤوليات تطبيق ويب للتجارة الإلكترونية، وبرّر قراراتك.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٥١","mcq":[{"q":"أي من التالي يُعتبر مثالاً على تطبيق ويب؟","o":["برنامج تشغيل فيديو على الجهاز","موقع خرائط على الإنترنت","تطبيق حاسبة على سطح المكتب","برنامج تحرير الصور"],"c":1},{"q":"في موقع مشاركة الفيديو، أي طبقة تخزن بيانات الفيديو والمستخدمين؟","o":["الواجهة الأمامية","الواجهة الخلفية","قاعدة البيانات","المتصفح"],"c":2},{"q":"أي من التالي يمثل وظيفة الواجهة الخلفية في تطبيق ويب؟","o":["عرض صفحات المنتجات","عرض مربع البحث للمستخدم","التحقق من تسجيل الدخول","تخزين سجل الطلبات"],"c":2},{"q":"الفكرة الرئيسة للبنية العامة لتطبيقات الويب هي:","o":["أن التطبيق يُبنى من ثلاث طبقات تتعاون معاً","أن كل طبقة تعمل منفردة دون تعاون","أن التطبيق يعمل من خلال المتصفح فقط","أن التطبيق يعتمد فقط على قاعدة البيانات"],"c":0}],"essay":[{"q":"اشرح مفهوم تطبيق الويب مع ذكر أمثلة من حياتك اليومية.","m":"تطبيق الويب هو تطبيق يُستخدم عادةً من خلال متصفح الويب، وقد يكون بعضه قابلاً للتثبيت على الجهاز. ومن أمثلته في حياتي اليومية: خدمات الفيديو، والتسوق عبر الإنترنت، والبريد الإلكتروني على الويب، والخرائط على الويب."},{"q":"ناقش أهمية تقسيم تطبيق الويب إلى ثلاث طبقات رئيسة.","m":"يُقسَّم تطبيق الويب إلى واجهة أمامية للعرض والتفاعل، وواجهة خلفية للمعالجة، وطبقة بيانات للتخزين. وتكمن أهمية ذلك في أن كل طبقة لها دور واضح، فيسهل توزيع المهام وتطوير كل جزء وصيانته وتحديثه دون التأثير الكبير في الأجزاء الأخرى. وهذا نموذج تعليمي مبسط، وقد تختلف البنية الفعلية من تطبيق إلى آخر."},{"q":"بيّن كيف تتعاون الطبقات الثلاث عند استخدام شبكة التواصل الاجتماعي.","m":"عند نشر منشور أو الإعجاب بمنشور: (1) تستقبل الواجهة الأمامية ما يكتبه المستخدم أو ضغطه على زر الإعجاب. (2) ترسل الطلب إلى الواجهة الخلفية فتعالجه وتتحقق منه. (3) تطلب الواجهة الخلفية من قاعدة البيانات حفظ المنشور أو استرجاع البيانات. (4) تعيد قاعدة البيانات النتيجة إلى الواجهة الخلفية، فتجهزها وترسلها إلى الواجهة الأمامية لتعرضها للمستخدم."},{"q":"حلّل دور الواجهة الخلفية في موقع تجارة إلكترونية.","h":1}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٥١–٥٢","mcq":[{"q":"الفكرة الرئيسة للبنية العامة لتطبيقات الويب هي:","o":["أن كل طبقة تعمل منفردة دون تعاون","أن التطبيق يعتمد فقط على قاعدة البيانات","أن التطبيق يعمل من خلال المتصفح فقط","أن التطبيق يُبنى من ثلاث طبقات تتعاون معاً"],"c":3},{"q":"في موقع مشاركة الفيديو، أي طبقة تخزن بيانات الفيديو والمستخدمين؟","o":["الواجهة الأمامية","الواجهة الخلفية","قاعدة البيانات","المتصفح"],"c":2},{"q":"أي من التالي يُعتبر مثالاً على تطبيق ويب؟","o":["برنامج تشغيل فيديو على الجهاز","موقع خرائط على الإنترنت","تطبيق حاسبة على سطح المكتب","برنامج تحرير الصور"],"c":1},{"q":"أي من التالي يمثل وظيفة الواجهة الخلفية في تطبيق ويب؟","o":["عرض صفحات المنتجات","عرض مربع البحث للمستخدم","تخزين سجل الطلبات","التحقق من تسجيل الدخول"],"c":3}],"essay":[{"q":"ما دور الواجهة الأمامية في موقع فيديو؟","m":"الواجهة الأمامية هي الجزء الذي يراه المستخدم ويتعامل معه في المتصفح. ففي موقع الفيديو تعرض شاشة البحث وصفحات الفيديوهات وأزرار التشغيل، وتستقبل ما يكتبه المستخدم أو يختاره، ثم تعرض له النتائج التي تصلها من الواجهة الخلفية."},{"q":"ما دور قاعدة البيانات في شبكة التواصل الاجتماعي؟","m":"قاعدة البيانات هي الطبقة التي تحفظ البيانات وتوفرها عند الحاجة. ففي شبكة التواصل الاجتماعي تخزن معلومات المستخدمين والمنشورات والتعليقات والإعجابات، وتسترجعها وتعيدها إلى الواجهة الخلفية عندما تطلبها، لتُعرض بعد ذلك للمستخدم."},{"q":"حدد خطوات التعاون عند إرسال بريد إلكتروني.","m":"(1) يكتب المستخدم الرسالة ويضغط إرسال في الواجهة الأمامية. (2) ترسل الواجهة الأمامية الرسالة إلى الواجهة الخلفية. (3) تعالج الواجهة الخلفية الطلب وتتحقق منه، وتطلب من طبقة البيانات حفظ الرسالة. (4) تحفظ طبقة البيانات الرسالة وتعيد النتيجة إلى الواجهة الخلفية. (5) تعيد الواجهة الخلفية الاستجابة، فتعرض الواجهة الأمامية تأكيد الإرسال، وتظهر الرسالة للمستلم عند فتح بريده."},{"q":"ما أهمية وجود طبقة خلفية قوية في التجارة الإلكترونية؟","m":"تعالج الطبقة الخلفية في التجارة الإلكترونية الطلبات وتتحقق من تسجيل الدخول وتتعامل مع الدفع وتطلب البيانات من قاعدة البيانات. وعندما تكون قوية تعمل بسرعة وكفاءة، وتحمي بيانات العملاء وتحافظ على سلامتها، وتخدم عدداً كبيراً من المستخدمين دون أعطال أو أخطاء في الطلبات والدفع. وينعكس ذلك على تجربة المستخدم وعلى ثقته بالمتجر وفي استمرار المبيعات."}]}],"3-2":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٥٣","mcq":[{"q":"العميل في تطبيقات الويب هو:","o":["الخادم الذي يعالج الطلبات.","البرنامج أو الجهاز الذي يرسل الطلبات.","قاعدة البيانات.","بروتوكول الاتصال."],"c":1},{"q":"عند إرسال بيانات تسجيل الدخول يُفضل استخدام:","o":["GET","POST","200","404"],"c":1}],"essay":[{"q":"وضح ما هو نموذج العميل (client) والخادم (server).","m":"العميل (client) برنامج أو جهاز يرسل طلباً للحصول على بيانات أو معالجة، ومن أمثلته متصفح الويب وتطبيق الهاتف. والخادم (server) هو الجانب الذي يستقبل الطلبات من العملاء ويعالجها ويعيد الاستجابات. وفي هذا النموذج يرسل العميل طلباً ثم يعيد الخادم استجابة تتضمن النتيجة، فيتبادلان الطلب والاستجابة عبر الشبكة، وتقوم عليه كثير من تطبيقات الويب."},{"q":"صمم رسماً تخطيطياً توضح فيه كيفية التواصل بين العميل والخادم.","h":1}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٥٣","mcq":[{"q":"رمز الحالة 200 يعني:","o":["خطأ داخلي في الخادم.","نجاح الطلب.","المورد غير موجود.","طلب غير مصرح به."],"c":1},{"q":"رمز الحالة 404 يشير إلى:","o":["نجاح الطلب.","خطأ داخلي في الخادم.","المورد غير موجود.","الاتصال آمن."],"c":2}],"essay":[{"q":"لماذا يُعتبر بروتوكول HTTPS أكثر أماناً من HTTP؟ أعط مثالاً.","m":"لأن HTTPS هو استخدام HTTP عبر اتصال TLS آمن، فيساعد على حماية سرية الاتصال وسلامته وعلى مصادقة الخادم، بحيث لا يستطيع المتجسس قراءة المحتوى أو تعديله بسهولة أثناء النقل. أما HTTP العادي فلا يوفر هذه الحماية. مثال: عند إدخال اسم المستخدم وكلمة المرور في صفحة تسجيل الدخول يحميهما HTTPS أثناء انتقالهما من المتصفح إلى الخادم."},{"q":"وضح الفرق بين طلب GET وطلب POST مع مثال لكل منهما.","m":"الفرق في نوع العملية المطلوبة. يُستخدم GET عادة لطلب مورد أو بيانات من الخادم، مثل عرض صفحة ويب أو استرجاع نتائج البحث. ويُستخدم POST عادة لإرسال بيانات ليعالجها الخادم، مثل إرسال معلومات تسجيل الدخول أو محتويات نموذج."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٥٤","mcq":[{"q":"الفرق الأساسي بين HTTP وHTTPS هو:","o":["HTTPS يستخدم تشفير TLS.","HTTP أسرع دائماً.","HTTPS لا يدعم POST.","HTTP يستخدم JSON."],"c":0},{"q":"صيغة JSON تُستخدم في:","o":["تصميم واجهة المستخدم.","تبادل البيانات المهيكلة.","تشفير الاتصال.","تحديد رمز الحالة."],"c":1}],"essay":[{"q":"فسر معنى رمز الحالة 200 في HTTP.","m":"رمز الحالة 200 يعني نجاح الطلب، أي أن الخادم عالج الطلب بنجاح وأعاد الاستجابة المطلوبة إلى العميل."},{"q":"ماذا يعني رمز الحالة 404؟ ومتى يظهر؟","m":"يعني رمز الحالة 404 أن المورد المطلوب غير موجود بهذا العنوان. ويظهر عندما يطلب العميل صفحة أو مورداً لا وجود له على الخادم، كأن يكتب عنوان الصفحة خطأً أو يطلب رابطاً لم يعد متاحاً."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٥٤","mcq":[{"q":"الـ API هو:","o":["قاعدة بيانات.","مجموعة قواعد للتواصل بين البرامج.","بروتوكول أمني.","صيغة بيانات."],"c":1},{"q":"عند عرض نتائج البحث من الخادم يُستخدم عادة:","o":["POST","GET","500","HTTPS"],"c":1}],"essay":[{"q":"ما دور رمز الحالة 500 في الاتصال بين العميل والخادم؟","m":"رمز الحالة 500 جزء من الاستجابة التي يرسلها الخادم، ويبلغ العميل بوجود خطأ داخلي في الخادم منعه من إكمال الطلب. ولا يحدد الرمز وحده السبب التفصيلي للخطأ."},{"q":"ما هو الـ API؟ وكيف يساعد في تطوير تطبيقات الويب؟","m":"واجهة برمجة التطبيقات (API) هي مجموعة قواعد واضحة تسمح لبرنامج بطلب بيانات أو وظائف من برنامج آخر. وتساعد في تطوير تطبيقات الويب لأن الواجهة الأمامية قد ترسل طلبات إلى خدمة خلفية عبر API وتستقبل منها البيانات، وغالباً بصيغة JSON، فيستطيع المطور ربط أجزاء التطبيق ببعضها وإعادة استخدام الخدمات دون معرفة تفاصيل عمل كل منها."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٥٥","mcq":[{"q":"أي من التالي يمثل دور العميل (Client) في تطبيق ويب؟","o":["معالجة الطلبات على الخادم.","إرسال الطلبات للحصول على البيانات.","تخزين البيانات في قاعدة البيانات.","تحديد الجمهور المستهدف للمنشورات."],"c":1},{"q":"أي من التالي يُستخدم عادةً لطلب مورد أو بيانات من الخادم؟","o":["POST","GET","API","JSON"],"c":1},{"q":"أي من التالي يُعتبر صيغة شائعة لتبادل البيانات بين التطبيقات؟","o":["HTML","JSON","CSS","SQL"],"c":1},{"q":"رمز الحالة 404 يعني:","o":["نجاح الطلب.","خطأ داخلي في الخادم.","المورد المطلوب غير موجود.","الطلب لم يُرسل."],"c":2}],"essay":[{"q":"اشرح نموذج العميل والخادم.","m":"نموذج العميل والخادم هو أساس الاتصال في كثير من تطبيقات الويب. العميل برنامج أو جهاز، مثل متصفح الويب، يرسل طلباً للحصول على بيانات أو معالجة، والخادم يستقبل الطلبات ويعالجها ويعيد استجابات إلى العميل. فالتواصل بينهما تبادل منظم: يطلب العميل ويستجيب الخادم عبر الشبكة."},{"q":"لماذا يجب استخدام HTTPS في صفحة تسجيل الدخول؟","m":"لأن صفحة تسجيل الدخول تنقل بيانات حساسة مثل كلمة المرور. ويستخدم HTTPS اتصال TLS آمناً يحمي سرية البيانات وسلامتها ويصادق الخادم، فلا يستطيع المتجسس قراءتها أو تعديلها بسهولة أثناء النقل. أما HTTP العادي فلا يوفر هذه الحماية."},{"q":"ما دور الـ API في تطبيقات الويب؟","m":"الـ API مجموعة قواعد واضحة تسمح لبرنامج بطلب بيانات أو وظائف من برنامج آخر. ففي تطبيقات الويب قد ترسل الواجهة الأمامية طلبات إلى خدمة خلفية عبر API وتستقبل منها البيانات، وغالباً بصيغة JSON، فتتبادل أجزاء التطبيق أو التطبيقات المختلفة البيانات بطريقة منظمة."},{"q":"فسر رمز الحالة 200.","m":"رمز الحالة 200 رقم يرسله الخادم في استجابته إلى العميل ليبين نتيجة معالجة الطلب، ومعناه نجاح الطلب، أي أن الخادم عالجه بنجاح. مثال: عندما يطلب المتصفح صفحة موجودة فيعيدها الخادم يرافقها الرمز 200. ويختلف عن الرمز 404 الذي يعني أن المورد المطلوب غير موجود بهذا العنوان، وعن الرمز 500 الذي يعني خطأً داخلياً في الخادم منعه من إكمال الطلب."}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٥٦","mcq":[{"q":"أي من رموز الحالة التالية يشير إلى نجاح الطلب؟","o":["200","404","500","302"],"c":0},{"q":"أي من التالي يُستخدم عادةً لإرسال بيانات النموذج إلى الخادم؟","o":["GET","POST","API","JSON"],"c":1},{"q":"ما الواجهة التي تسمح للتطبيقات بالتواصل وتبادل البيانات؟","o":["HTML","API","CSS","SQL"],"c":1},{"q":"اختر ما يُعتبر مثالاً على صيغة بيانات تُستخدم في تبادل المعلومات بين التطبيقات.","o":["XML","JSON","PHP","Java"],"c":1}],"essay":[{"q":"اشرح لماذا يُعتبر نموذج الطلب والاستجابة أساسياً في تطبيقات الويب، مع ذكر مثال عميل.","m":"يُعد نموذج الطلب والاستجابة أساسياً لأن كثيراً من تطبيقات الويب تعتمد على أن يرسل العميل طلباً فيعيد الخادم استجابة، فيصبح التواصل تبادلاً منظماً محدد الخطوات. مثال: يكتب المستخدم عنوان صفحة في المتصفح (وهو العميل)، فيرسل المتصفح طلب GET إلى الخادم، فيعيد الخادم الصفحة مع رمز الحالة 200 ويعرضها المتصفح."},{"q":"ميز بين استخدام طريقة GET وطريقة POST، وحدد مواقف مناسبة لكل منهما.","m":"تُستخدم GET عادةً لطلب مورد أو بيانات من الخادم، ومن مواقفها المناسبة عرض صفحة ويب واسترجاع نتائج البحث. وتُستخدم POST عادةً لإرسال بيانات ليعالجها الخادم، ومن مواقفها المناسبة إرسال معلومات تسجيل الدخول وإرسال محتويات نموذج."},{"q":"اشرح أهمية بروتوكول HTTPS في حماية البيانات أثناء النقل عبر الشبكة.","m":"أهمية HTTPS أنه يستخدم HTTP عبر اتصال TLS آمن، فيحمي سرية الاتصال وسلامته ويصادق الخادم. وبذلك لا يستطيع المتجسس قراءة البيانات المنقولة عبر الشبكة أو تعديلها بسهولة، مثل كلمات المرور وبيانات النماذج. وهذا يجعله مناسباً للصفحات التي تنقل بيانات حساسة، كصفحة تسجيل الدخول."},{"q":"صمم طريقة اتصال مناسبة لمهمة في تطبيق ويب (مثل تسجيل مستخدم جديد).","h":1}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٥٦","mcq":[{"q":"أي من رموز الحالة التالية يشير إلى خطأ داخلي في الخادم؟","o":["200","404","500","302"],"c":2},{"q":"أحد هذه الأمور يُستخدم عادةً لطلب صفحة ويب أو نتائج بحث.","o":["POST","GET","API","JSON"],"c":1},{"q":"ما الصيغة النصية التي تُستخدم لتمثيل البيانات المهيكلة باستخدام كائنات ومصفوفات؟","o":["HTML","JSON","CSS","SQL"],"c":1},{"q":"أي من التالي يُستخدم لتأمين الاتصال بين العميل والخادم ومنع التجسس؟","o":["HTTP","HTTPS","API","JSON"],"c":1}],"essay":[{"q":"اشرح كيف يتعامل الخادم مع الطلبات الواردة من العميل، وما الذي يحدث إذا كان الطلب غير صحيح أو غير موجود.","m":"يستقبل الخادم الطلب من العميل ويعالجه ثم يعيد استجابة تتضمن رمز حالة يبين النتيجة. فإذا نجحت المعالجة أعاد الرمز 200. وإذا كان المورد المطلوب غير موجود بهذا العنوان أعاد الرمز 404. وإذا وقع خطأ داخلي في الخادم منعه من إكمال الطلب أعاد الرمز 500، ولا يحدد هذا الرمز وحده السبب التفصيلي."},{"q":"فسر دور واجهات برمجة التطبيقات (API) في ربط تطبيقات مختلفة، مع مثال عملي.","m":"تسمح API لبرنامج بطلب بيانات أو وظائف من برنامج آخر وفق قواعد واضحة، فتربط بين أجزاء التطبيقات والتطبيقات المختلفة وتتيح لها تبادل البيانات. مثال: قد ترسل الواجهة الأمامية لتطبيق عرض المنتجات طلباً إلى خدمة خلفية عبر API وتستقبل منها قائمة المنتجات، وغالباً بصيغة JSON، ثم تعرضها للمستخدم."},{"q":"اشرح كيف تُستخدم صيغة JSON في تبادل البيانات، ولماذا تُعتبر مناسبة لتطبيقات الويب.","m":"JSON (JavaScript Object Notation) صيغة نصية شائعة لتمثيل البيانات المهيكلة وتبادلها باستخدام كائنات ومصفوفات وقيم بسيطة، فقد تعيد API البيانات بهذه الصيغة إلى الواجهة الأمامية. وهي مناسبة لتطبيقات الويب لأنها نصية وواضحة الهيكل (مفتاح وقيمة)، وتدعمها لغات وأدوات برمجية كثيرة."},{"q":"اقترح سيناريو لتطبيق ويب يحتاج إلى استخدام طريقة POST، ووضح سبب اختيارك لها.","h":1}]}],"3-3":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٥٨","mcq":[{"q":"لغة HTML مسؤولة عن:","o":["المظهر البصري","الهيكل الأساسي للصفحة","السلوك التفاعلي","تحسين الأداء"],"c":1},{"q":"أي مما يلي ليس من عناصر صفحة الويب الدلالية (Semantic HTML)؟","o":["<header>","<E-mail>","<main>","<footer>"],"c":1}],"essay":[{"q":"اشرح دور كل من HTML وCSS وJavaScript في بناء صفحة الويب.","m":"تتكامل التقنيات الثلاث في بناء الصفحة. يبني HTML بنية الصفحة وهيكلها، كالعناوين والفقرات والأقسام. وينسّق CSS مظهرها، كالألوان والخطوط والتخطيط. وتجعلها JavaScript تفاعلية وتضيف إليها السلوك."},{"q":"لماذا تُعد لغة HTML الدلالية مهمة في بناء صفحات الويب؟","m":"HTML الدلالي هو استخدام عناصر توضح وظيفة أجزاء الصفحة، مثل header في أعلى الصفحة، وnav للتنقل، وmain للمحتوى الرئيسي، وfooter في أسفلها. وأهميته أنه يساعد قارئ الشاشة على فهم بنية الصفحة والتنقل فيها، وقد يساعد محركات البحث على فهم بنية المحتوى بصورة أفضل دون أن يضمن ترتيباً أعلى. كما يجعل بناء الصفحة ذا معنى، وأوضح للمطور عند تنظيمها."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٥٨","mcq":[{"q":"لغة CSS تُستخدم في:","o":["بناء الهيكل","إضافة التفاعل","تنسيق المظهر","إدارة قواعد البيانات"],"c":2},{"q":"لغة JavaScript تضيف:","o":["العناوين والفقرات","الألوان والخطوط","السلوك التفاعلي","عناصر دلالية"],"c":2}],"essay":[{"q":"وضّح كيف يساعد التصميم المتجاوب في تحسين تجربة المستخدم.","m":"التصميم المتجاوب مفهوم يُضبط فيه التخطيط تلقائياً وفق أحجام الشاشات المختلفة، مثل الحواسيب والهواتف الذكية والأجهزة اللوحية. وبذلك تتكيف الصفحة مع الشاشة التي يستخدمها الشخص وتصبح أسهل في القراءة والاستخدام، فتتحسن تجربة المستخدم، خاصة أن كثيراً من الناس يستخدمون الويب عبر الهواتف."},{"q":"وضّح ما الفائدة من استخدام إطار عمل (Framework) في تطوير الواجهة الأمامية.","m":"إطار العمل (Framework) بنية توفر مسبقاً وظائف ومكونات شائعة الاستخدام لجعل تطوير تطبيقات الويب أكثر كفاءة. وعند استخدامه لا يحتاج المطورون إلى كتابة كامل الكود من الصفر، فيقللون العمل المتكرر ويبنون الواجهة من مكونات قابلة لإعادة الاستخدام، ويطورون بكفاءة أكبر."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٥٩","mcq":[{"q":"عنصر <header> في HTML الدلالية يُستخدم لـ:","o":["المحتوى الرئيسي","التنقل","رأس الصفحة","أسفل الصفحة"],"c":2},{"q":"التصميم المتجاوب يعني:","o":["ضبط التخطيط وفقاً لأحجام الشاشات المختلفة","استخدام JavaScript فقط","تحسين قواعد البيانات","إخفاء المحتوى غير المهم"],"c":0}],"essay":[{"q":"أعطِ مثالاً على عنصر HTML دلالي واكتب وظيفته.","m":"مثال: عنصر <header>، وهو عنصر HTML دلالي يمثل رأس الصفحة، أي الجزء العلوي منها الذي يحتوي عادةً على العنوان أو الشعار، ويوضح لقارئ الشاشة ولمحركات البحث وظيفة هذا الجزء."},{"q":"ناقش كيف تسهم CSS في تحسين المظهر البصري للصفحة.","m":"CSS تقنية تنسّق مظهر الصفحة، فهي تحدد الألوان والخطوط والمسافات وتخطيط عناصر الصفحة، فتجعل الصفحة منظمة وجذابة وسهلة القراءة. كما تساعد، مع التصميم المتجاوب، على تكيف الصفحة مع أحجام الشاشات المختلفة. أما HTML فيحدد البنية فقط، لذلك يظهر المحتوى بتنسيق أفضل عند إضافة CSS."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٥٩","mcq":[{"q":"إطار العمل React يُستخدم لـ:","o":["بناء واجهات المستخدم بمكونات قابلة لإعادة الاستخدام","إدارة قواعد البيانات","تشفير الاتصال","تحسين الأداء فقط"],"c":0},{"q":"إطار العمل Next.js مبني على:","o":["Vue","React","CSS","HTML"],"c":1}],"essay":[{"q":"ما الفرق بين مكتبة React وإطار Next.js؟","m":"React مكتبة JavaScript لبناء واجهات المستخدم من مكونات قابلة لإعادة الاستخدام وتحديثها عند تغير البيانات. أما Next.js فهو إطار عمل مبني على React لبناء تطبيقات ويب، ويوفر التوجيه وطرقاً مختلفة لعرض الصفحات والعمل على الخادم والعميل."},{"q":"لماذا يُعتبر نهج الأولوية للجوال مهماً في التصميم المتجاوب؟","m":"يهتم المطورون بالشاشات الصغيرة منذ بداية التصميم لأن كثيراً من الناس يستخدمون الويب عبر الهواتف، ويسمى ذلك نهج الأولوية للجوال. وأهميته أن الصفحة تُصمم أولاً لتناسب الشاشة الصغيرة ثم تتكيف مع الشاشات الأكبر، فتبقى سهلة القراءة والاستخدام على مختلف الأجهزة وتتحسن تجربة الاستخدام عموماً."}]},{"n":"التقييم الأسبوعي — النموذج (A)","k":"exam","p":"ص٦٠","mcq":[{"q":"أي مما يلي يُستخدم لتحديد المظهر والتنسيق في صفحة الويب؟","o":["HTML","CSS","JavaScript","JSON"],"c":1},{"q":"أي من عناصر HTML التالية يُستخدم لتحديد القسم الرئيسي للمحتوى؟","o":["<header>","<footer>","<main>","<nav>"],"c":2},{"q":"التصميم المتجاوب يعني:","o":["جعل الصفحة تعمل فقط على أجهزة الكمبيوتر","ضبط التخطيط تلقائياً وفقاً لأحجام الشاشات المختلفة","استخدام JavaScript لإضافة تفاعلية","تحسين سرعة الخادم"],"c":1},{"q":"أي مما يلي يُعتبر مكتبة JavaScript لبناء واجهات المستخدم؟","o":["React","HTML","CSS","SQL"],"c":0}],"essay":[{"q":"ناقش دور HTML في بناء صفحة الويب.","m":"HTML هي التقنية التي تحدد بنية صفحة الويب وهيكلها، فيُستخدم لبناء العناوين والفقرات والأقسام والمحتوى. وبدونه لا يوجد محتوى منظم تُبنى عليه CSS وJavaScript، لذلك يُعد الأساس الذي تقوم عليه الصفحة."},{"q":"وضّح كيف تساعد CSS في تحسين المظهر.","m":"تنسّق CSS مظهر الصفحة، فتحدد الألوان والخطوط والمسافات والتخطيط. وبذلك يتحول المحتوى الذي بناه HTML إلى صفحة منظمة وجذابة وسهلة القراءة، ويمكن استخدامها لجعل التخطيط يتكيف مع الشاشات المختلفة."},{"q":"ما هو التصميم المتجاوب؟","m":"التصميم المتجاوب مفهوم تصميمي يُضبط فيه تخطيط الصفحة تلقائياً وفق أحجام الشاشات المختلفة، مثل أجهزة الكمبيوتر والهواتف الذكية والأجهزة اللوحية، لتتكيف الصفحة وتصبح أسهل في الاستخدام."},{"q":"ما فائدة استخدام إطار عمل؟","m":"يوفر إطار العمل مسبقاً وظائف ومكونات شائعة الاستخدام، فلا يحتاج المطور إلى كتابة كامل الكود من الصفر. وبذلك يقل العمل المتكرر وتصبح عملية التطوير أكثر كفاءة، ويمكن بناء الواجهة من مكونات قابلة لإعادة الاستخدام."}]},{"n":"التقييم الأسبوعي — النموذج (B)","k":"exam","p":"ص٦٠","mcq":[{"q":"أي من التقنيات التالية تُستخدم لبناء الهيكل الأساسي للصفحة؟","o":["CSS","HTML","JavaScript","SQL"],"c":1},{"q":"العنصر <nav> في HTML يُستخدم لـ:","o":["عرض المحتوى الرئيسي","التنقل بين أجزاء الموقع","عرض العنوان الرئيسي","عرض التذييل"],"c":1},{"q":"ميزة التصميم المتجاوب الأساسية هي:","o":["تحسين سرعة الخادم","التكيف مع مختلف أحجام الشاشات","إضافة تفاعلية باستخدام JavaScript","تحسين محركات البحث"],"c":1},{"q":"يُعتبر إطار عمل مبنياً على React ويوفر التوجيه وطرق عرض الصفحات:","o":["Next.js","Vue","HTML","CSS"],"c":0}],"essay":[{"q":"اشرح كيف تعمل HTML وCSS وJavaScript معاً لتكوين صفحة ويب متكاملة.","m":"صفحة الويب الحديثة تركيبة من تقنيات وليست تقنية واحدة. يبني HTML بنية الصفحة وهيكلها، وينسّق CSS مظهرها، وتجعلها JavaScript تفاعلية وتضيف السلوك. وقد تستخدم الصفحة HTML وحده أو معه CSS وJavaScript بحسب الوظائف المطلوبة. وتجعل HTML الدلالية والتصميم المتجاوب وأطر العمل بناءها ذا معنى وقابلاً للتكيف وفعّالاً."},{"q":"اذكر مثالاً على عنصر HTML دلالي، واشرح فائدته في تحسين الوصول.","m":"مثال: عنصر <nav>، وهو عنصر دلالي مخصص لروابط التنقل. فائدته في تحسين الوصول أنه يوضح وظيفة هذا الجزء من الصفحة، فيساعد قارئ الشاشة على فهم بنية الصفحة والتنقل فيها بسهولة. ويلزم مع ذلك الاعتماد على ممارسات وصول أخرى أيضاً."},{"q":"اشرح مفهوم «الأولوية للجوال» في التصميم المتجاوب، ولماذا يُستخدم؟","m":"مفهوم الأولوية للجوال أن يراعي المطورون الشاشات الصغيرة منذ بداية التصميم، فتُصمم الصفحة أولاً للهاتف ثم تتكيف مع الشاشات الأكبر. ويُستخدم لأن كثيراً من الناس يستخدمون الويب عبر الهواتف، فتكون الصفحة مناسبة وسهلة الاستخدام على الشاشات الصغيرة."},{"q":"اذكر اثنين من مكتبات وأطر العمل الشائعة لتطوير الويب موضحاً خصائصها.","m":"(1) React: مكتبة JavaScript لبناء واجهات المستخدم من مكونات قابلة لإعادة الاستخدام، وتحديثها عند تغير البيانات. (2) Vue: له بنية بسيطة ويتيح بناء تطبيقات الويب تدريجياً بدءاً من مزايا صغيرة. ومن الأطر أيضاً Next.js المبني على React، ويوفر التوجيه وطرقاً مختلفة لعرض الصفحات."}]},{"n":"التقييم الأسبوعي — النموذج (C)","k":"exam","p":"ص٦١","mcq":[{"q":"أي من التقنيات التالية تُستخدم لإضافة السلوك التفاعلي للصفحة؟","o":["HTML","CSS","JavaScript","SQL"],"c":2},{"q":"العنصر <footer> في HTML يُستخدم لـ:","o":["عرض المحتوى الرئيسي","عرض التذييل في أسفل الصفحة","عرض العنوان الرئيسي","التنقل بين أجزاء الموقع"],"c":1},{"q":"رمز «الأولوية للجوال» في التصميم المتجاوب يعني:","o":["تصميم الصفحة أولاً لأجهزة الكمبيوتر","تصميم الصفحة أولاً للشاشات الصغيرة مثل الهواتف","استخدام JavaScript لإضافة تفاعلية","تحسين سرعة الخادم"],"c":1},{"q":"أي مما يأتي يُعد إطار عمل JavaScript يتيح بناء تطبيقات تدريجياً؟","o":["React","Vue","Next.js","HTML"],"c":1}],"essay":[{"q":"كيف تضيف JavaScript التفاعلية إلى صفحة الويب مع مثال عملي؟","m":"تجعل JavaScript الصفحة تفاعلية بإضافة السلوك إليها، فتستجيب لما يفعله المستخدم وتحدّث الصفحة. مثال: عند ضغط المستخدم زراً في الصفحة تعرض JavaScript قائمة أو رسالة أو تغير محتوى جزء من الصفحة، دون الاكتفاء بالعرض الثابت الذي يوفره HTML وحده."},{"q":"اذكر فوائد استخدام HTML الدلالية بالنسبة لمحركات البحث.","m":"يستخدم HTML الدلالي عناصر توضح وظيفة أجزاء الصفحة مثل header وnav وmain وfooter. وقد يساعد ذلك محركات البحث على فهم بنية المحتوى بصورة أفضل، لكنه لا يضمن ترتيباً أعلى في نتائج البحث."},{"q":"وضّح كيف يساعد التصميم المتجاوب في تحسين تجربة المستخدم على الهواتف الذكية.","m":"يضبط التصميم المتجاوب تخطيط الصفحة تلقائياً وفق حجم الشاشة، فتتكيف الصفحة مع الشاشة الصغيرة للهاتف الذكي وتسهل قراءتها واستخدامها. وبما أن كثيراً من الناس يستخدمون الويب عبر الهواتف، يراعي المطورون الشاشات الصغيرة منذ بداية التصميم (الأولوية للجوال)، فتتحسن تجربة المستخدم."},{"q":"ناقش دور إطار العمل Next.js في تطوير تطبيقات الويب الحديثة.","h":1}]}],"4-1":[{"n":"أولاً: المهام الأدائية (الفترة الأولى)","k":"classwork","p":"ص٦٣","mcq":[{"q":"أي من الوسائط التالية يتميز بنقل الصوت فقط، وغالباً ما يكون الاتصال فيه باتجاه واحد مع إمكانية الاستماع إليه أثناء التنقل؟","o":["التلفزيون","الراديو","الصحيفة","الموقع الإلكتروني"],"c":1},{"q":"ما إحدى قيود المواقع الإلكترونية؟","o":["لا يمكن تحديث معلوماتها في أي وقت.","تفتقر إلى إمكانية التفاعل ثنائي الاتجاه.","تحتاج معظم وظائفها إلى اتصال بالشبكة.","تقتصر على عرض النصوص فقط دون الوسائط المتعددة."],"c":2}],"essay":[{"q":"قارن بين خصائص كل من التلفزيون والراديو من حيث نوع المعلومات المنقولة وطريقة الاتصال.","m":"التلفزيون ينقل الفيديو والصوت معاً، ويمكنه الوصول إلى جمهور كبير في وقت واحد، وعادةً يكون الاتصال فيه من المرسل إلى المتلقي، أي باتجاه واحد. أما الراديو فينقل الصوت فقط، ويمكن الاستماع إليه أثناء التنقل أو أداء مهام أخرى بحسب التغطية ووسيلة الاستقبال، وعادةً يكون الاتصال فيه باتجاه واحد أيضاً."},{"q":"اشرح نقاط القوة والقيود الأساسية للمواقع الإلكترونية مقارنة بوسائل الإعلام التقليدية.","m":"نقاط القوة: يجمع الموقع الإلكتروني بين النص والصور والصوت والفيديو، ويمكن تحديثه في أي وقت، ويتيح تفاعلاً ثنائي الاتجاه عبر النماذج والتعليقات، بينما التلفزيون والراديو والصحيفة عادةً باتجاه واحد. القيود: يعتمد استخدامه على جهاز واتصال بالشبكة، على عكس الصحيفة المطبوعة التي تُقرأ دون اتصال بالإنترنت، كما أن الوصول إلى جمهور كبير في وقت واحد ميزة معروفة للتلفزيون. ويعتمد اختيار الوسيلة على الرسالة والجمهور والموارد."}]},{"n":"ثانياً: أداءات منزلية (الفترة الأولى)","k":"homework","p":"ص٦٣","mcq":[{"q":"ما الوسيلة الأنسب المذكورة للغرض المتمثل في إيصال معلومات حملة ترويجية مباشرة ومخصصة لأشخاص محددين؟","o":["التلفزيون","الموقع الإلكتروني","البريد الإلكتروني أو الرسائل المباشرة","الراديو"],"c":2},{"q":"ماذا يُقصد بمصطلح الاتصال ثنائي الاتجاه في الوسائط الرقمية؟","o":["اتصال يكون من المرسل إلى المستقبل فقط دون أي رد.","إمكانية الاستجابة والمشاركة من قبل المستخدمين من خلال النماذج والتعليقات.","قراءة محتوى مطبوع دون أي اتصال بالإنترنت.","الاستماع إلى البث الصوتي أثناء أداء مهام أخرى."],"c":1}],"essay":[{"q":"وضح الغرض والوسيلة المناسبة عند الرغبة في إعلام عدد كبير من الناس في آن واحد باستخدام الفيديو.","m":"الغرض: إعلام عدد كبير من الناس في آن واحد بالصورة والصوت. والوسيلة المناسبة: التلفزيون، لأنه يستطيع الوصول إلى جمهور كبير في وقت واحد ويجمع بين الصورة والصوت. ويمكن أيضاً الجمع بينه وبين وسائط أخرى مثل وسائل التواصل الاجتماعي لانتشار المعلومات بسرعة."},{"q":"لماذا تلجأ المؤسسات في الواقع العملي إلى استخدام عدة وسائط معاً (مثل توجيه المشاهد من إعلان تلفزيوني إلى موقع إلكتروني) بدلاً من وسيلة واحدة؟","m":"لأن لكل وسيلة نقاط قوة وقيوداً مختلفة، ويعتمد الاختيار على الرسالة والجمهور والموارد. فالتلفزيون يصل إلى جمهور كبير في وقت واحد لكنه عادةً باتجاه واحد، أما الموقع الإلكتروني فيجمع أنواع المعلومات ويمكن تحديثه ويتيح التفاعل. لذلك يوجه الإعلان التلفزيوني المشاهد إلى الموقع الإلكتروني، فتجمع المؤسسة بين الانتشار الواسع والتفاصيل والتفاعل، وتكمّل كل وسيلة الأخرى."}]},{"n":"أولاً: المهام الأدائية (الفترة الثانية)","k":"classwork","p":"ص٦٤","mcq":[{"q":"أي من الوسائط التالية تبقى موجودة مادياً كوسيلة مطبوعة ويمكن قراءتها دون اتصال بالإنترنت؟","o":["التلفزيون","وسائل التواصل الاجتماعي","الصحيفة","الموقع الإلكتروني"],"c":2},{"q":"أي من الخيارات التالية يمثل الغرض الأنسب لاستخدام وسائل التواصل الاجتماعي؟","o":["تقديم معلومات تفصيلية ومنظمة في صفحات وأقسام متعددة.","إتاحة معلومات مطبوعة ورقية دون اتصال.","الانتشار عن طريق التناقل الشفهي ونشر المعلومات بسرعة ومشاركتها.","إيصال معلومات فردية ومباشرة لشخص محدد فقط."],"c":2}],"essay":[{"q":"كيف تختلف الصحيفة عن الموقع الإلكتروني من حيث طبيعة الوسائط المتاحة وإمكانية الاتصال والتحديث؟","m":"الصحيفة وسيلة مطبوعة تبقى موجودة مادياً وتنقل النصوص والصور وتُقرأ دون اتصال بالإنترنت، ولا يمكن تحديث ما طُبع فيها، واتصالها باتجاه واحد من المرسل إلى القارئ. أما الموقع الإلكتروني فيجمع النص والصور والصوت والفيديو معاً، ويمكن تحديثه في أي وقت، ويتيح تفاعلاً ثنائي الاتجاه عبر النماذج والتعليقات، لكنه يحتاج غالباً إلى اتصال بالشبكة."},{"q":"اذكر وسيلة إعلامية مناسبة لتحقيق انتشار واسع وسريع للمعلومات، مع بيان سبب اختيارها.","m":"وسائل التواصل الاجتماعي، لأنها تتيح للمستخدمين نشر المعلومات ومشاركتها والتفاعل معها بسرعة، فتنتشر المعلومة بين الناس بالتناقل الشفهي. ويصلح التلفزيون أيضاً لإعلام عدد كبير من الناس في آن واحد."}]},{"n":"ثانياً: أداءات منزلية (الفترة الثانية)","k":"homework","p":"ص٦٤","mcq":[{"q":"ما الذي يميز وسائل التواصل الاجتماعي عن الوسائط التقليدية مثل التلفزيون والراديو؟","o":["تقتصر على اتجاه واحد من المرسل إلى المستقبل.","قدرتها على نشر المعلومات بسرعة وتمكين المستخدمين من النشر والمشاركة والتفاعل.","كونها وسيلة مطبوعة تبقى موجودة مادياً دون الحاجة لكهرباء.","نقل الصوت فقط دون أي صور أو نصوص."],"c":1},{"q":"عند اختيار الوسيلة الإعلامية المناسبة لنقل المعلومات، على ماذا يعتمد الاختيار بشكل أساسي؟","o":["الغرض والجمهور المستهدف والموارد المتاحة.","تفضيل الوسائل الورقية حصراً في جميع الأحوال.","تجنب استخدام الإنترنت تماماً.","الاكتفاء بوسيلة واحدة لجميع أنواع الجماهير."],"c":0}],
